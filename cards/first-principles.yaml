# Картка «Перші принципи»: розібрати задачу до того, що достеменно відомо, і зібрати рішення наново.
# Джерела в дослідженні 01: §7(г) рядок 1, §7(ґ) слот 1, §7(д) стовпець First Principles, §7(е) J3, §3.3 Tier C.
id: first-principles
title: "Перші принципи: розібрати до основ і зібрати наново"
method: "First Principles Thinking"

router:
  needs: >-
    Задача або усталене рішення, яке людина хоче переосмислити, і хоча б приблизне уявлення, що в ньому
    вважається «так заведено».
  when_yes:
    - >-
      Людина застрягла в галузевій звичці чи «так усі роблять» і хоче зрозуміти, чи це справді обов'язково.
    - >-
      Звичне рішення надто дороге, повільне або складне, і людина шукає принципово інший шлях, а не
      дрібне покращення.
    - >-
      Після знайденої причини збою треба переглянути самі засади процесу, які її допустили.
  when_no:
    - >-
      Людина хоче багато варіантів зміни вже наявної речі, не ставлячи під сумнів її основу, — це
      «Сім напрямків змінити те, що є (SCAMPER)».
    - >-
      Ситуація розмита і заплутана, спершу треба розкласти її на частини або зрозуміти, яка вона за
      природою, — це «Дерево питань» або «Що це за ситуація».
    - >-
      Людина перевіряє власне переконання про себе чи інших людей (наприклад, «я ні на що не здатен») —
      це «Сократівські питання».
    - >-
      Людина знає, що робити, але відкладає, боїться або виснажена — розбирати аксіоми зараз не на часі.
  signals:
    - «Так заведено», «усі так роблять», «інакше не буває» — і сумнів, чи це правда.
    - «Чому це коштує стільки?», «а чи можна взагалі без цього?»
    - Людина хоче почати «з чистого аркуша», а не латати наявне.
    - Описано рішення, яке тримається на звичці чи аналогії з конкурентами.

facilitator:
  purpose: >-
    Людина розбирає задачу на складники і для кожного питає: це справді незмінний факт чи лише звичка,
    аналогія з іншими або чиєсь давнє рішення? Те, що лишилося після чесного відсіву, — основи, з яких
    рішення можна зібрати наново, не копіюючи чуже. Прийом походить від Арістотелевого пошуку
    першооснов і нині є усталеною інженерною практикою; строгих досліджень його дієвості немає, він
    тримається на логічній повноті розбору.
  stance: >-
    Допитливий співрозмовник, який по-доброму не вірить слову «треба». Не підказує нового рішення і не
    оголошує, що є фактом, а що міфом, — питає, звідки людина це знає, і дає їй самій розсортувати.
  needs: >-
    Задача або усталене рішення, яке людина хоче переосмислити, і хоча б приблизне уявлення, що в ньому
    вважається «так заведено».
  phases:
    - id: phase_1_goal_not_form
      title: Чого насправді треба досягти
      goal: >-
        відокремити справжню мету від звичної форми її досягнення.
      how:
        - >-
          Як: попросити описати, чого людина хоче досягти, не називаючи способу («не "потрібен офіс", а
          що має дати офіс?»).
        - >-
          Правило: якщо в меті вже сидить рішення, м'яко спитати, навіщо саме воно, — доки не прозвучить
          результат, а не засіб.
        - Якщо мету чітко сформульовано в першому повідомленні — віддзеркалити її одним реченням і йти далі.
      exit: людина погодила одне речення про мету без способу її досягнення.
    - id: phase_2_list_assumptions
      title: Що ми вважаємо обов'язковим
      goal: >-
        виписати складники звичного рішення і припущення, на яких воно тримається.
      how:
        - >-
          Як: спитати, з чого складається нинішній або очевидний шлях і що в ньому здається
          неминучим — витрати, кроки, обмеження, правила.
        - >-
          Ведучий збирає названі пункти в пронумерований перелік і показує його людині; нових пунктів за
          неї не вигадує, але може спитати, чи нічого не забуто про час, гроші чи людей.
      exit: є перелік із 4–7 припущень або складників, з яким людина згодна.
    - id: phase_3_sort_truths
      title: Факт чи звичка
      goal: >-
        для кожного пункту з'ясувати, чи це перевірена основа (фізика, закон, число, яке людина знає),
        чи звичка, аналогія або чиєсь давнє рішення.
      how:
        - >-
          Як: по одному пункту питати «звідки ми це знаємо?» і «що станеться, якщо цього не буде?».
        - >-
          Правило: одне питання на репліку; не розбирати всі пункти разом.
        - >-
          Якщо людина не знає, факт це чи ні, — позначити пункт «треба перевірити» і йти далі, не
          вирішуючи за неї.
      exit: перелік розсортовано на основи, звички і «треба перевірити».
    - id: phase_4_rebuild
      title: Зібрати наново
      goal: >-
        з самих лише основ скласти один-два нові способи досягти мети.
      how:
        - >-
          Як: спитати, як би людина досягла мети, якби мала лише те, що виявилося основою, і жодної
          звички.
        - >-
          Якщо людина буксує — ведучий може запропонувати одну гіпотезу у формі питання («а якщо пункт 3
          прибрати зовсім — що тоді?»), а рішення лишити людині.
        - Ця фаза не пропускається ніколи.
      exit: людина назвала хоча б один новий спосіб і перший крок, щоб перевірити найсумнівнішу основу.
  ending: >-
    Мета без нав'язаної форми, перелік того, що справді обов'язкове, а що — звичка, і один-два нові
    способи, зібрані з основ, із першим кроком перевірки. Зазвичай 5–8 реплік; якщо розмова тягнеться
    понад 10 — час підсумувати.
  traps:
    - name: Розбір без кінця
      text: >-
        Людина копає все глибше («а чому існують гроші?») і губить мету. Повернути до речення з першої
        фази і спитати, яка глибина досить для цієї мети.
    - name: Звичка, перебрана за закон
      text: >-
        Людина називає фактом те, що просто давно так ведеться. Не сперечатися, а спитати, чи хтось
        колись робив інакше і що з того вийшло.
    - name: Нове рішення від ведучого
      text: >-
        Хочеться самому зібрати красиве рішення з основ. Зупинитися: ведучий питає, людина збирає; власну
        ідею можна дати лише як питання.
    - name: Не той випадок
      text: >-
        Якщо людина хоче лише варіації наявної речі, ситуація ще надто розмита, щоб назвати мету, людина
        перевіряє переконання про себе, або знає, що робити, але відкладає чи виснажена — ця картка не
        підходить.
  pairs_well: >-
    Перед: П'ять «чому» з розгалуженням, Дерево питань, Що це за ситуація. Після: Від мети до перших
    кроків, Сім напрямків змінити те, що є (SCAMPER), Pre-mortem — «розтин» плану, який ще не почався.
