# Картка WRAP — процес важкого рішення за Ч. і Д. Хітами: ширше, перевірити, відступити, підготуватися.
# Джерела в research 01: §7(ґ) слот 6, §7(г) рядок 24, §7(а) рядки 4 і 8, §7(д) правило 3, §7(е) J6, §2 narrow framing.
id: wrap-decision
title: Важке рішення — ширше, перевірити, відступити, підготуватися (WRAP)
method: "WRAP"

router:
  needs: >-
    Рішення, яке людина має ухвалити, хоча б у вигляді «чи робити мені X?», і відчуття, що ставки
    високі.
  when_yes:
    - >-
      Людина зводить рішення до «так чи ні» щодо однієї дії (звільнитися чи ні, підписати чи ні) і не
      бачить інших шляхів.
    - >-
      Рішення важко або неможливо скасувати, ставки високі (кар'єра, переїзд, великі гроші, угода), а
      сама ситуація розмита.
    - Людина спокійна і має час на розмову у 8–10 реплік.
  when_no:
    - >-
      Варіанти вже чітко названі (три–п'ять), критерії зрозумілі, і треба лише зважити їх між собою — це
      зважене порівняння.
    - >-
      Людина в тривозі чи паралічі, часу обмаль або рішення легко скасувати — тут досить швидкої перевірки
      оборотності, повний процес лише перевантажить.
    - >-
      Людина вже знає, що правильно, але боїться діяти, або вже обрала план і хоче лише перевірити його на
      ризики.
    - Обидва шляхи захищають справжні потреби, які здаються непримиренними, — це дилема, а не вибір.
  signals:
    - Питання у формі «чи варто мені…?», «робити чи ні?».
    - Згадано незворотну дію — звільнитися, продати, переїхати, підписати довгий контракт.
    - Людина каже, що інших варіантів немає або що «вибір лише один».
    - Бракує важливих даних, і людина не знає, як їх перевірити.

facilitator:
  purpose: >-
    Важкі рішення псуються кількома передбачуваними пастками: вузькою рамкою «так чи ні», пошуком лише
    підтверджень, короткочасною емоцією і надмірною впевненістю в тому, як усе складеться. Чіп і Ден Хіти
    (2013) звели дослідження Ларріка, Канемана і Кляйна в чотири кроки проти цих пасток: розширити
    варіанти, перевірити припущення реальністю, відступити на відстань перед вибором і підготуватися до
    того, що можна помилитися. Ларрік (2004) показав, що заклики «бути об'єктивним» не працюють — працюють
    зовнішні процедури, що змінюють погляд; цей процес і є такою процедурою.
  stance: >-
    Супутник, який не дає звузити простір надто рано. Ведучий не пропонує власних варіантів як готових
    і не каже, що обрати; він питає так, щоб варіанти, перевірки і пріоритети назвала сама людина.
  needs: >-
    Рішення, яке людина має ухвалити (навіть у вигляді «чи робити X?»), і приблизний строк, до якого
    його треба ухвалити.
  phases:
    - id: phase_1_widen_options
      title: Ширше за «так чи ні»
      goal: >-
        вивести людину з вузької рамки і мати хоча б три справжні варіанти замість одного «робити чи ні».
      how:
        - >-
          Як: спитати, що б людина робила, якби обидва очевидні шляхи раптом зникли, — що лишилося б
          можливим?
        - >-
          Як: запропонувати подумати «і те, і те» замість «або — або»: чи можна поєднати частини варіантів
          або зробити крок поступово?
        - >-
          Якщо людина каже, що інших варіантів немає, — спитати, хто в схожій ситуації вчинив інакше і як.
      skip_if: людина вже назвала три чи більше справжніх варіанти, і жоден із них не підставний.
      exit: є щонайменше три варіанти, які людина вважає реальними, або вона свідомо підтвердила, що їх два.
    - id: phase_2_reality_test
      title: Перевірити реальністю
      goal: >-
        знайти, які припущення тримають кожен варіант, і як їх перевірити до остаточного вибору.
      how:
        - >-
          Як: спитати, що мало б виявитися правдою, щоб улюблений варіант був найкращим, і що вказало б
          на протилежне.
        - >-
          Як: запитати про погляд ззовні — як зазвичай складається в людей, що робили подібне, і де про це
          дізнатися.
        - >-
          Правило: шукати малий дешевий спосіб спробувати варіант до того, як ставити все (розмова, тиждень
          пробної роботи, пілот).
      exit: людина назвала 1–2 перевірки, які зробить до рішення, або пояснила, чому їх не треба.
    - id: phase_3_distance
      title: Відступити на відстань
      goal: >-
        відокремити короткочасну емоцію від того, що для людини важить надовго.
      how:
        - >-
          Як: спитати, що б вона порадила близькому другові в точнісінько такій ситуації.
        - >-
          Як: спитати, як вона почуватиметься щодо кожного варіанта через десять хвилин, десять місяців і
          десять років.
        - >-
          Як: попросити назвати 1–2 речі, які для неї головні в житті чи справі, і подивитися, який варіант
          їм служить.
      exit: людина назвала, що для неї головне, і сказала, чи її вибір тримається на цьому, а не на настрої.
    - id: phase_4_prepare_to_be_wrong
      title: Підготуватися помилитися
      goal: >-
        визначити межі можливого результату і ранній сигнал, що час переглянути рішення.
      how:
        - >-
          Як: спитати, яким може бути найкращий і найгірший реалістичний результат обраного варіанта і що
          людина зробить у найгіршому разі.
        - >-
          Як: допомогти сформулювати «сигнал перегляду» — число або дату, після якої людина повертається до
          рішення («якщо до березня не буде двох клієнтів — переглядаю»). Формулювання — людини.
        - Ця фаза не пропускається ніколи.
      exit: є межі результату і щонайменше один сигнал перегляду з числом або датою.
  ending: >-
    Ширший вибір, ніж на початку, перевірки до рішення, названі власні пріоритети і сигнал, коли
    повернутися до рішення. Зазвичай 7–10 реплік; якщо розмова тягнеться понад 12 — час підсумувати.
  traps:
    - name: Підставні варіанти
      text: >-
        Людина додає варіанти, які сама не розглядає всерйоз, лише щоб «було три». Спитати, чи вона справді
        могла б обрати кожен із них; якщо ні — шукати далі або чесно лишити два.
    - name: Перевірка без кінця
      text: >-
        Людина знову і знову хоче «ще трохи даних» і відкладає рішення. Спитати, яка саме інформація
        змінила б вибір і до якої дати вона її отримає; решту відпустити.
    - name: Чужі пріоритети
      text: >-
        На кроці відстані людина називає те, що «має бути важливим» (думку батьків, статус). Спитати, чи це
        її власне, і що лишиться, якщо ніхто не дізнається про вибір.
    - name: Не той випадок
      text: >-
        Якщо варіанти вже чіткі й треба лише зважити їх, якщо людина в тривозі чи часу обмаль, якщо рішення
        легко скасувати, якщо людина вже знає відповідь і боїться діяти, або якщо це дилема двох справжніх
        потреб — ця картка не підходить.
  pairs_well: >-
    Перед: Що це за ситуація: зрозуміла, складна, заплутана чи пожежа; Двері в один чи в обидва боки і
    10/10/10. Після: Зважене порівняння варіантів за власними цінностями; Pre-mortem — «розтин» плану,
    який ще не почався; Бажання, перешкода і план «якщо — то».
