# Картка «П'ять "чому" з розгалуженням»: від конкретного збою до причини в процесі і до зміни, що не дасть йому повторитися.
# Джерела в дослідженні 01: повна картка §7(в) «5 Whys» (L514), §7(г) рядок 10, §7(д) правило 4, §7(е) J3, §3.3 (Ohno 1988; Card 2017; Peerally et al. 2017).
id: five-whys
title: "П'ять «чому» з розгалуженням"

router:
  needs: >-
    Опис конкретного збою чи небажаної події, яка сталася або повторюється, і людина, яка знає, як
    влаштований процес, де це сталося.
  when_yes:
    - >-
      Стався конкретний збій, інцидент чи зрив строку, і людина знає процес зсередини та може пояснити,
      що до чого призвело.
    - >-
      Та сама неприємність повторюється в роботі чи власному розпорядку, і людина хоче знайти причину,
      а не латати наслідки.
    - >-
      Потрібна швидка діагностика за кілька реплік із виходом на конкретну зміну.
  when_no:
    - >-
      Людина не знає, як воно влаштоване, і може лише гадати, але бачить, де проблема є, а де її немає
      («лише на Android і лише ввечері»), — це «Є / не є».
    - >-
      Питання широке і стратегічне («чому конкуренти ростуть швидше»), а не одна подія, — це «Дерево
      питань».
    - >-
      Людина відкладає, зривається чи не може змусити себе діяти — допит «чому» обернеться
      самозвинуваченням; це «Бажання, перешкода і план "якщо — то"».
    - >-
      Людина звинувачує когось у гніві чи гостро переживає провину — «чому» звучатиме як допит; це
      «Осмислити досвід і переглянути власне правило».
  signals:
    - «Знову зірвали реліз», «вже втретє запізнююся зі звітом», «клієнт пішов після пілоту».
    - Названо конкретну подію, час і видимий наслідок.
    - Людина описує, як іде процес, крок за кроком.
    - «Хочу докопатися до справжньої причини», «щоб більше не повторилося».

facilitator:
  purpose: >-
    Людина від конкретного збою крок за кроком спускається до умов і правил процесу, які його
    допустили, позначає, що з цього перевірений факт, а що здогадка, дозволяє причинам розгалужуватися
    і закінчує зміною в процесі, а не закликом бути уважнішим. Метод — усталена виробнича практика
    Таїчі Оно (1988) без підтвердження в строгих дослідженнях; Алан Кард (2017) і Пірелі зі
    співавторами (2017) показали його вади — одна лінійна причина, кабінетні здогадки і зупинка на
    винній людині, — тому в цій картці є розгалуження, позначка гіпотез і заборона зупинятися на провині.
  stance: >-
    Спокійний безоцінковий дослідник, який шукає вади в процесі, а не винних людей. Ніколи не питає
    голим «чому?»: щоразу вплітає попередню відповідь у питання про обставини. Причину називає людина.
  needs: >-
    Опис конкретного збою чи небажаної події, яка сталася або повторюється, і людина, яка знає, як
    влаштований процес, де це сталося.
  phases:
    - id: phase_1_define_problem
      title: Що саме сталося
      goal: >-
        погодити одне конкретне безоцінкове речення про те, що пішло не так і коли.
      how:
        - >-
          Як: попросити описати збій так, ніби його зняли на камеру: що сталося, де і в який момент
          помітили.
        - >-
          Якщо людина говорить узагальнено («клієнти незадоволені») — попросити один конкретний випадок.
        - >-
          Правило: не пускати в формулювання чиюсь провину («бо Іван не перевірив»).
      skip_if: людина в першому повідомленні вже чітко описала конкретний факт збою.
      exit: є одне речення про збій, з яким людина погодилася.
    - id: phase_2_chain_and_branches
      title: Ланка за ланкою
      goal: >-
        пройти від безпосередньої причини вниз до прогалини в процесі чи правилі, яку людина може
        змінити, фіксуючи паралельні гілки.
      how:
        - >-
          Як: щоразу питати про умови попередньої відповіді («що в процесі дозволило, щоб …?») і додавати,
          чи це перевірений факт, чи поки здогадка; ланок буде 3–6, не обов'язково п'ять.
        - >-
          Якщо названо дві незалежні причини — записати їх як гілку А і гілку Б і спитати, яку розбирати
          першою.
        - >-
          Якщо людина зупиняється на помилці людини — визнати помилку і спитати, чому процес не мав
          захисту від неї.
        - >-
          Якщо людина йде в те, чого не контролює («ринок упав»), — спитати, чому в процесі не було
          запобіжника на такий випадок.
      skip_if: >-
        людина вже назвала 1–2 рівні причин — віддзеркалити їх як перші ланки і питати одразу про
        наступну.
      exit: людина дійшла до прогалини в процесі чи правилі, яку вона може змінити.
    - id: phase_3_reverse_check_and_change
      title: Перевірка знизу вгору і зміна
      goal: >-
        перевірити ланцюжок у зворотному напрямку і сформулювати зміну в процесі, що не дасть збою
        повторитися.
      how:
        - >-
          Як: показати ланцюжок від кореня до збою («через те, що … — сталося … — і тому …») і спитати,
          чи кожна ланка справді веде до наступної.
        - >-
          Потім спитати, яка одна зміна на рівні кореня зробить повторення неможливим чи помітним
          заздалегідь.
        - >-
          Правило: відповіді «бути уважнішим» чи «нагадати команді» — не зміна; спитати, що саме
          зміниться в правилі, шаблоні чи перевірці.
        - Ця фаза не пропускається ніколи.
      exit: ланцюжок підтверджено, є конкретна зміна в процесі і перелік здогадок, які треба перевірити.
  ending: >-
    Ланцюжок причин (одна-дві гілки) від збою до прогалини в процесі, конкретна зміна в зоні контролю
    людини і перелік здогадок для перевірки. Зазвичай 5–8 реплік; якщо розмова тягнеться понад 10 — час
    підсумувати.
  traps:
    - name: Папуга
      text: >-
        Голе «чому? чому?» дратує, і людина відповідає односкладово. Щоразу вплітати її попередні слова в
        питання про обставини («що в налаштуваннях дозволило, щоб …?»).
    - name: Знайшли винного
      text: >-
        Людина зупиняється на «менеджер недбало поставився». Визнати це і спитати, чому процес не
        підстрахував від людської помилки.
    - name: Гадання без фактів
      text: >-
        Людина переходить на «ну, мабуть, щось із базою». Зупинити цю гілку, позначити її як здогадку для
        перевірки і спитати, які дані подивитися після розмови.
    - name: Не той випадок
      text: >-
        Якщо людина не знає механізму і бачить лише, де проблема є, а де немає, питання широке й
        стратегічне, людина відкладає чи не може змусити себе діяти, або гостро звинувачує себе чи
        інших — ця картка не підходить.
  pairs_well: >-
    Перед: Дерево питань, Є / не є: де проблема є, а де її немає, Сократівські питання. Після: Перші
    принципи, Від мети до перших кроків, Бажання, перешкода і план «якщо — то», Сім напрямків змінити
    те, що є (SCAMPER).
