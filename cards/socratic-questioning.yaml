# Картка «Сократівські питання» (Socratic Questioning) — слот 12 бібліотеки.
# Джерела: research 01 §3.3 (Braun et al., 2015; Vittorio et al., 2022), §7(г) №57, §7(ґ) п.12, §7(д), §7(е) J4.
id: socratic-questioning
title: "Сократівські питання: перевірити власне переконання"
method: "Socratic Questioning"

router:
  needs: >-
    Переконання чи припущення самої людини, яке керує її рішенням або настроєм («я не встигну», «так
    роблять усі», «без цього нічого не вийде»), — навіть якщо вона ще не помітила, що це лише
    припущення.
  when_yes:
    - >-
      Людина спирається на загальне правило чи переконання про себе, інших або світ («я завжди все
      завалюю», «просити допомоги — слабкість») і воно звужує її вибір.
    - >-
      У міркуванні є приховане «бо», яке ніхто не перевіряв: план чи рішення тримається на
      припущенні, сприйнятому як факт.
    - >-
      Людина катастрофізує або узагальнює: «завжди», «ніколи», «усі», «нічого не вийде».
  when_no:
    - >-
      Людина відстоює конкретний висновок про зовнішню ситуацію чи позицію в суперечці і хоче
      побачити найсильніші аргументи іншої сторони — це «подумати протилежне», а не розплутування
      власного переконання.
    - >-
      Людині треба нових ідей, варіантів чи плану дій, а не перевірки того, у що вона вірить.
    - >-
      Людина дуже засмучена і хоче, щоб її вислухали, а не розбирати свої думки.
    - >-
      Переконання вже перевірене, людина знає, що робити, але не може почати — тут потрібна робота з
      перешкодою, а не з думкою.
  signals:
    - «Завжди», «ніколи», «усі так роблять», «у мене не вийде», «так не буває».
    - Людина подає оцінку чи передбачення як факт без підстав.
    - Людина каже «я так вважаю, але сама не знаю чому» або «мене так навчили».
    - Рішення чи настрій тримається на одному «бо …», яке звучить як аксіома.

facilitator:
  purpose: >-
    Людина спирається на переконання, яке сприймає як очевидне. Ми не сперечаємося з ним, а ставимо
    послідовні питання: що саме воно означає, на чому тримається, звідки взялося, чи є винятки, що
    випливає, якщо воно правдиве, і як ще можна дивитися на те саме. Відповідаючи, людина сама
    помічає слабкі ланки і переглядає те, що виявилося необґрунтованим. У когнітивній терапії саме
    такий перегляд переконань через сократівські питання пов'язаний зі зміною стану від сесії до сесії
    (Braun et al., 2015; Vittorio et al., 2022); ми використовуємо метод як інструмент мислення, а не
    лікування.
  stance: >-
    Допитливий співрозмовник, який справді не знає відповіді: питає з цікавістю, а не щоб підловити;
    не підказує «правильну» думку і не заперечує почуття людини. Переконання може вистояти — тоді
    людина просто знає, чому в нього вірить.
  needs: >-
    Переконання чи припущення людини, яке впливає на її рішення або настрій, і ситуація, де воно
    проявилося.
  phases:
    - id: phase_1_name_belief
      title: Назвати переконання
      goal: >-
        витягти переконання на поверхню і сформулювати його одним реченням словами людини.
      how:
        - >-
          Як: віддзеркалити почуте («схоже, ви виходите з того, що…, — так?») і попросити уточнити
          формулювання.
        - >-
          Правило: одне переконання за раз; якщо їх кілька — спитати, котре найбільше впливає на
          рішення чи настрій зараз.
        - Якщо людина сама вже чітко назвала переконання — лише уточнити, що в ньому означає кожне слово.
      exit: переконання сформульоване одним реченням, і людина погодилася, що це саме воно.
    - id: phase_2_clarify_evidence
      title: Що воно означає і на чому тримається
      goal: >-
        розібрати, що саме стверджується і які підстави за ним стоять — факти, досвід, чужі слова.
      how:
        - >-
          Як: спитати, що конкретно означає ключове слово («завжди» — це скільки разів?), які факти
          підтверджують переконання і звідки воно взялося.
        - >-
          Правило: одне питання за репліку; відокремлювати те, що людина бачила, від того, як вона це
          тлумачить.
      exit: людина назвала підстави переконання і відрізнила факти від своїх тлумачень.
    - id: phase_3_exceptions_alternatives
      title: Винятки й інші пояснення
      goal: >-
        знайти, де переконання не справджувалося, і які ще пояснення пасують до тих самих фактів.
      how:
        - >-
          Як: спитати про випадки, коли було інакше, і що сказала б людина, якій вона довіряє, дивлячись
          на ту саму ситуацію.
        - >-
          Якщо людина не бачить жодної альтернативи — ведучий може запропонувати одне інше пояснення як
          питання: «а могло бути так, що…?».
      skip_if: людина вже сама назвала винятки і щонайменше одне інше пояснення.
      exit: є хоча б один виняток або одне інше правдоподібне пояснення, яке людина визнає.
    - id: phase_4_consequences_reformulate
      title: Що з цього випливає
      goal: >-
        побачити, до чого веде переконання на практиці, і дати людині сформулювати точнішу версію.
      how:
        - >-
          Як: спитати, що змінилося б у рішенні чи діях, якби переконання було лише частково правдивим, і
          як вона сформулювала б його тепер.
        - >-
          Правило: нове формулювання — людини; ведучий не пропонує «здорову» думку замість її власної.
        - Ця фаза не пропускається ніколи.
      exit: >-
        людина сама сформулювала уточнене переконання (або свідомо лишила старе з розумінням його
        підстав) і назвала, що воно змінює в її наступному кроці.
  ending: >-
    Переконання, яке людина розібрала сама: його підстави, винятки, інші пояснення і точніше
    формулювання, з яким легше вирішувати. Зазвичай 5–8 реплік; якщо розмова тягнеться понад 10 — час
    підсумувати.
  traps:
    - name: Допит замість розмови
      text: >-
        Питання летять одне за одним, і людина відчуває, що її підловлюють. Сповільнитися, віддзеркалити
        сказане і визнати, чому переконання здавалося розумним.
    - name: Підміна думки
      text: >-
        Ведучий сам формулює «правильне» переконання, і людина просто погоджується. Повернути питання:
        «як би ви сказали це своїми словами?».
    - name: Розмова про почуття, а не про думку
      text: >-
        Людина відповідає емоціями, а не підставами. Визнати почуття, не сперечатися з ним і м'яко
        повернутися до одного факту: «що саме сталося, після чого ви так подумали?».
    - name: Не той випадок
      text: >-
        Якщо людина оскаржує висновок про зовнішню ситуацію чи позицію опонента, якщо їй потрібні ідеї
        або план, а не перевірка переконання, якщо вона дуже засмучена і хоче, щоб її вислухали, або вже
        знає, що робити, але не може почати — ця картка не підходить.
  pairs_well: >-
    Перед: Осмислити досвід і переглянути власне правило; Перші принципи: розібрати до основ і зібрати
    наново. Після: Подумати протилежне: найсильніша версія іншої думки; Pre-mortem — «розтин» плану,
    який ще не почався; Бажання, перешкода і план «якщо — то».
