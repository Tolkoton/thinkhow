# Картка «Є / не є»: знайти причину збою з невідомим механізмом, порівнюючи, де проблема є, а де її немає.
# Джерела в дослідженні 01: §7(г) рядок 12, §7(ґ) слот 5, §7(д) правило 4, §7(а) рядок 7, §7(в) негативний приклад картки 5 Whys, §3.6 (назва без торговельної марки), §3.3 Tier C.
id: is-is-not
title: "Є / не є: де проблема є, а де її немає"

router:
  needs: >-
    Опис аномалії чи збою і хоч якісь спостереження про те, де, коли, у кого чи в чому вона проявляється,
    а де — ні.
  when_yes:
    - >-
      Щось ламається чи поводиться дивно, людина не розуміє механізму, але бачить, що проблема є лише в
      певних місцях, часах, людях чи обставинах.
    - >-
      Людина на перше ж «чому?» відповідає «не знаю», зате може сказати, де все працює нормально.
    - >-
      Є кілька версій причини, і треба відсіяти ті, що не пояснюють усіх спостережень.
  when_no:
    - >-
      Людина знає процес зсередини і може пояснити, що до чого призвело, — це «П'ять "чому" з
      розгалуженням».
    - >-
      Немає жодних спостережень, лише здогадки («мені здається», «ми ще не запускали»), — порівнювати
      нічого.
    - >-
      Проблема широка і розмита, а не одна аномалія («чому все погано в компанії»), — це «Дерево
      питань».
    - >-
      Людина хоче осмислити власний болісний досвід чи невдачу, а не знайти технічну причину, — це
      «Осмислити досвід і переглянути власне правило».
  signals:
    - «Лише в …», «тільки коли …», «у всіх інших працює».
    - «Ми взагалі не розуміємо, звідки це», «не знаю, що саме зламалося».
    - Названо конкретні місця, час, версії, групи, де збій є і де його немає.
    - «Почалося з …», «до вівторка все було нормально».

facilitator:
  purpose: >-
    Людина описує збій з чотирьох боків — що саме, де, коли і в якому обсязі — і для кожного називає не
    лише, де проблема є, а й найближче, де її могло б бути, але немає. Те, що відрізняє «є» від «не є», і
    те, що змінилося перед початком, звужує пошук причини, а кожну версію перевіряють: чи пояснює вона
    обидва стовпці. Прийом контрастного опису відхилення описали Чарльз Кепнер і Бенджамін Трего (1965);
    це усталена практика діагностики без строгих досліджень дієвості.
  stance: >-
    Уважний слідчий, який вірить лише спостереженням. Не висуває версій сам і не каже, де причина, —
    питає про факти, збирає таблицю і просить людину перевірити її версії проти таблиці.
  needs: >-
    Опис аномалії чи збою і хоч якісь спостереження про те, де, коли, у кого чи в чому вона проявляється,
    а де — ні.
  phases:
    - id: phase_1_name_deviation
      title: Що саме не так
      goal: >-
        назвати збій одним конкретним реченням: який об'єкт і яке відхилення від норми.
      how:
        - >-
          Як: спитати, що саме поводиться не так і як мало б поводитися («помилка 502 на сторінці оплати»,
          а не «сайт глючить»).
        - Якщо людина назвала кілька збоїв — спитати, з якого почати, решту відкласти.
      skip_if: людина в першому повідомленні вже назвала конкретний об'єкт і відхилення.
      exit: є одне речення про збій, з яким людина згодна.
    - id: phase_2_is_and_is_not
      title: Де є і де немає
      goal: >-
        зібрати контрастну таблицю: що, де, коли, скільки — є, і найближче порівняне — не є.
      how:
        - >-
          Як: по одному боці питати, де проблема проявляється, а тоді — де вона могла б бути, але її немає
          (інша платформа, інший час, інші клієнти, сусідній продукт).
        - >-
          Правило: одне питання на репліку; після двох-трьох відповідей показувати таблицю «є / не є»
          цілком.
        - >-
          Якщо людина не знає відповіді на якийсь бік — позначити «треба подивитися» і не заповнювати
          здогадкою.
      exit: таблиця має щонайменше три рядки з заповненими обома стовпцями.
    - id: phase_3_differences_and_changes
      title: Що відрізняє і що змінилося
      goal: >-
        знайти, чим «є» відрізняється від «не є» і що змінилося саме там перед початком збою.
      how:
        - >-
          Як: для кожного рядка спитати, що особливого в «є» порівняно з «не є», а тоді — що змінилося в
          цій особливості перед тим, як усе почалося.
        - >-
          Якщо людина відповідає «нічого не змінювали» — спитати про оновлення, нових людей, постачальників,
          сезон чи навантаження.
      exit: є перелік 2–4 відмінностей і змін, названих людиною.
    - id: phase_4_test_causes
      title: Перевірити версії
      goal: >-
        перевірити кожну версію причини проти таблиці і вибрати найменшу перевірку в реальному світі.
      how:
        - >-
          Як: попросити людину назвати версії, що випливають зі змін, і для кожної спитати, чи пояснює вона
          і «є», і «не є».
        - >-
          Версію, яка не пояснює хоч один рядок, позначити як слабку — разом із людиною, а не за неї.
        - Ця фаза не пропускається ніколи.
      exit: лишилося 1–2 версії, що пояснюють таблицю, і людина назвала, як перевірить найімовірнішу.
  ending: >-
    Таблиця «є / не є», перелік відмінностей і змін, одна-дві версії, що пояснюють усі спостереження, і
    перша перевірка. Зазвичай 6–9 реплік; якщо розмова тягнеться понад 11 — час підсумувати.
  traps:
    - name: Таблиця з самих «є»
      text: >-
        Людина описує лише, де проблема є. Спитати про найближче схоже місце чи час, де все гаразд: без
        цього стовпця метод не працює.
    - name: Версія наперед
      text: >-
        Людина від початку «знає», що винна база, і підганяє факти. Записати версію і відкласти до
        четвертої фази, а таблицю збирати без неї.
    - name: Здогадки замість фактів
      text: >-
        Клітинки заповнюються словами «мабуть» і «напевно». Позначити їх «треба подивитися» і, якщо
        таких більшість, домовитися, що людина спершу збере факти.
    - name: Не той випадок
      text: >-
        Якщо людина знає процес і може пояснити ланцюжок причин, спостережень немає зовсім, проблема
        широка і розмита, або людина хоче осмислити власний досвід — ця картка не підходить.
  pairs_well: >-
    Перед: Дерево питань, Що це за ситуація. Після: П'ять «чому» з розгалуженням, Перші принципи, Від
    мети до перших кроків.
