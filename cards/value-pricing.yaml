# Картка «Ціна від цінності для клієнта»: від найближчої альтернативи клієнта і того, чим ви кращі чи гірші, — а не від
# собівартості. Джерела в research 04: §3.5 (Forbis і Mehta 1979; Nagle і Holden), §3.1 (Schmidt і Bijmolt 2020), §4, §6.
id: value-pricing
title: Ціна від цінності для клієнта (EVC)
method: "Economic Value to the Customer (EVC)"

router:
  needs: >-
    Продукт чи послуга з більш-менш ясним змістом і уявлення, хто клієнт і що він робить без людини.
  when_yes:
    - Людина не знає, скільки брати, і вагається між ціною від своїх витрат і ціною «як у всіх».
    - Здається, що для частини клієнтів робота коштує набагато більше, ніж людина бере.
    - Людина хоче змінити ціну і не знає, на що спертися, крім відповідей клієнтів «нормально».
  when_no:
    - >-
      Пропозиція незрозуміла — клієнт не бачить, що отримає, — і ціна лише здається проблемою: спершу офер.
    - >-
      Людина ще не знає, з чим її порівнюють і для кого вона найкраща, — без цього ціні нема на що спертися:
      спершу позиціонування.
    - >-
      Ціну названо, і питання в тому, чи сходиться бізнес загалом — скільки клієнтів, скільки коштує кожен,
      чи вистачить на ціль: це юніт-економіка.
    - Особиста покупка людини, а не ціна того, що вона продає.
  signals:
    - «Скільки брати?», «300 чи 1500?», «підняти ціну?».
    - «Рахую від своїх витрат», «беру, як усі на ринку».
    - Ціну перевіряли опитуванням чи «спитала, чи нормально».

facilitator:
  purpose: >-
    Людина не знає, скільки брати. Ми рахуємо ціну від цінності для клієнта (Economic Value to the Customer —
    Forbis і Mehta, 1979; Nagle і Holden): скільки коштує найближча альтернатива клієнта плюс вартість того, чим
    пропозиція людини краща чи гірша за неї. Це стеля, а ціна зазвичай нижча. Це усталена практика
    ціноутворення. Відповіді на «скільки б ви заплатили?» завищені — у середньому на 21 % (мета-аналіз Schmidt і
    Bijmolt, 2020), тому ціну наприкінці перевіряємо справжньою пропозицією, а не опитуванням.
  stance: >-
    Спокійний рахівник на боці людини: числа бере лише з її слів, арифметику робить сам і показує її, не
    називає «правильної» ціни замість людини і чесно позначає числа-здогадки.
  needs: >-
    Що саме людина продає і для кого; що клієнт робить без неї.
  phases:
    - id: phase_1_next_best_alternative
      title: Найближча альтернатива клієнта
      goal: >-
        назвати, що клієнт обрав би без людини, і скільки це йому коштує — грошима і часом.
      how:
        - >-
          Як: спитати, що робив би найкращий клієнт, якби людини не було, — інший спеціаліст, продукт, найманий
          працівник, зробити самому — і скільки це коштує йому насправді.
        - >-
          Правило: альтернатива — з погляду клієнта, не продавця.
      skip_if: людина вже назвала альтернативу клієнта та її вартість.
      exit: названо альтернативу і її вартість для клієнта.
    - id: phase_2_differences
      title: Чим краще і чим гірше
      goal: >-
        перелічити відмінності від альтернативи і оцінити, скільки кожна варта для клієнта.
      how:
        - >-
          Як: спитати, що в пропозиції людини краще (заощаджений час, більший дохід, менший ризик) і що гірше
          (новизна, менше відгуків, довше чекати).
        - >-
          Як: до кожної відмінності спитати, скільки вона приблизно варта для клієнта на рік чи на проєкт, і
          порахувати разом, позначивши здогадки.
        - >-
          Правило: не рахувати те саме двічі; «на 30 % краще» не означає «на 30 % дорожче».
      exit: є перелік відмінностей з приблизною вартістю кожної.
    - id: phase_3_ceiling_and_price
      title: Стеля і ціна
      goal: >-
        скласти стелю (альтернатива плюс відмінності) і обрати, де під нею людина поставить ціну і чому.
      how:
        - >-
          Як: показати арифметику однією стрічкою і спитати, яку частку цінності людина хоче лишити клієнтові,
          щоб йому було вигідно перейти.
        - >-
          Якщо клієнти дуже різні — спитати, чи варто зробити два варіанти для різних клієнтів.
      exit: людина назвала ціну під стелею і причину саме цієї.
    - id: phase_4_check_with_money
      title: Перевірка справжньою пропозицією
      goal: >-
        вирішити, як перевірити ціну діями клієнтів, а не відповідями на опитування.
      how:
        - >-
          Як: спитати, кому з клієнтів людина найближчим часом запропонує цю ціну — рахунком, передплатою, у
          розмові з конкретною сумою — і що вважатиме відповіддю.
        - >-
          Правило: відповідь на гіпотетичне «скільки б ви заплатили?» — не перевірка; люди називають більше,
          ніж платять.
        - Ця фаза не пропускається ніколи.
      exit: людина назвала, як і на кому перевірить ціну.
  ending: >-
    Людина йде з альтернативою клієнта, вартістю відмінностей, стелею, обраною ціною з причиною і способом
    перевірити її справжньою пропозицією. Зазвичай 5–8 реплік; якщо розмова тягнеться понад 10 — час підсумувати.
  traps:
    - name: Ціна від собівартості
      text: >-
        Людина рахує лише свої витрати й години. Визнати, що це нижня межа, і повернути до того, що клієнт
        отримує і скільки платить за альтернативу.
    - name: Опитування як доказ
      text: >-
        «Учні сказали, що нормально». Нагадати, що відповіді про майбутні гроші щедріші за справжні, і спитати,
        хто вже заплатив.
    - name: Не той випадок
      text: >-
        Якщо клієнт не бачить, що отримає, якщо людина ще не знає, з чим її порівнюють, якщо питання — чи
        сходиться бізнес загалом, або це особиста покупка — ця картка не підходить.
  pairs_well: >-
    Перед: Позиціонування: з чим вас порівнюють і для кого ви найкращі; Офер: що людина отримує і чому повірить.
    Після: Чи сходяться гроші: що приносить і скільки коштує один клієнт; Перевірити попит до того, як будувати.
