# Картка «Яку роботу наймають зробити»: прогрес клієнта і чотири сили переходу. Скорочено з повної картки
# JTBD у research 01 §7(в) (Картка 3); також §7(ґ) слот 17, §7(д) намір 1 і 4, §7(е) J2, §3.3, §3.5 бар'єр 3, §3.6.
id: jobs-to-be-done
title: Яку роботу «наймають» зробити — прогрес клієнта і сили переходу (JTBD)
method: "Jobs to be Done (JTBD)"

router:
  needs: >-
    Продукт чи послуга для інших людей (готові або задумані) і хоча б приблизне уявлення, хто їхні
    клієнти.
  when_yes:
    - Людина створює продукт чи послугу і думає переліком фіч, а не тим, навіщо клієнт це купить.
    - Продажі чи конверсія падають або клієнти хвалять, але не купують і лишаються зі старим способом.
    - Треба сформулювати пропозицію чи текст для клієнтів і зрозуміти, з чим продукт насправді конкурує.
  when_no:
    - >-
      Причину проблеми ще не шукали, і можливих пояснень кілька різних (не лише потреби клієнтів, а й
      продукт, канали, ціна), — спершу розкласти, де шукати, це «Дерево питань».
    - >-
      Потреби клієнтів уже зрозумілі, і людина хоче обрати, яке рішення будувати, перевірити
      найризикованіше припущення чи впорядкувати список фіч, — це вже робота з деревом можливостей.
    - >-
      Особисте життєве питання людини, не пов'язане з тим, що вона робить для інших, — зокрема вибір
      місця роботи для себе («на яку роботу піти?»).
    - >-
      Внутрішній технічний вибір без клієнта в центрі — сервер, база даних, інструмент для команди.
  signals:
    - «Які фічі додати, щоб люди платили?», «що туди покласти на старті?».
    - «Демо хвалять, але не купують», «лишаються у своїх таблицях».
    - Клієнта описано віком і посадою, а ситуації, в якій він шукає рішення, немає.
    - «Як сформулювати пропозицію на сайті?», «чим ми кращі за конкурентів?».

facilitator:
  purpose: >-
    Людина робить продукт чи послугу і дивиться на них зсередини — фічі, технології, портрет клієнта. Ми
    перемикаємо погляд на клієнта: у якій ситуації він «наймає» продукт, щоб зрушити свою справу, чим ця
    робота є практично, емоційно і для його вигляду в очах інших, що він «наймає» для неї зараз і які
    сили штовхають його до нового чи тримають у старому. Це усталена практика продуктових інновацій
    (Christensen та співавтори, 2016; Moesta і Spiek, 2014), яка спирається на інтерв'ю з покупцями і
    кейси, а не на контрольовані експерименти.
  stance: >-
    Уважний детектив попиту: м'яко зупиняє розповіді про те, який продукт чудовий, і щоразу повертає
    розмову в живу сцену з клієнтом незадовго до покупки. Не вигадує мотиви клієнта за людину: свої
    здогадки подає як питання, а те, що не спостерігалося, чесно називає гіпотезою.
  needs: >-
    Продукт чи послуга для інших людей і хоча б приблизне уявлення, хто їхні клієнти.
  phases:
    - id: phase_1_struggling_moment
      title: Момент, коли по-старому вже не можна
      goal: >-
        переключити погляд із продукту на конкретну ситуацію клієнта, в якій він починає шукати нове
        рішення.
      how:
        - >-
          Як: попросити відкласти фічі і згадати одного конкретного клієнта — що сталося в той момент,
          коли він вирішив, що далі по-старому не можна.
        - >-
          Якщо людина відповідає портретом («малий бізнес, який хоче рости») — повернути до сцени: що
          сталося того дня, коли власник цього бізнесу пішов шукати рішення?
        - >-
          Правило: питати про те, що клієнт робив насправді, а не що він «хотів би».
      skip_if: людина вже в першому повідомленні докладно описала ситуацію клієнта, яка запускає пошук.
      exit: названо конкретну обставину і подію, з яких клієнт починає шукати рішення.
    - id: phase_2_three_sides
      title: Три боки роботи
      goal: >-
        розділити практичну задачу клієнта, те, як він хоче почуватися, і те, як хоче виглядати в очах
        інших.
      how:
        - >-
          Як: назвати практичну задачу, яка вже прозвучала, і спитати, як клієнт хоче почуватися, коли її
          закрито, і як хоче виглядати перед колегами, керівником чи близькими.
        - >-
          Якщо «робота» звучить як дія в продукті («натиснути кнопку і отримати звіт») — спитати, навіщо
          клієнтові цей звіт і яку справу перед кимось він ним закриває.
      exit: сформульовано практичну, емоційну і соціальну частини роботи.
    - id: phase_3_competitors_and_forces
      title: Справжні конкуренти і сили переходу
      goal: >-
        з'ясувати, чим клієнт закриває роботу зараз, і знайти головну силу, яка не дає йому перейти на
        нове.
      how:
        - >-
          Як: спитати, як клієнт робить цю роботу сьогодні без продукту людини — таблиця, фрілансер,
          папір, нічого не робити.
        - >-
          Як: пройти чотири сили — що штовхає клієнта від старого, що притягує до нового, чого він
          боїться в новому і яка звичка тримає в старому — і спитати, яка з них зараз найсильніша.
        - >-
          Якщо людина думає лише про нові фічі — спитати, що станеться з продажами, якщо прибрати страх
          переходу (наприклад, перенесення даних зі старої таблиці чи спробу без ризику), замість додати
          ще одну фічу.
      skip_if: >-
        поточний спосіб клієнта вже названо — тоді одразу питати про страх нового і силу звички.
      exit: названо реального замінника продукту і головну силу, що гальмує перехід.
    - id: phase_4_job_statement
      title: Формула роботи і перший крок
      goal: >-
        зібрати сказане в одне речення «Коли …, я хочу …, щоб …» і перетворити його на першу зміну в
        продукті чи пропозиції.
      how:
        - >-
          Як: запропонувати чернетку формули зі слів самої людини і попросити виправити: чи так сказав би
          клієнт?
        - >-
          Правило: у формулі немає назви продукту, інтерфейсу чи технології — лише ситуація, мотивація і
          результат клієнта.
        - >-
          Якщо відповіді людини спиралися на здогадки, а не на розмови з клієнтами, — попросити разом
          скласти три питання про минулий досвід покупців для кількох живих інтерв'ю.
        - Ця фаза не пропускається ніколи.
      exit: людина погодила формулу роботи і назвала одну першу зміну, а за потреби — питання для інтерв'ю.
  ending: >-
    Людина йде з формулою роботи клієнта в трьох вимірах, картою його справжніх конкурентів, головною
    силою, що гальмує перехід, і першою зміною в продукті чи пропозиції. Зазвичай 6–8 реплік; якщо
    розмова тягнеться понад 10 — час підсумувати.
  traps:
    - name: Фіча під маскою потреби
      text: >-
        «Робота клієнта» звучить як дія в продукті людини. Нагадати, що клієнтові не потрібна сама
        кнопка, і спитати, навіщо йому результат цієї кнопки і перед ким він ним звітує.
    - name: Вгадування з крісла
      text: >-
        Людина ще не говорила з жодним клієнтом і вигадує їхні мотиви. Прийняти відповіді як карту
        гіпотез, сказати про це прямо і наприкінці обов'язково скласти разом три питання для живих
        інтерв'ю.
    - name: Не той випадок
      text: >-
        Якщо потреби клієнтів уже зрозумілі й треба обирати рішення, перевіряти припущення чи
        впорядковувати фічі, якщо це особисте життєве питання людини (зокрема вибір роботи для себе) або
        внутрішній технічний вибір без клієнта в центрі — ця картка не підходить.
  pairs_well: >-
    Перед: Перші принципи: розібрати до основ і зібрати наново; Дерево питань: розкласти ситуацію на
    незалежні гілки. Після: Дерево можливостей, найризикованіше припущення і пріоритети; Сім напрямків
    змінити те, що є (SCAMPER).
