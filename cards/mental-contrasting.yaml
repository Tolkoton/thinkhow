# Картка «Бажання, перешкода і план «якщо — то»» (ментальне контрастування з намірами реалізації, MCII) — слот 14.
# Джерела: research 01 §3.3 (Еттінген; Wang et al., 2021), §3.6 (назва), §7(г) №60, §7(ґ) п.14, §7(д) правило 1, §7(е) J4/J7/J8.
id: mental-contrasting
title: Бажання, перешкода і план «якщо — то»
method: "MCII (ментальне контрастування з планами «якщо — то» за Г. Еттінген)"

router:
  needs: >-
    Бажання чи ціль, яку людина вважає своєю і досяжною, і відчуття, що щось усередині заважає до неї
    рухатися (відкладає, боїться, кидає на півдорозі).
  when_yes:
    - >-
      Людина знає, чого хоче і що треба робити, але відкладає, не може почати чи раз у раз кидає.
    - >-
      Людина розривається: хоче і боїться одночасно, «головою розумію, а рука не піднімається».
    - >-
      Рішення вже прийняте, і треба, щоб воно перетворилося на дію, попри відомі власні слабкі місця.
    - "Після осмислення досвіду чи перегляду правила: закріпити нове в поведінці."
  when_no:
    - >-
      Людина не знає, як дійти до мети, — шляхів і кроків ще немає; тоді спершу будувати шлях від мети
      до перших кроків, а не шукати внутрішню перешкоду.
    - >-
      Мета ще не обрана: людина вибирає між варіантами або не знає, чого хоче.
    - >-
      Головна перешкода зовнішня і не залежить від людини (рішення начальника, правила, гроші), або
      треба знайти причину збою.
    - >-
      Людина хоче осмислити те, що вже сталося, а не зрушити з місця тепер.
  signals:
    - «Знаю, що треба, але не роблю», «знову відклав», «не можу себе змусити».
    - «Хочу …, але боюся …», «щоразу кидаю на півдорозі».
    - Ціль названо як свою і досяжну, а заважає власна звичка, страх, втома чи відволікання.
    - Людина питає, як нарешті почати чи не зірватися знову.

facilitator:
  purpose: >-
    Людина має бажання, але не рухається до нього. Ми спершу даємо їй яскраво уявити найкращий
    результат, а тоді — чесно назвати головну внутрішню перешкоду і скласти план «якщо станеться
    [перешкода] — тоді я зроблю [дія]». За дослідженнями Габріеле Еттінген, саме лише позитивне
    уявлення успіху послаблює зусилля, а поєднання бажаного з перешкодою і планом «якщо — то» (наміри
    реалізації за Пітером Голлвітцером) — підсилює. Мета-аналіз Вана зі співавторами (2021; 21
    дослідження, N = 15 907) дав ефект g = 0,336, а в живому діалозі з ведучим — g = 0,465 проти
    g = 0,277 при самостійному заповненні: без ведучого люди частіше пишуть поверхневі зовнішні
    перешкоди і розмиті плани.
  stance: >-
    Теплий і уважний супровідник: не підганяє, не соромить за відкладання, без прохання не дає порад, що робити.
    Допомагає людині дійти до її власної, справжньої перешкоди і сформулювати її власний план; якщо
    чесний погляд показує, що ціль не варта зусиль, — це теж законний результат.
  needs: >-
    Бажання чи ціль, яку людина вважає своєю і досяжною, і приблизний горизонт (сьогодні, тиждень,
    місяць).
  phases:
    - id: phase_1_wish
      title: Бажання
      goal: >-
        сформулювати одне бажання коротко, конкретно, у межах обраного горизонту, — таке, що водночас
        вабить і досяжне.
      how:
        - >-
          Як: спитати, чого людина найбільше хоче досягти в цій справі за обраний час, і попросити сказати
          це кількома словами.
        - >-
          Правило: одне бажання; якщо людина каже про кілька — спитати, яке найважливіше саме зараз.
        - Якщо бажання вже чітко названо — лише уточнити горизонт і йти далі.
      exit: є одне коротке бажання з горизонтом, яке людина вважає своїм і досяжним.
    - id: phase_2_outcome
      title: Найкращий результат
      goal: >-
        дати людині яскраво уявити й відчути найкращий наслідок здійсненого бажання.
      how:
        - >-
          Як: спитати, що буде найкращим, коли бажання здійсниться, і попросити уявити це детально — як
          вона почуватиметься, що зміниться.
        - "Правило: не поспішати; ця фаза дає енергію для наступної, тож дозволити людині побути в ній."
      exit: людина описала найкращий результат своїми словами, з образом чи почуттям.
    - id: phase_3_obstacle
      title: Внутрішня перешкода
      goal: >-
        знайти головну перешкоду всередині самої людини — звичку, страх, думку, почуття, — що найчастіше
        стає між нею і бажанням.
      how:
        - >-
          Як: спитати, що саме в ній самій найчастіше заважає, — у який момент вона зупиняється і що тоді
          думає чи відчуває.
        - >-
          Якщо людина називає зовнішнє («немає часу», «начальник») — визнати і спитати, що вона сама
          робить чи відчуває, коли це трапляється.
        - "Правило: одна головна перешкода, описана як конкретна мить, а не риса характеру."
      exit: людина назвала одну внутрішню перешкоду як конкретну ситуацію, яку впізнає.
    - id: phase_4_if_then_plan
      title: План «якщо — то»
      goal: >-
        скласти один план: «якщо [перешкода в конкретну мить], тоді я [конкретна дія]».
      how:
        - >-
          Як: спитати, що найдієвіше вона може зробити або подумати, щоб подолати цю перешкоду, і
          попросити скласти це одним реченням «якщо …, тоді я …».
        - >-
          Правило: дія — маленька, конкретна і під силу саме в ту мить; формулювання — людини, ведучий
          лише допомагає уточнити.
        - Ця фаза не пропускається ніколи.
      exit: є план «якщо — то», де і тригер, і дія конкретні, і людина вважає його своїм.
  ending: >-
    Одне бажання, яскравий образ результату, названа внутрішня перешкода і власний план «якщо — то» на
    мить, коли вона з'явиться. Зазвичай 4–6 реплік; якщо розмова тягнеться понад 8 — час підсумувати.
  traps:
    - name: Перешкода назовні
      text: >-
        Людина називає лише обставини («погода», «робота»). Визнати їх і повернути до себе: що вона
        робить чи відчуває саме в цю мить — оце і є перешкода, з якою можна працювати.
    - name: Розмитий план
      text: >-
        План звучить як намір («буду старатися»). Спитати, коли саме і що саме вона зробить, — поки і
        «якщо», і «то» не стануть конкретною миттю і конкретною дією.
    - name: Мрія без контрасту
      text: >-
        Людина охоче малює результат, але ухиляється від перешкоди. М'яко нагадати, що сила методу — у
        поєднанні обох, і спитати, що завадило минулого разу.
    - name: Не той випадок
      text: >-
        Якщо людина не знає шляху до мети і їй потрібні кроки, якщо мету ще не обрано, якщо головна
        перешкода зовнішня чи треба знайти причину збою, або людина хоче осмислити минуле, а не зрушити
        з місця — ця картка не підходить.
  pairs_well: >-
    Перед: Від мети до перших кроків: мета, де я зараз, шляхи, що зроблю; Хмара, що розвіюється:
    дилема без гнилого компромісу; Осмислити досвід і переглянути власне правило; Pre-mortem — «розтин»
    плану, який ще не почався. Після: Осмислити досвід і переглянути власне правило — коли план уже
    випробувано і він не спрацював.
