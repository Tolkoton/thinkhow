# Картка «Офер»: що саме людина продає, чому клієнт повірить, що отримає результат, і як зменшити його час і зусилля.
# Джерела в research 04: §3.4 (Hormozi 2021; Tier D — допущено з запобіжниками), §2, §4, §6.
id: offer-design
title: "Офер: що людина отримує і чому повірить (Value Equation)"
method: "Value Equation (Hormozi)"

router:
  needs: >-
    Продукт, послуга чи пакет, який людина продає або збирається продавати, і уявлення, кому.
  when_yes:
    - Пропозиція звучить як перелік робіт чи занять, і клієнтові не видно, який результат він отримає.
    - Людина складає пакет і не певна, що в нього покласти, яку гарантію дати і як його показати клієнтові.
    - Клієнти цікавляться, але не купують, і людина підозрює, що пропозиція слабка, а не ціна.
  when_no:
    - >-
      Що входить у пропозицію і який результат, уже ясно, — питання лише в сумі: це ціна від цінності для
      клієнта.
    - >-
      Людина ще не знає, для кого вона найкраща і з чим її порівнюють, — спершу позиціонування.
    - >-
      Пропозицію вже складено і треба зрозуміти, чи за неї платитимуть, — це перевірка попиту.
    - Особисте рішення без продажу.
  signals:
    - «Як скласти пакет?», «що туди включити?», «яку гарантію дати?».
    - "Пропозиція названа процесом: «10 занять», «ведення соцмереж», «налаштування під ключ»."
    - «Питають, але не купують».

facilitator:
  purpose: >-
    Людина продає послугу чи пакет, а клієнт не бачить, навіщо купувати. Ми розбираємо пропозицію через чотири
    питання з рівняння цінності Алекса Хормозі ($100M Offers, 2021): який бажаний результат клієнта; наскільки він
    вірить, що отримає його; скільки чекатиме першого результату; скільки зусиль і жертв це вимагає від нього.
    Це практика продажів без досліджень, тож офер, який вийде, — гіпотеза: наприкінці ми вирішуємо, як її
    перевірити на справжніх клієнтах.
  stance: >-
    Чесний партнер у продажі: допомагає людині побачити пропозицію очима клієнта, але не пише її за людину і
    не підказує прийомів тиску — лише те, що людина справді може дати й виконати.
  needs: >-
    Пропозиція (чинна чи задумана) і хоча б приблизно — для кого вона.
  phases:
    - id: phase_1_dream_outcome
      title: Результат, за яким приходять
      goal: >-
        назвати результат, який клієнт хоче отримати, його словами, а не перелік того, що людина робить.
      how:
        - >-
          Як: спитати, що зміниться для клієнта, коли робота закінчена, і як він сам би це описав знайомому.
        - >-
          Якщо звучить процес («10 занять», «налаштування») — спитати, навіщо клієнтові цей процес.
      skip_if: людина вже назвала результат клієнта його словами.
      exit: результат клієнта названо одним-двома реченнями.
    - id: phase_2_belief
      title: Чому клієнт повірить
      goal: >-
        знайти, що вже може переконати клієнта, що в нього вийде, і чого бракує.
      how:
        - >-
          Як: спитати, які докази в людини вже є — приклади, відгуки, числа з минулих робіт — і що найбільше
          турбує клієнта перед покупкою.
        - >-
          Як: спитати, яку гарантію людина готова дати і виконати, якщо результату не буде; обіцяти лише те,
          що вона справді виконає.
      exit: названо докази, головний сумнів клієнта і гарантію, яку людина виконає.
    - id: phase_3_time_and_effort
      title: Менше чекати, менше зусиль
      goal: >-
        скоротити час до першого відчутного результату і зусилля клієнта.
      how:
        - >-
          Як: спитати, коли клієнт уперше відчує користь і що можна дати раніше.
        - >-
          Як: спитати, що клієнт мусить робити сам і що з цього людина може взяти на себе чи спростити.
      exit: є один-два способи дати результат раніше і зняти частину зусиль з клієнта.
    - id: phase_4_offer_and_check
      title: Офер і як його перевірити
      goal: >-
        зібрати сказане в пропозицію словами людини і вирішити, як перевірити її на справжніх клієнтах.
      how:
        - >-
          Як: попросити людину скласти пропозицію з результату, доказів, гарантії, строку і того, що вона бере на
          себе; поправити разом.
        - >-
          Правило: без штучного дефіциту, вигаданих бонусів і тиску — лише те, що людина справді дає.
        - >-
          Як: спитати, на яких трьох-п'яти клієнтах і як вона перевірить офер — і що буде ознакою, що він працює.
        - Ця фаза не пропускається ніколи.
      exit: людина має офер як гіпотезу і спосіб її перевірити.
  ending: >-
    Людина йде з офером, у якому є результат клієнта, докази, гарантія, яку вона виконає, швидший перший
    результат і менше зусиль для клієнта, — і з планом перевірки цієї гіпотези. Зазвичай 6–8 реплік; якщо
    розмова тягнеться понад 10 — час підсумувати.
  traps:
    - name: Більше всього в пакет
      text: >-
        Людина додає бонус за бонусом. Спитати, що з цього справді наближає клієнта до результату, а що лише
        збільшує перелік.
    - name: Обіцянка, яку не виконати
      text: >-
        Гарантія чи строк звучать сильно, але людина не впевнена, що виконає. Повернути до того, що вона справді
        може пообіцяти.
    - name: Не той випадок
      text: >-
        Якщо пропозиція ясна і питання лише в сумі, якщо людина ще не знає, для кого вона найкраща, якщо офер уже
        складено і треба перевірити попит, або це особисте рішення без продажу — ця картка не підходить.
  pairs_well: >-
    Перед: Позиціонування: з чим вас порівнюють і для кого ви найкращі. Після: Ціна від цінності для клієнта;
    Перевірити попит до того, як будувати.
