# Картка «Перевірити попит до того, як будувати»: гіпотеза з числами і найдешевший тест, у якому люди щось віддають.
# Джерела в research 04: §3.2 (Savoia 2019; Camuffo та ін. 2020, 2024), §3.1 (гіпотетичні відповіді), §4, §6.
id: demand-test
title: Перевірити попит до того, як будувати — гіпотеза з числами і найдешевший тест (pretotyping)
method: "Pretotyping і гіпотеза XYZ (Savoia)"

router:
  needs: >-
    Задум продукту, послуги чи пакета для інших людей, який ще не будували або не продавали, — і бажання
    дізнатися, чи за нього платитимуть.
  when_yes:
    - Людина збирається вкласти тижні чи гроші в нове і хоче спершу зрозуміти, чи хтось за це заплатить.
    - Знайомі й опитані кажуть «купив би», але реальних покупок ще не було — треба перевірка діями.
    - Треба наперед вирішити, скільки людей має відгукнутися, щоб продовжувати, а скільки — щоб зупинитися.
  when_no:
    - >-
      Продукт уже працює, є метрика і кілька ідей, як її рухати, — треба обрати рішення й перевірити його
      найризикованіше припущення: це дерево можливостей.
    - >-
      Попит уже видно — люди купують, — і питання, де знайти більше таких клієнтів: це канали.
    - >-
      Про клієнтів людина ще нічого не знає і спершу хоче з ними поговорити, щоб зрозуміти їхні клопоти: це
      розмови з клієнтами про їхнє минуле.
    - Особисте рішення без продукту чи послуги для інших.
  signals:
    - «Чи заплатять за це?», «як перевірити, що це комусь треба, поки я не зробила?».
    - «Друзі кажуть — супер», «у опитуванні всі за».
    - Задум ще не запущено, планується довга підготовка (курс, сайт, оренда, розробка).

facilitator:
  purpose: >-
    Людина має задум і хоче знати, чи за нього заплатять, перш ніж вкладати тижні чи гроші. Ми формулюємо
    гіпотезу числами — «щонайменше X % з Y зроблять Z» (Альберто Савойя, The Right It, 2019) — і обираємо
    найдешевший тест, у якому люди щось віддають: передпродаж, сторінка з кнопкою оплати, ручне виконання
    послуги замість продукту. Підхід «гіпотеза → тест» перевірено в рандомізованих дослідженнях: підприємці, яких
    навчили так працювати, ухвалювали кращі рішення і вчасніше закривали ідеї, що не працюють (Camuffo та ін.,
    2020; реплікація на 759 фірмах, 2024). Окремі техніки Савойї — практика, а не дослідження.
  stance: >-
    Тверезий експериментатор: радіє будь-якому чесному результату, зокрема «ні»; не дає підмінити тест
    опитуванням і наполягає, щоб поріг рішення людина назвала до тесту, а не після.
  needs: >-
    Задум і хоча б приблизне уявлення, хто мав би за нього платити.
  phases:
    - id: phase_1_hypothesis_in_numbers
      title: Гіпотеза числами
      goal: >-
        перетворити «люди захочуть» на речення «щонайменше X % з Y зроблять Z» зі словами людини.
      how:
        - >-
          Як: спитати, хто саме (Y — конкретна група, до якої людина може дотягнутися), що вони мають зробити (Z —
          дія з ціною чи зусиллям, а не «зацікавляться») і яка частка (X) зробила б задум вартим продовження.
        - >-
          Якщо людина не знає X — попросити оцінити, скільки покупців потрібно для її цілі, і з цього вивести
          частку; число — здогадка, і це сказати прямо.
      skip_if: людина вже назвала групу, дію і частку.
      exit: гіпотезу записано одним реченням з X, Y і Z.
    - id: phase_2_skin_in_the_game
      title: Тест, у якому люди щось віддають
      goal: >-
        обрати найдешевший тест на години чи дні, де відповідь — дія з ціною, а не слова.
      how:
        - >-
          Як: запропонувати людині назвати два-три способи і разом зважити кожен: передпродаж або передоплата,
          сторінка з ціною і кнопкою «купити», перший клієнт, якому послугу робиш руками, лист із пропозицією
          знайомим клієнтам.
        - >-
          Правило: опитування «чи купили б ви?» тестом не вважаємо — гіпотетичні відповіді завищені; відповідь
          тесту — гроші, час, контакт чи інше зобов'язання.
        - >-
          Якщо тест вимагає тижнів підготовки — спитати, що з нього можна прибрати, щоб запустити за кілька днів.
      exit: обрано один тест, який людина може запустити протягом тижня.
    - id: phase_3_threshold
      title: Поріг рішення наперед
      goal: >-
        до запуску вирішити, що означатиме результат: продовжувати, змінити задум чи зупинитися.
      how:
        - >-
          Як: спитати, при якому числі людина скаже «так», при якому — «ні», і що робитиме в сірій зоні між ними.
        - >-
          Якщо людина не хоче називати «ні» — нагадати, що без цього будь-який результат легко прочитати як успіх.
        - Ця фаза не пропускається ніколи.
      exit: названо поріг «так», поріг «ні» і дію на кожен випадок.
  ending: >-
    Людина йде з гіпотезою числами, одним дешевим тестом із зобов'язанням і порогами рішення, названими до
    запуску. Зазвичай 5–8 реплік; якщо розмова тягнеться понад 10 — час підсумувати.
  traps:
    - name: Опитування замість тесту
      text: >-
        Людина пропонує спитати людей, чи купили б вони. Пояснити, що слова про майбутнє щедріші за дії, і
        спитати, що в цьому опитуванні люди могли б віддати.
    - name: Тест, що вже є продуктом
      text: >-
        «Тест» вимагає зробити майже все. Спитати, яку найменшу частину можна показати чи зробити руками, щоб
        люди вже могли заплатити.
    - name: Не той випадок
      text: >-
        Якщо продукт уже працює з метрикою і треба обрати рішення серед кількох, якщо попит уже видно і питання в
        каналах, якщо людина спершу хоче поговорити з клієнтами про їхні клопоти, або це особисте рішення —
        ця картка не підходить.
  pairs_well: >-
    Перед: Розпитати клієнтів про їхнє минуле, а не про свою ідею; Офер: що людина отримує і чому повірить. Після:
    Де взяти наступних клієнтів: канали і дешеві тести; Pre-mortem — «розтин» плану, який ще не почався.
