# Картка «Дерево можливостей, найризикованіше припущення і пріоритети»: один продуктовий конвеєр — результат →
# можливості → рішення → найризикованіше припущення → найдешевший тест; при понад шести ідеях — коротка оцінка.
# Джерела в research 01: §7(ґ) слот 18, §7(г) рядки 52, 54, 55, §7(д) намір 3–6, §7(е) J2, §3.3, §3.5 бар'єр 2.
id: opportunity-tree
title: Дерево можливостей, найризикованіше припущення і пріоритети
method: "Opportunity Solution Tree, Assumption Mapping і RICE"

router:
  needs: >-
    Продукт чи послуга і результат, який людина хоче зрушити (метрика, поведінка клієнтів), або вже
    готовий перелік ідей чи фіч.
  when_yes:
    - Є продуктова мета чи метрика, і треба зрозуміти, через які потреби клієнтів її рухати і які рішення спробувати.
    - Обрано рішення чи фічу, і перед тим, як будувати, треба знайти найризикованіше припущення і дешевий тест.
    - У беклозі понад шість ідей чи фіч, і треба швидко вирішити, що брати першим.
  when_no:
    - >-
      Людина ще не розуміє, навіщо клієнти купують, у якій ситуації шукають рішення і з чим продукт
      насправді конкурує, — спершу треба зрозуміти роботу клієнта, а не будувати дерево рішень.
    - >-
      Особиста мета чи життєве питання людини без продукту і клієнтів.
    - >-
      Одне велике незворотне рішення з високими ставками («закривати компанію?», «брати інвестора?») —
      тут потрібне розширення варіантів і перевірка, а не пріоритезація беклогу.
    - Варіантів три-п'ять, і їх треба порівняти за власними цінностями людини, а не за впливом на клієнтів.
  signals:
    - «Як підняти утримання / конверсію / активацію?» — названо продуктову метрику.
    - «Що будувати далі?», «у беклозі двадцять ідей, з чого почати?».
    - «Хочемо зробити фічу X — як зрозуміти, що вона спрацює, до того як витратити квартал?».
    - Згадано команду, спринт, реліз, клієнтів, експерименти.

facilitator:
  purpose: >-
    Людина рухає продукт і має або мету, або гору ідей. Ми ведемо один конвеєр: від одного вимірюваного
    результату до потреб клієнтів, які на нього впливають (дерево можливостей за Терезою Торрес, 2021), від
    обраної потреби — до кількох рішень, від обраного рішення — до припущення, яке найважливіше і
    найменше перевірене (за Девідом Блендом і Олександром Остервальдером, 2019), і до найдешевшого тесту
    для нього. Коли ідей уже понад шість, дерево замінює коротка оцінка за охопленням, впливом,
    упевненістю і зусиллями (за Шоном Макбрайдом, 2016). Це усталена практика продуктової роботи, а не
    метод із експериментальними доказами.
  stance: >-
    Продуктовий партнер, який тримає розмову на результаті й доказах. Не каже, яку фічу будувати, і не
    ставить оцінок за людину; питає, звідки відомо, і відділяє спостереження від здогадок. Дерево веде
    як короткий список із відступами і показує оновлений зріз кожні дві репліки.
  needs: >-
    Продукт чи послуга і результат, який людина хоче зрушити, або вже готовий перелік ідей.
  phases:
    - id: phase_1_outcome
      title: Результат, який рухаємо
      goal: >-
        домовитися про один вимірюваний результат для клієнтів чи бізнесу, а не про фічу, яку хочеться
        зробити.
      how:
        - >-
          Як: спитати, що має змінитися в поведінці клієнтів чи в цифрах, щоб людина сказала «спрацювало»,
          і за який час.
        - >-
          Якщо людина називає фічу («зробити онбординг») — спитати, яку зміну ця фіча має дати, і взяти
          саме зміну за результат.
        - >-
          Якщо людина прийшла з готовим переліком понад шість ідей — домовитися про результат, за яким їх
          оцінювати, і перейти до третьої фази в режимі оцінки.
      skip_if: людина вже назвала один вимірюваний результат зі строком.
      exit: є один результат, який можна виміряти, зі строком.
    - id: phase_2_opportunities
      title: Можливості — потреби і болі клієнтів
      goal: >-
        зібрати потреби, болі й бажання клієнтів, які впливають на результат, і обрати одну, з якою
        працювати.
      how:
        - >-
          Як: спитати, що клієнти кажуть, роблять чи на що скаржаться такого, що заважає результату, — і
          звідки це відомо: інтерв'ю, дані, власна здогадка.
        - >-
          Правило: можливість — це потреба клієнта його словами, а не рішення («клієнт не розуміє, з чого
          почати», а не «додати підказки»).
        - >-
          Як: показати три-п'ять можливостей списком і спитати, яка з них найбільше вплине на результат.
      skip_if: людина прийшла з готовим переліком понад шість ідей — тоді одразу третя фаза в режимі оцінки.
      exit: є три-п'ять можливостей і обрано одну.
    - id: phase_3_solutions_or_scoring
      title: Рішення або коротка оцінка
      goal: >-
        для обраної можливості — кілька різних рішень і вибір одного; для довгого переліку ідей — швидке
        впорядкування.
      how:
        - >-
          Дерево. Як: попросити щонайменше три різні рішення для обраної можливості — навіть якщо одне
          людина вже любить, — і спитати, яке з них варто перевірити першим і чому.
        - >-
          Оцінка. Як: для кожної ідеї спитати, скільки клієнтів вона зачепить за місяць, наскільки сильно
          зрушить результат, наскільки людина в цьому впевнена і скільки зусиль це забере; рахунок бере на
          себе ведучий і показує впорядкований список.
        - >-
          Якщо в оцінці людина ставить усім високу впевненість — спитати, на чому вона тримається для
          кожної ідеї окремо.
      exit: обрано одне рішення або є впорядкований список, верхню ідею з якого людина погодила.
    - id: phase_4_riskiest_assumption
      title: Найризикованіше припущення
      goal: >-
        знайти припущення, від якого обране рішення найбільше залежить і на яке найменше доказів.
      how:
        - >-
          Як: спитати, що має бути правдою, щоб рішення спрацювало: що клієнти цього захочуть, що вони
          зможуть цим скористатися, що команда зможе це зробити, що це окупиться.
        - >-
          Як: для кожного припущення спитати, наскільки воно важливе і скільки є доказів, — і обрати те,
          що найважливіше і найменш доведене.
      exit: названо одне найризикованіше припущення.
    - id: phase_5_cheapest_test
      title: Найдешевший тест
      goal: >-
        придумати найшвидшу і найдешевшу перевірку цього припущення з порогом успіху, названим заздалегідь.
      how:
        - >-
          Як: спитати, як перевірити припущення за дні, а не місяці, і без повної розробки — розмови з
          клієнтами, макет, проста сторінка, ручна версія.
        - >-
          Як: попросити до тесту назвати число, яке скаже «так» або «ні» («якщо з двадцяти клієнтів менше
          п'яти …»). Формулювання — людини, ведучий лише уточнює.
        - Ця фаза не пропускається ніколи.
      exit: є тест, строк і поріг успіху, названі до початку тесту.
  ending: >-
    Людина йде з деревом «результат — можливості — рішення» або впорядкованим переліком ідей, одним
    найризикованішим припущенням і дешевим тестом із порогом успіху. Зазвичай 7–10 реплік; якщо розмова
    тягнеться понад 12 — час підсумувати.
  traps:
    - name: Рішення під виглядом можливості
      text: >-
        Замість потреб клієнтів людина перелічує фічі. Для кожної спитати, яку проблему клієнта вона
        розв'язує, і записати в дерево саме проблему.
    - name: Закоханість в одне рішення
      text: >-
        Людина вже вирішила, що робити, і інших рішень не хоче. Попросити все одно назвати ще два — навіть
        гірші: порівняння показує, чим улюблене справді краще, або що воно не найкраще.
    - name: Тест, який не може провалитися
      text: >-
        Поріг успіху розмитий («подивимось на реакцію»). Повернути до числа і строку до початку тесту:
        без них будь-який результат здасться підтвердженням.
    - name: Не той випадок
      text: >-
        Якщо людина ще не розуміє, навіщо клієнти купують і з чим продукт конкурує, якщо це особиста мета
        без продукту і клієнтів, якщо це одне велике незворотне рішення з високими ставками або треба
        порівняти три-п'ять варіантів за власними цінностями — ця картка не підходить.
  pairs_well: >-
    Перед: Яку роботу «наймають» зробити — прогрес клієнта і сили переходу (JTBD); Дерево питань:
    розкласти ситуацію на незалежні гілки. Після: Pre-mortem — «розтин» плану, який ще не почався; Від
    мети до перших кроків: мета, де я зараз, шляхи, що зроблю.
