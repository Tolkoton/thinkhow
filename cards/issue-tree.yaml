# Картка «Дерево питань»: розкласти широку ситуацію на гілки, що не перетинаються і разом охоплюють усе.
# Джерела в дослідженні 01: §7(г) рядок 8, §7(ґ) слот 2, §7(д) стовпець MECE / Issue Trees і правило 4, §7(е) J5, §3.5 бар'єр 2, §3.3 Tier C.
id: issue-tree
title: "Дерево питань: розкласти ситуацію на незалежні гілки"
method: "Issue Trees (MECE)"

router:
  needs: >-
    Широке питання або проблема, яку людина хоче зрозуміти, і готовність кілька реплік спокійно
    розбирати її по частинах.
  when_yes:
    - >-
      Питання широке і однієї природи («чому падають продажі», «як підняти дохід»), і людина не знає, з
      якого боку до нього підійти.
    - >-
      Людина хоче знайти причину, але проблема надто широка для одного ланцюжка «чому».
    - >-
      Треба впорядкувати багато розрізнених думок у структуру і вибрати, куди копати першим.
    - >-
      Людина просить план чи рішення, але не знає, чому взагалі виникла проблема, а можливих пояснень
      кілька різної природи, — спершу розкласти, де шукати, а вже потім планувати.
  when_no:
    - >-
      У ситуації змішано речі різної природи або десь просто зараз «горить», і спершу треба зрозуміти,
      що з цього аналізувати, а що стабілізувати чи пробувати, — це «Що це за ситуація».
    - >-
      Сталася одна конкретна подія чи збій, і людина знає процес зсередини — це «П'ять "чому" з
      розгалуженням».
    - >-
      Людина перевантажена, тривожна або виснажена («стільки всього, не маю сил думати») — велике дерево
      лише додасть ваги.
    - >-
      Людина вже має варіанти і хоче вибрати між ними — розкладати ситуацію вже пізно.
  signals:
    - «З чого почати?», «не можу розібратися, як тут усе пов'язано».
    - Широке питання про метрику чи результат («чому впав дохід», «як вирости вдвічі»).
    - Людина перелічує багато можливих причин чи чинників упереміш.
    - Прохання «розкласти по поличках», «побачити картину цілком».

facilitator:
  purpose: >-
    Людина розкладає велике питання на 2–4 гілки, які не перетинаються між собою і разом охоплюють усе
    питання, а тоді так само розкладає найважливішу гілку. Широка проблема перестає лякати, видно, що
    пропущено, і з'являється місце, з якого почати. Це усталена практика консалтингу, описана Барбарою
    Мінто («Принцип піраміди», 1987); строгих досліджень дієвості немає, метод спирається на логічну
    повноту розкладу.
  stance: >-
    Спокійний упорядник: тримає дерево в пам'яті й час від часу показує його, але гілки називає людина.
    Ведучий перевіряє лише дві речі — чи не перетинаються гілки і чи нічого не випало, — і не вирішує, яка
    гілка головна.
  needs: >-
    Широке питання або проблема, яку людина хоче зрозуміти, і готовність кілька реплік спокійно
    розбирати її по частинах.
  phases:
    - id: phase_1_root_question
      title: Головне питання
      goal: >-
        сформулювати одне конкретне питання в корені дерева.
      how:
        - >-
          Як: попросити сформулювати, що саме людина хоче з'ясувати або досягти, так, щоб було зрозуміло,
          коли питання розв'язано (з числом чи строком, якщо можна).
        - >-
          Якщо питання вже чітке в першому повідомленні — віддзеркалити його одним реченням і йти далі.
      exit: є одне питання в корені, з яким людина погодилася.
    - id: phase_2_first_split
      title: Перший поділ
      goal: >-
        розкласти корінь на 2–4 гілки, що не перетинаються і разом дають усе питання.
      how:
        - >-
          Як: спитати, на які великі частини розпадається питання (наприклад, дохід — це кількість
          клієнтів і сума з кожного), і показати гілки списком.
        - >-
          Правило: перевірити дві речі питаннями — «чи може щось потрапити в дві гілки одразу?» і «чи є
          щось, що не потрапило в жодну?».
        - >-
          Якщо людина буксує — ведучий може запропонувати один спосіб поділу як питання, а людина
          вирішує, чи він підходить.
      exit: є 2–4 гілки, які людина визнала повними і такими, що не перетинаються.
    - id: phase_3_pick_branch
      title: Яка гілка важить найбільше
      goal: >-
        вибрати гілку, з якою працювати далі, за тим, що людина вже знає.
      how:
        - >-
          Як: для кожної гілки спитати, що людина про неї знає напевно і де, на її думку, найбільший
          вплив; вибір — за людиною.
        - >-
          Якщо дані є лише по одній гілці — спитати, чи це не та гілка, яку зручно дивитися, а не та, що
          важить.
      exit: людина назвала одну гілку і пояснила, чому саме її.
    - id: phase_4_deepen_and_next
      title: Глибше і що перевірити
      goal: >-
        розкласти обрану гілку ще на рівень і перетворити її листки на питання, які можна перевірити.
      how:
        - >-
          Як: тим самим способом розкласти обрану гілку на 2–3 підгілки і показати оновлене дерево
          цілком.
        - >-
          Для кожного листка спитати, яким фактом чи дією його можна підтвердити або відкинути.
        - Ця фаза не пропускається ніколи.
      exit: є дерево на два рівні і 1–3 конкретні перевірки для обраної гілки.
  ending: >-
    Дерево питання на два рівні, обрана головна гілка і перелік перевірок, з яких почати. Зазвичай 6–9
    реплік; якщо розмова тягнеться понад 11 — час підсумувати.
  traps:
    - name: Гілки, що перетинаються
      text: >-
        Людина називає частини, які накладаються («маркетинг» і «реклама»). Спитати, куди б потрапив
        конкретний приклад, і разом перебудувати поділ.
    - name: Дерево заради дерева
      text: >-
        Людина розгалужує все на п'ять рівнів і не обирає. Нагадати корінне питання і обмежитися двома
        рівнями та однією гілкою.
    - name: Зручна гілка замість важливої
      text: >-
        Людина обирає гілку, про яку має дані або яка не зачіпає її саму. Спитати, що станеться з
        корінним питанням, якщо ця гілка виявиться ні до чого.
    - name: Не той випадок
      text: >-
        Якщо змішано проблеми різної природи чи щось горить просто зараз, сталася одна конкретна подія з
        відомим процесом, людина перевантажена або тривожна, або варіанти вже є і треба вибрати — ця
        картка не підходить.
  pairs_well: >-
    Перед: Що це за ситуація: зрозуміла, складна, заплутана чи пожежа. Після: П'ять «чому» з
    розгалуженням, Є / не є, Перші принципи, Від мети до перших кроків.
