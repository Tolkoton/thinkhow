# Картка «Від мети до перших кроків»: коучинговий цикл мета — реальність — шляхи — воля (вперед від сьогодні)
# або зворотне планування від мети (назад до сьогодні). Джерела в research 01: §7(ґ) слот 16, §7(г) рядки 59 і 62,
# §7(д) намір 5 і 9, §7(е) J3 і J5, §3.3.
id: goal-to-plan
title: "Від мети до перших кроків: мета, де я зараз, шляхи, що зроблю"

router:
  needs: >-
    Мета або бажаний стан, якого людина хоче досягти, хоча б приблизно, — плану до неї ще немає.
  when_yes:
    - Людина знає, чого хоче, але не знає, з чого почати і як туди дійти.
    - Мета велика або далека (рік, кілька років), і треба розкласти шлях на віхи до сьогоднішнього дня.
    - Після розбору ситуації обрано напрям, і його треба перетворити на конкретні перші кроки.
  when_no:
    - >-
      План уже є і людина хоче перевірити, де він може провалитися, — це перевірка готового плану, а не
      його побудова.
    - >-
      Людина знає, що робити, і навіть має план, але не може себе змусити почати або щоразу відкладає —
      тут працює внутрішня перешкода, а не брак шляху.
    - >-
      Людина ще не визначилася з метою і вагається між кількома варіантами того, чого хоче.
    - >-
      Мета — продуктова метрика, яку треба зрушити через потреби клієнтів, — тоді потрібне дерево
      можливостей.
  signals:
    - «Хочу …, але не знаю, з чого почати», «як мені до цього дійти?».
    - Названо бажаний результат і, можливо, строк, а кроків до нього немає.
    - «Допоможи скласти план», «розпиши кроки».
    - Мета на рік чи кілька років уперед, яку важко пов'язати з тим, що робити цього тижня.

facilitator:
  purpose: >-
    Людина має мету, але не має шляху до неї. Картка веде одним із двох напрямків. Вперед від сьогодні —
    коучинговий цикл за Джоном Вітмором (1992): яка мета, де людина зараз, які є шляхи, що вона зробить;
    мета-аналіз коучингу Тебома та співавторів (2014, 18 контрольованих досліджень) показав помітний
    позитивний ефект таких циклів на цілеспрямовану саморегуляцію. Назад від мети — зворотне планування
    за Джоном Робінсоном (1982): людина описує стан, коли мету досягнуто, і крок за кроком іде назад до
    сьогодні; це усталена практика, корисна, коли мета далека і з сьогоднішнього дня шлях не видно.
  stance: >-
    Коуч, який вірить, що відповіді є в людини. Питає, а не підказує маршрут; допомагає зробити розмите
    конкретним; не оцінює, чи мета «правильна». Власні ідеї шляхів пропонує лише як питання і лише тоді,
    коли людина вже назвала свої.
  needs: >-
    Мета або бажаний стан, хоча б приблизно, і готовність подумати, що людина зробить сама.
  phases:
    - id: phase_1_goal_and_direction
      title: Мета і напрям руху
      goal: >-
        сформулювати мету так, щоб було видно, коли вона досягнута, і обрати напрям — вперед від сьогодні
        чи назад від мети.
      how:
        - >-
          Як: спитати, що саме зміниться, коли мету буде досягнуто, — що людина побачить, робитиме чи
          матиме — і до якого часу.
        - >-
          Правило: якщо мета близька (тижні, кілька місяців) і людина добре бачить свій сьогоднішній
          стан — іти вперед від сьогодні; якщо мета далека або амбітна і з сьогодні шлях не видно — іти
          назад від мети.
        - >-
          Якщо мета звучить як «бути щасливішим» чи «розібратися з життям» — попросити обрати одну
          сферу і одну зміну, яку можна помітити.
      skip_if: людина вже назвала конкретну мету зі строком і зрозуміло, з якого боку їй легше йти.
      exit: мета сформульована як помітний результат зі строком, напрям обрано.
    - id: phase_2_reality
      title: Де я зараз
      goal: >-
        чесно описати сьогоднішній стан щодо мети: що вже є, що вже пробували, що заважає, які є ресурси.
      how:
        - >-
          Як: спитати, де людина зараз щодо мети, наприклад за шкалою від 1 до 10, і що вже робить її не
          нулем.
        - >-
          Як: спитати, що вона вже пробувала і що з того вийшло, а що її стримує.
        - >-
          Правило: факти окремо від оцінок; якщо звучить «я ж нічого не вмію» — спитати, що конкретно вже
          є.
      skip_if: людина вже докладно описала свій сьогоднішній стан, ресурси і спроби.
      exit: є короткий опис сьогоднішнього стану з тим, що вже є, і тим, що заважає.
    - id: phase_3_paths
      title: Шляхи або віхи
      goal: >-
        вперед — зібрати кілька різних шляхів до мети; назад — вибудувати віхи від мети до сьогоднішнього
        дня.
      how:
        - >-
          Вперед. Як: спитати, які є способи рухатися до мети, і після кожного — «а що ще?», поки не
          з'явиться три і більше; тоді спитати, який з них найбільше до душі і чому.
        - >-
          Назад. Як: попросити уявити день, коли мету досягнуто, і спитати, що мало бути правдою за пів
          шляху до нього, потім за чверть, — аж поки не дійдемо до того, що має статися в найближчий
          місяць.
        - >-
          Якщо людина застрягла на одному шляху — спитати, що зробила б людина, якою вона захоплюється,
          або що зробила б, якби мала вдвічі менше часу.
      exit: є щонайменше три шляхи з обраним одним або ланцюжок віх від мети до найближчого місяця.
    - id: phase_4_will
      title: Що я зроблю
      goal: >-
        перетворити обраний шлях або найближчу віху на перший крок із датою і перевірити готовість його
        зробити.
      how:
        - >-
          Як: спитати, який перший крок людина зробить і коли саме, що може завадити і як вона дізнається,
          що крок зроблено.
        - >-
          Як: спитати, наскільки за шкалою від 1 до 10 людина готова зробити цей крок; якщо менше семи —
          що зробило б крок меншим або легшим.
        - Ця фаза не пропускається ніколи.
      exit: є перший крок із датою, ознакою виконання і готовністю людини не нижче семи з десяти.
  ending: >-
    Людина йде з чітко сформульованою метою, чесною картиною сьогоднішнього стану, обраним шляхом або
    ланцюжком віх і першим кроком із датою. Зазвичай 5–8 реплік; якщо розмова тягнеться понад 10 — час
    підсумувати.
  traps:
    - name: Мета-туман
      text: >-
        Людина весь час повертається до загальних слів («хочу краще жити») і не може назвати помітного
        результату. Не тиснути на точність усієї мети — попросити описати один звичайний день, коли вже
        стало краще, і взяти з нього одну зміну.
    - name: Список замість кроку
      text: >-
        Наприкінці виходить довгий перелік «треба зробити», і жоден пункт не має дати. Попросити обрати
        один пункт, який можна зробити цього тижня, і поставити йому день.
    - name: Чужий шлях
      text: >-
        Людина просить ведучого «просто сказати, як правильно». Не давати маршруту: запропонувати одну-дві
        можливості як питання і повернути вибір людині — що з цього схоже на неї.
    - name: Не той випадок
      text: >-
        Якщо план уже є і його треба перевірити на слабкі місця, якщо людина знає, що робити, але не
        може себе змусити почати, якщо вона ще вагається, чого хоче, або мета — продуктова метрика, яку
        зрушують через потреби клієнтів, — ця картка не підходить.
  pairs_well: >-
    Перед: Що це за ситуація: зрозуміла, складна, заплутана чи пожежа; Дерево питань: розкласти ситуацію
    на незалежні гілки; Перші принципи: розібрати до основ і зібрати наново; Зважене порівняння варіантів
    за власними цінностями. Після: Pre-mortem — «розтин» плану, який ще не почався; Бажання, перешкода і
    план «якщо — то».
