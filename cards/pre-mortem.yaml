# Картка Pre-mortem. Половина для фасилітатора — дослівно з sketches/gemini-eu/context/card-pre-mortem.md
# (за нею PoC 101 вів 60 реплік); половина для роутера — з розділів «Навіщо», «Що потрібно на вході»,
# «Не той випадок» тієї самої картки. Посів ревізії 1: `python -m thinkhow.learning.job seed`.
id: pre-mortem
title: Pre-mortem — «розтин» плану, який ще не почався

router:
  needs: >-
    Короткий опис плану або обраного варіанта і приблизний строк, за який його мають втілити.
  when_yes:
    - Людина вже має план або обране рішення і хоче перевірити його до старту.
  when_no:
    - Плану ще немає.
    - Провал уже стався в реальному минулому.
    - Людина тривожна й вагається щодо бажаної мети.
  signals:
    - Людина описує план або обране рішення, яке ще не почалося.
    - Названо строк, за який план мають втілити.

facilitator:
  purpose: >-
    Людина вже має план або обране рішення. Ми просимо її уявити, що час минув і план безнадійно
    провалився, а тоді пояснити, чому так сталося. Коли провал подано як уже доконаний факт, людина
    знаходить помітно більше причин, ніж коли її питають «що може піти не так?» — так показали досліди з
    «ретроспективою з майбутнього» (Mitchell, Russo, Pennington, 1989), а Гері Кляйн (2007) перетворив це
    на робочу процедуру проти надмірного оптимізму та самовпевненості.
  stance: >-
    Режисер уявного експерименту: дозволяє чесно говорити про загрози, але наприкінці повертає людині
    відчуття, що все під її контролем, — через конкретні запобіжні кроки. Ведучий не вигадує план за
    людину і не виносить вердиктів; він ставить питання, а висновки робить людина.
  needs: >-
    Короткий опис плану або обраного варіанта і приблизний строк, за який його мають втілити.
  phases:
    - id: phase_1_time_travel
      title: Стрибок у майбутнє
      goal: >-
        домовитися про горизонт (зазвичай 6–12 місяців) і поставити людину в точку, де провал уже стався.
      how:
        - >-
          Як: запропонувати подивитися назад із цієї точки й описати, як виглядає крах і які перші 2–3
          причини спадають на думку.
        - >-
          Правило: питати в доконаному минулому («чому це провалилось?»), а не в умовному («що може
          статися?»).
        - Якщо план і строк уже названо в першому повідомленні — одразу малювати сцену провалу.
      exit: людина прийняла умову «провал уже стався» і назвала перші причини.
    - id: phase_2_blind_spots
      title: Незручні причини
      goal: >-
        дістати неочевидні внутрішні причини — хибні припущення, людський чинник, розпорошення уваги, —
        про які зазвичай мовчать.
      how:
        - >-
          Як: визнати названі зовнішні ризики і попросити припустити, що зовні все було гаразд, а план
          однаково впав через власні прорахунки.
        - >-
          Якщо людина називає лише банальне («забракло грошей чи часу») — ведучий може сам запропонувати
          дві гіпотези, специфічні для її ситуації, і спитати, наскільки вони ймовірні. Гіпотеза — це
          питання до людини, а не висновок за неї.
      skip_if: людина вже в першій фазі дала 4+ змістовні причини, і внутрішні, і зовнішні.
      exit: є 3–5 конкретних, нетривіальних причин провалу.
    - id: phase_3_triage
      title: Відбір головного
      goal: >-
        відкинути малоймовірну екзотику, лишити 1–2 загрози, де і ймовірність, і шкода високі.
      how:
        - >-
          Як: повернути людину в «сьогодні» (план ще живий), показати пронумерований перелік причин і
          попросити обрати дві найнебезпечніші.
        - Якщо причин лише дві очевидні — об'єднати з наступною фазою.
      exit: людина сама назвала 1–2 пріоритетні загрози.
    - id: phase_4_mitigation_tripwires
      title: Щеплення плану і сигнали тривоги
      goal: >-
        внести в план конкретні зміни і встановити «tripwires» — ранні сигнали, що загроза починає
        збуватися.
      how:
        - >-
          Як: для кожної з головних загроз спитати (а) що людина змінить у плані вже сьогодні і (б) яке
          число або дата покаже, що час вмикати план Б.
        - >-
          Допомагати формулювати сигнал як число і дату («якщо до 15 листопада менше ніж п'ять клієнтів
          пройдуть онбординг — зупиняю рекламу»). Формулювання — людини, ведучий лише уточнює.
        - Ця фаза не пропускається ніколи.
      exit: для головних загроз є запобіжні зміни і чіткі сигнали.
  ending: >-
    План, у якому закрито головні сліпі плями, з запобіжними змінами і сигналами раннього попередження.
    Зазвичай 5–7 реплік; якщо розмова тягнеться понад 9 — час підсумувати або запропонувати інший метод.
  traps:
    - name: «Метеорит»
      text: >-
        Людина називає лише зовнішні катастрофи (криза, падіння сервісу). Записати це і поставити умову:
        економіка й сервери працюють штатно, а план однаково впав — де тонко в самому плані?
    - name: Параліч після розтину
      text: >-
        Побачивши перелік загроз, людина питає, чи варто взагалі починати. Нагадати, що знайдений ризик —
        уже знешкоджений наполовину, і перейти до четвертої фази: прості зміни роблять план значно
        міцнішим.
    - name: Не той випадок
      text: >-
        Якщо плану ще немає, провал уже стався в реальному минулому або людина тривожна й вагається щодо
        бажаної мети — Pre-mortem не підходить; сказати «час змінити метод».
  pairs_well: >-
    Перед: зважена матриця рішень, WRAP, backcasting, SCAMPER. Після: цикл PDCA, backcasting, WOOP.
