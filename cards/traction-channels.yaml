# Картка «Де взяти наступних клієнтів»: перебрати канали, ранжувати, дешево перевірити кілька, зосередитися на тому, що працює.
# Джерела в research 04: §3.6 (Weinberg і Mares 2014), §4, §6.
id: traction-channels
title: "Де взяти наступних клієнтів: канали і дешеві тести (Bullseye)"
method: "Bullseye (Traction)"

router:
  needs: >-
    Продукт чи послуга, яку вже хтось купує або чий попит уже перевірено, і питання, звідки брати більше
    таких клієнтів.
  when_yes:
    - Перші клієнти прийшли з одного джерела (знайомі, один форум, ярмарок), і воно вичерпується.
    - Людина розривається між кількома способами залучення і не може потягнути всі одразу.
    - Хочеться вкласти гроші в рекламу чи партнерство, але спершу зрозуміти, який шлях узагалі працює.
  when_no:
    - >-
      Ще ніхто нічого не купив і невідомо, чи за це платитимуть, — спершу перевірка попиту до того, як
      будувати, а не канали.
    - >-
      Клієнти приходять, але не купують, бо незрозуміло, що вони отримають, — спершу офер.
    - >-
      Людина не знає, хто її найкращий клієнт, — каналу нема для кого обирати: спершу позиціонування.
    - Особисте питання, не пов'язане з продажем.
  signals:
    - «Знайомі скінчилися», «форум вичерпався», «де шукати наступних?».
    - "Перелік: Instagram, реклама, партнери, блогери, холодні дзвінки — «що з цього?»."
    - «Не хочу витратити гроші навмання».

facilitator:
  purpose: >-
    Людина вже має перших клієнтів і шукає, звідки брати наступних. Ми йдемо за підходом Bullseye (Габріель
    Вайнберг і Джастін Марес, Traction, 2014): спершу перебрати всі канали, які можуть спрацювати, а не лише
    звичні; ранжувати їх; на двох-трьох найперспективніших провести дешеві тести; далі зосередитися на тому, що
    дає клієнтів. Канал, що дав перших клієнтів, рідко дає наступних, тож це повторюють. Це практика стартапів,
    без досліджень.
  stance: >-
    Практичний співрозмовник: не радить «правильний» канал, а допомагає людині чесно перебрати варіанти,
    назвати, що кожен коштує, і поставити дешевий тест із числом, яке скаже «так» чи «ні».
  needs: >-
    Хто вже купував і звідки прийшов; скільки часу й грошей людина може дати на тести.
  phases:
    - id: phase_1_where_from_now
      title: Звідки клієнти зараз
      goal: >-
        з'ясувати, звідки прийшли нинішні клієнти і чому це спрацювало.
      how:
        - >-
          Як: спитати про кількох останніх клієнтів — як вони дізналися і що їх переконало.
      skip_if: людина вже назвала, звідки прийшли перші клієнти.
      exit: названо нинішнє джерело клієнтів і чому воно працювало.
    - id: phase_2_all_channels
      title: Усі канали, а не лише звичні
      goal: >-
        перебрати ширше коло каналів і відсіяти ті, що явно не підходять.
      how:
        - >-
          Як: попросити людину пройтися групами — пошук і контент, реклама, прямі продажі й листи, партнерства і
          рекомендації, спільноти й події, маркетплейси, медіа і блогери — і для кожної сказати, чи там бувають її
          клієнти.
        - >-
          Якщо людина відкидає канал, «бо це не моє», — спитати, чи там є її клієнти, а вже потім — чи їй зручно.
      exit: є перелік п'яти-восьми каналів, де можуть бути клієнти.
    - id: phase_3_rank_and_test
      title: Три найкращі і дешевий тест кожного
      goal: >-
        обрати два-три канали і для кожного — тест на тиждень-два з числом успіху.
      how:
        - >-
          Як: спитати, які три канали найімовірніше дадуть клієнтів за розумні гроші й час, і чому.
        - >-
          Як: для кожного — найменший тест (кілька постів, один лист двадцятьом, одна домовленість із партнером,
          маленький бюджет) і число, яке людина вважатиме успіхом, назване до тесту.
        - Ця фаза не пропускається ніколи.
      exit: для двох-трьох каналів є тест і число успіху.
  ending: >-
    Людина йде з картиною того, звідки клієнти приходили, ширшим переліком каналів і двома-трьома дешевими
    тестами з числом успіху. Зазвичай 5–7 реплік; якщо розмова тягнеться понад 9 — час підсумувати.
  traps:
    - name: Усе одночасно
      text: >-
        Людина хоче запустити всі канали відразу. Спитати, на що вистачить часу й грошей, і залишити два-три.
    - name: Тест без числа
      text: >-
        «Спробую і подивлюся». Попросити назвати, скільки заявок чи покупок означатиме, що канал працює.
    - name: Не той випадок
      text: >-
        Якщо ще ніхто не купував і попит не перевірено, якщо клієнти не купують через незрозумілий офер, якщо
        невідомо, хто найкращий клієнт, або питання не про продаж — ця картка не підходить.
  pairs_well: >-
    Перед: Перевірити попит до того, як будувати; Позиціонування: з чим вас порівнюють і для кого ви найкращі.
    Після: Чи сходяться гроші: що приносить і скільки коштує один клієнт.
