# Картка «Чи сходяться гроші»: скільки приносить один клієнт, скільки коштує його здобути, скільки клієнтів треба для цілі.
# Джерела в research 04: §3.7 (unit economics; Fermi Estimation — research 01 §7(г) рядок 4), §6.
id: unit-economics
title: "Чи сходяться гроші: що приносить і скільки коштує один клієнт (LTV і CAC)"
method: "Unit economics (LTV і CAC)"

router:
  needs: >-
    Бізнес, послуга чи задум, у якому людина може назвати бодай приблизно ціну, витрати і ціль у грошах.
  when_yes:
    - Людина має ціль у грошах і не розуміє, чи модель узагалі може її дати — скільки клієнтів і годин на це піде.
    - Є ціна, витрати на залучення і на виконання, і є підозра, що кожен клієнт приносить менше, ніж коштує.
    - Перед підписанням оренди, наймом чи кредитом треба зрозуміти, з якого обсягу бізнес виходить у нуль.
  when_no:
    - >-
      Людина ще не знає, скільки брати, — спершу ціна від цінності для клієнта, а вже потім арифметика бізнесу.
    - >-
      Треба порівняти кілька варіантів за власними цінностями, де гроші — лише один із критеріїв (зокрема вибір
      роботи), — це зважене порівняння варіантів.
    - >-
      Питання — чи хтось узагалі купить, а не чи сходяться числа, — це перевірка попиту.
    - Особисті фінанси без бізнесу, послуги чи продажу.
  signals:
    - «Хочу заробляти X на місяць — це реально?».
    - «Працюю в мінус?», «скільки клієнтів треба, щоб вийти в нуль?».
    - Названо ціну, оренду, рекламу, відсоток майстрам — і питання, як це скласти.

facilitator:
  purpose: >-
    Людина хоче знати, чи її модель узагалі може дати потрібні гроші. Ми рахуємо юніт-економіку: скільки
    приносить один клієнт за весь час (ціна, маржа, скільки місяців лишається — LTV), скільки коштує його
    здобути (CAC), скільки клієнтів і годин людини треба для її цілі і з якого обсягу бізнес виходить у нуль.
    Метод — арифметика: розкласти невідоме число на множники (як оцінки Фермі) і чесно позначити, які з них —
    здогадки. Рахує фасилітатор, числа — лише людини.
  stance: >-
    Уважний рахівник: не оцінює задум, а показує, від яких двох-трьох чисел він залежить найбільше; числа
    бере лише від людини, а чого вона не знає — позначає як здогадку з діапазоном.
  needs: >-
    Ціна або діапазон ціни, основні витрати, ціль у грошах (за місяць чи рік).
  phases:
    - id: phase_1_goal_and_numbers
      title: Ціль і числа, які вже є
      goal: >-
        записати ціль людини в грошах і числа, які вона знає: ціна, витрати на виконання, витрати на залучення,
        скільки клієнт лишається.
      how:
        - >-
          Як: спитати ціль (дохід за місяць чи вихід у нуль) і кожне число окремо; де людина не знає — попросити
          діапазон «від — до».
        - >-
          Якщо послуга ручна — спитати, скільки годин іде на одного клієнта, разом із пошуком і листуванням.
      skip_if: людина вже назвала ціль і основні числа.
      exit: записано ціль і числа, кожне позначене як відоме чи здогадка.
    - id: phase_2_one_client
      title: Один клієнт
      goal: >-
        порахувати, що один клієнт приносить за весь час і скільки коштує його здобути й обслужити.
      how:
        - >-
          Як: показати розрахунок однією стрічкою — ціна × місяці × маржа проти вартості залучення — і спитати,
          що в ньому здається людині неправдою.
        - >-
          Якщо клієнт коштує більше, ніж приносить, — сказати це прямо і спитати, яке з чисел людина могла б
          змінити.
      exit: людина бачить, скільки приносить і скільки коштує один клієнт.
    - id: phase_3_how_many_and_what_matters
      title: Скільки треба і що вирішує
      goal: >-
        порахувати, скільки клієнтів і годин треба для цілі, і назвати два-три числа, від яких залежить усе.
      how:
        - >-
          Як: порахувати потрібну кількість клієнтів і годин на місяць і спитати, чи це реально для людини.
        - >-
          Як: спитати, які здогадки найбільше змінюють результат, і як людина може уточнити кожну до того, як
          вкладатися (кілька продажів, розмова з тим, хто вже так працює).
        - Ця фаза не пропускається ніколи.
      exit: названо потрібний обсяг, два-три вирішальні числа і як їх уточнити.
  ending: >-
    Людина йде з розрахунком одного клієнта, потрібним обсягом для своєї цілі, точкою виходу в нуль і
    двома-трьома числами, які варто уточнити першими. Зазвичай 5–7 реплік; якщо розмова тягнеться понад 9 — час
    підсумувати.
  traps:
    - name: Оптимістичні числа
      text: >-
        Людина бере найкращі значення всюди. Попросити порахувати ще раз із середніми чи гіршими і показати
        різницю.
    - name: Забуті години
      text: >-
        Для ручної послуги людина не рахує часу на пошук і листування. Спитати, скільки годин іде на одного
        клієнта загалом.
    - name: Не той випадок
      text: >-
        Якщо людина ще не знає ціни, якщо гроші — лише один із критеріїв особистого вибору, якщо питання — чи
        хтось узагалі купить, або це особисті фінанси без бізнесу — ця картка не підходить.
  pairs_well: >-
    Перед: Ціна від цінності для клієнта; Де взяти наступних клієнтів: канали і дешеві тести. Після: Перевірити
    попит до того, як будувати; Pre-mortem — «розтин» плану, який ще не почався.
