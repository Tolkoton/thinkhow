# Картка «Двері в один чи в обидва боки і 10/10/10» — швидка перевірка оборотності рішення і погляд через час.
# Джерела в research 01: §7(ґ) слот 8, §7(г) рядки 26 і 28, §7(а) рядки 4 і 10, §7(д) правила 1–2, §7(е) J1.
id: reversible-doors
title: Двері в один чи в обидва боки і 10/10/10
method: "One-Way / Two-Way Doors і 10/10/10"

router:
  needs: >-
    Рішення, перед яким людина застрягла, — достатньо однієї фрази про те, що саме вона боїться або не
    може вирішити.
  when_yes:
    - >-
      Людина застрягла перед вибором, ставки здаються їй величезними, вона тривожиться або вже довго
      крутить це в голові.
    - Часу обмаль — рішення треба сьогодні чи завтра, і на розмову є 3–5 реплік.
    - >-
      Людина ставиться до рішення як до незворотного, хоча, можливо, його можна спробувати і скасувати.
  when_no:
    - >-
      Людина спокійна, має час, а рішення справді незворотне й важливе — тут потрібен повний процес
      важкого рішення, а не експрес-перевірка.
    - >-
      Варіанти чіткі, людина спокійна і хоче ґрунтовно зважити їх за критеріями — це зважене порівняння.
    - >-
      Людина вже знає, що правильно, і боїться лише самої дії; або це дилема двох справжніх потреб.
    - >-
      Рішення ще не постало: людина шукає причину збою, ідеї чи розуміння ситуації.
  signals:
    - «Боюся помилитися», «не можу вирішити вже тиждень», «не сплю через це».
    - «Треба вирішити до завтра», «немає часу думати».
    - Людина описує рішення як остаточне — «назавжди», «назад дороги не буде».
    - Невелике за суттю рішення подається як катастрофа.

facilitator:
  purpose: >-
    Швидка перевірка у два кроки. Перший — чи можна рішення скасувати: Джефф Безос (лист акціонерам,
    2016) розрізняв двері, через які назад не повернешся, і двері, які відчиняються в обидва боки, — другі
    варто проходити швидко й не застрягати. Другий — погляд через час за Сюзі Велч (2009): як людина
    почуватиметься щодо кожного варіанта через десять хвилин, десять місяців і десять років. Обидва
    прийоми — усталена практика без суворих досліджень; вони знімають параліч, коли страх робить кожне
    рішення остаточним.
  stance: >-
    Спокійний співрозмовник, який зменшує масштаб страху до реального. Ведучий не запевняє, що «все
    буде добре», і не вирішує, чи двері незворотні; він питає, що буде, якщо повернутися, а оцінку дає
    людина.
  needs: >-
    Одна фраза про рішення, перед яким людина застрягла, і, якщо є, строк.
  phases:
    - id: phase_1_name_decision
      title: Що саме вирішується
      goal: >-
        звести рішення до одного речення і коротко визнати напругу людини.
      how:
        - >-
          Як: одним реченням визнати, що рішення тисне, і перепитати, що саме вирішується («чи переходити
          в іншу команду в цьому кварталі — так?»).
        - >-
          Правило: не розпитувати подробиць понад потрібне; ця картка коротка.
      skip_if: рішення вже чітко сформульоване в першому повідомленні.
      exit: є одне речення рішення, з яким людина погодилася.
    - id: phase_2_door_type
      title: Чи можна повернутися
      goal: >-
        з'ясувати, які частини рішення можна скасувати, а які ні, і чого коштує повернення.
      how:
        - >-
          Як: спитати, що конкретно станеться, якщо через місяць людина пошкодує, — чи можна повернутися і
          скільки це коштуватиме часу, грошей, стосунків.
        - >-
          Як: спитати, яка частина рішення справді незворотна, а яку можна спершу спробувати на малому чи на
          певний строк.
        - >-
          Якщо людина каже «все незворотне» — попросити назвати одну річ, яку буде втрачено назавжди, і
          перевірити, чи це так.
      exit: людина сама назвала, двері в обидва боки, в один бік чи змішані, і чого коштує повернення.
    - id: phase_3_ten_ten_ten
      title: Десять хвилин, десять місяців, десять років
      goal: >-
        подивитися на кожен варіант через три відстані в часі, щоб відокремити миттєвий страх від
        тривалого наслідку.
      how:
        - >-
          Як: спитати, як людина почуватиметься щодо обраного варіанта через десять хвилин, через десять
          місяців і через десять років; потім — те саме щодо іншого.
        - >-
          Правило: одне питання за раз; десять років можна поєднати з десятьма місяцями, якщо людина
          відповідає коротко.
      skip_if: >-
        двері явно в обидва боки, повернення дешеве, і людина вже готова спробувати.
      exit: людина побачила, на якій відстані в часі тримається її страх і що важить довше.
    - id: phase_4_next_step
      title: Наступний крок
      goal: >-
        перетворити побачене на дію відповідно до типу дверей.
      how:
        - >-
          Якщо двері в обидва боки — спитати, який найменший крок людина зробить і коли подивиться,
          чи хоче повернутися.
        - >-
          Якщо двері в один бік — спитати, чи готова людина дати рішенню більше часу, і запропонувати
          розібрати його ґрунтовніше іншим методом.
        - Ця фаза не пропускається ніколи.
      exit: людина назвала свій наступний крок і дату, коли повернеться до рішення.
  ending: >-
    Ясність, наскільки рішення насправді оборотне, погляд на нього через час і один конкретний наступний
    крок. Зазвичай 3–5 реплік; якщо розмова тягнеться понад 6 — час підсумувати.
  traps:
    - name: Усе здається незворотним
      text: >-
        Тривога робить остаточним будь-яке рішення. Не сперечатися, а попросити назвати конкретну втрату,
        якої вже не повернути, і окремо — те, що повернути можна.
    - name: «Оборотне» як привід не думати
      text: >-
        Людина поспішно оголошує двері двосторонніми, хоча повернення коштуватиме довіри, репутації чи
        років. Спитати, хто ще постраждає від спроби і чи ці втрати повертаються.
    - name: Далеке майбутнє лякає
      text: >-
        На «десять років» людина починає катастрофізувати. Нагадати, що це погляд, а не прогноз, і спитати,
        що за ці роки буде в її власних руках.
    - name: Не той випадок
      text: >-
        Якщо людина спокійна, має час і рішення справді незворотне, якщо варіанти чіткі й людина хоче
        ґрунтовно їх зважити, якщо вона вже знає відповідь і боїться лише дії, або якщо рішення ще не
        постало — ця картка не підходить.
  pairs_well: >-
    Перед: Осмислити досвід і переглянути власне правило. Після: Зважене порівняння варіантів за власними
    цінностями; Важке рішення — ширше, перевірити, відступити, підготуватися (WRAP); Бажання, перешкода і
    план «якщо — то».
