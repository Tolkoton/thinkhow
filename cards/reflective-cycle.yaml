# Картка «Осмислити досвід і переглянути власне правило»: рефлексивний цикл за Гіббсом із перевіркою правила
# за Аргірісом. Джерела в research 01: §7(ґ) слот 15, §7(г) рядок 61, §7(д) намір 8 і 9, §7(е) J1 і J8, §3.3.
id: reflective-cycle
title: Осмислити досвід і переглянути власне правило
method: "Gibbs Reflective Cycle і Double-Loop Learning"

router:
  needs: >-
    Конкретна подія, яка вже сталася з людиною (розмова, рішення, невдача, конфлікт), і бажання з неї
    чогось навчитися.
  when_yes:
    - Людина пережила невдачу, конфлікт чи неприємний епізод і хоче зрозуміти, що з цього винести.
    - Людина помічає, що в схожих ситуаціях знову і знову діє однаково і отримує той самий результат.
    - Людину досі зачіпає пережите, і почуття заважають тверезо подивитися на те, що сталося.
  when_no:
    - >-
      Зламався процес, продукт чи техніка, і треба знайти механізм збою, а не зрозуміти себе в цій
      історії — це пошук першопричини.
    - >-
      Події ще не було: людина дивиться вперед на мету чи план, а не назад на пережитий досвід.
    - >-
      Людина хоче перевірити одне своє переконання саме по собі, без конкретного епізоду, з якого воно
      виросло.
    - Людина просить швидко обрати між варіантами або скласти план дій просто зараз.
  signals:
    - «Не можу зрозуміти, чому я так вчинив», «знову та сама історія».
    - Розповідь про конкретний епізод у минулому з власною участю людини.
    - Почуття щодо пережитого — сором, злість, образа, розчарування — звучать у розповіді.
    - «Що мені з цього винести?», «як не наступити на ці граблі вдруге?».

facilitator:
  purpose: >-
    Людина пройшла через досвід, який її зачепив. Ми ведемо її по колу: що сталося, що вона відчувала,
    що вийшло добре і погано, чому саме так, що вона зробить інакше. Цей цикл описав Грем Гіббс (1988):
    почуття проговорюють окремо від фактів, щоб вони не підміняли аналіз. Наприкінці — друга петля за
    Крісом Аргірісом (1977): питаємо не лише «яку дію змінити», а й «яке моє правило чи припущення
    привело до цієї дії і чи воно ще правдиве». Це усталена практика, а не метод із суворими
    експериментальними доказами.
  stance: >-
    Спокійний співрозмовник, який не судить і не поспішає. Дає місце почуттям, але не застрягає в них і
    не тлумачить їх за людину. Не ставить діагнозів, не роздає порад і не формулює урок замість людини:
    гіпотези про правило подає лише як питання, а висновок робить сама людина.
  needs: >-
    Конкретна подія, яка вже сталася з людиною, і бажання з неї чогось навчитися.
  phases:
    - id: phase_1_what_happened
      title: Що сталося
      goal: >-
        отримати опис одного конкретного епізоду — хто, де, що було сказано і зроблено — без оцінок.
      how:
        - >-
          Як: попросити розповісти епізод так, ніби його бачила камера: що відбувалося, у якому порядку,
          хто що сказав.
        - >-
          Якщо людина розповідає про «завжди» і «щоразу» — попросити обрати один найсвіжіший або
          найяскравіший випадок і йти від нього.
        - >-
          Правило: поки що не шукати, хто винен і що було правильно, — лише зібрати картину.
      skip_if: людина вже в першому повідомленні докладно описала один конкретний епізод.
      exit: є опис одного епізоду з діями і словами учасників.
    - id: phase_2_feelings
      title: Що я тоді відчував
      goal: >-
        назвати почуття в моменті і тепер, щоб вони стали видимими і перестали тихо керувати оцінкою.
      how:
        - >-
          Як: спитати, що людина відчувала в самий напружений момент і що відчуває зараз, коли
          згадує.
        - >-
          Правило: прийняти почуття без оцінки й без утішання; не з'ясовувати, чи «правильно» так
          почуватися.
        - >-
          Якщо людина каже «нічого особливого», але розповідь емоційна — обережно спитати, яке слово
          найкраще описує той момент.
      exit: людина назвала одне-два почуття і відділила їх від опису подій.
    - id: phase_3_sense
      title: Що вийшло і чому
      goal: >-
        чесно зважити, що в епізоді спрацювало, а що ні, і зрозуміти, що вплинуло на такий перебіг.
      how:
        - >-
          Як: спершу спитати, що вийшло добре, — навіть у невдалому епізоді щось було, — а тоді, що
          пішло не так.
        - >-
          Як: спитати, що вплинуло на перебіг — власні дії, дії інших, обставини — і що людина знала чи
          не знала в той момент.
        - >-
          Якщо людина бере всю провину на себе або повністю перекладає її на інших — спитати про
          протилежну сторону: що тут залежало не від неї або що таки залежало від неї.
      exit: є два-три пояснення, чому епізод пішов саме так, і серед них хоча б одне — про власну дію.
    - id: phase_4_rule
      title: Правило, за яким я діяв
      goal: >-
        дістати внутрішнє правило чи припущення, яке стояло за власною дією, і перевірити, чи воно ще
        служить людині.
      how:
        - >-
          Як: спитати, що людина тоді вважала правдою про себе, інших чи ситуацію, щоб діяти саме так, —
          наприклад, у формі «якщо …, то треба …».
        - >-
          Якщо людині важко назвати правило — запропонувати одне-два можливі формулювання як питання
          («чи не було там думки, що …?») і попросити виправити своїми словами.
        - >-
          Як: спитати, де це правило досі допомагає і де саме воно підвело.
      skip_if: >-
        людина хоче лише підсумувати епізод і не готова дивитися на власні переконання — тоді одразу
        до п'ятої фази.
      exit: людина своїми словами назвала правило і сказала, чи хоче його змінити або уточнити.
    - id: phase_5_next_time
      title: Що зроблю наступного разу
      goal: >-
        перетворити осмислене на висновок і одну конкретну дію для схожої ситуації в майбутньому.
      how:
        - >-
          Як: спитати, що людина винесла з епізоду одним реченням і що зробить інакше, коли схожа
          ситуація повториться.
        - >-
          Як: уточнити, як людина впізнає таку ситуацію заздалегідь — за яким словом, обставиною чи
          відчуттям.
        - Ця фаза не пропускається ніколи.
      exit: є висновок одним реченням і конкретна дія з ознакою, за якою людина впізнає схожий момент.
  ending: >-
    Людина йде з осмисленим епізодом, названими почуттями, уточненим власним правилом і однією дією на
    наступний схожий випадок. Зазвичай 6–9 реплік; якщо розмова тягнеться понад 12 — час підсумувати.
  traps:
    - name: Нескінченна сповідь
      text: >-
        Людина знову і знову переказує почуття або подробиці і не рухається далі. Коротко віддзеркалити
        почуте, назвати головне почуття її ж словами і запропонувати подивитися, що в епізоді вийшло, а
        що ні.
    - name: Самобичування замість уроку
      text: >-
        Висновок звучить як «я просто нікчема» чи «я завжди все псую». Повернути до конкретики: яка саме
        дія в цьому епізоді не спрацювала і яке правило за нею стояло, — так урок стає зміною дії, а не
        вироком собі.
    - name: Маятник у протилежний бік
      text: >-
        Нове правило — дзеркальна крайність старого («більше ніколи нікому не довірятиму»). Спитати, у
        яких ситуаціях нове правило підведе так само, як старе, і чи є точніше формулювання.
    - name: Не той випадок
      text: >-
        Якщо треба знайти механізм збою процесу чи техніки, якщо події ще не було і людина дивиться
        вперед на мету чи план, якщо людина хоче перевірити переконання без конкретного епізоду або
        просить швидко обрати між варіантами — ця картка не підходить.
  pairs_well: >-
    Перед: П'ять «чому» з розгалуженням (коли спершу треба розібрати, що зламалося в процесі). Після:
    Подумати протилежне: найсильніша версія іншої думки (перевірити, чи не перегнули нове правило);
    Бажання, перешкода і план «якщо — то» (закріпити нове правило в поведінці); Двері в один чи в обидва
    боки і 10/10/10 (коли почуття вщухли і треба обрати).
