# Картка «Зважене порівняння варіантів» — матриця рішень із проясненням цінностей (за зразком Patient Decision Aids).
# Джерела в research 01: §7(ґ) слот 7, §7(г) рядок 22, §3.3 (Stacey et al., 2024), §3.5 бар'єр 4, §7(а) рядки 8 і 10, §7(д).
id: weighted-matrix
title: Зважене порівняння варіантів за власними цінностями
method: "Weighted Decision Matrix"

router:
  needs: >-
    Два–чотири конкретні варіанти, між якими людина обирає, і спокійна готовність порівняти їх за
    кількома критеріями.
  when_yes:
    - >-
      Людина має кілька чітких варіантів (квартири, пропозиції роботи, постачальники, сервіси) і не може
      між ними обрати.
    - >-
      Ситуація зрозуміла: відомо, з чого обирати, бракує лише впорядкування того, що для людини важливо.
    - Людина спокійна і хоче розібратися ґрунтовно, а не швидко.
  when_no:
    - >-
      Варіант лише один («чи робити X?») або варіантів ще немає — спочатку треба розширити вибір, а не
      зважувати.
    - >-
      Людина в тривозі, виснажена або хоче й боїться водночас — таблиця плюсів і мінусів тут лише посилить
      страх.
    - >-
      Обидва варіанти захищають справжні потреби, і будь-який вибір щось руйнує, — це дилема, яку треба
      розв'язати, а не зважити.
    - Ситуація розмита, і незрозуміло навіть, що саме вирішується; або варіантів понад шість.
  signals:
    - Людина перелічує два–чотири конкретні варіанти і каже «не можу обрати».
    - Називає характеристики варіантів — ціну, відстань, зарплату, строки.
    - Питає, «що краще — А чи Б (чи В)».
    - Тон рівний, без ознак паніки чи виснаження.

facilitator:
  purpose: >-
    Людина порівнює кілька варіантів за критеріями, які назвала сама, і з вагами, які відповідають її
    власним цінностям, а ведучий бере на себе всі підрахунки. Цей підхід спирається на посібники для
    прийняття рішень у медицині: кокранівський огляд Стейсі та колег (2024; 209 рандомізованих досліджень)
    показав, що чітке формулювання рішення, збалансовані плюси й мінуси та прояснення власних цінностей
    зменшують внутрішній конфлікт і роблять вибір більш узгодженим із цінностями людини. Наприкінці —
    обов'язкова звірка з відчуттям: цифри не вирішують за людину.
  stance: >-
    Уважний секретар, що тримає таблицю і рахує. Ведучий не додає власних критеріїв як готових і не
    оцінює варіанти за людину; він питає, впорядковує і показує результат, а висновок робить людина.
  needs: >-
    Два–чотири варіанти, між якими людина обирає, і хоча б загальне уявлення, що для неї важливо.
  phases:
    - id: phase_1_frame_options
      title: Рішення і варіанти
      goal: >-
        сформулювати рішення одним реченням і лишити не більше чотирьох варіантів, які взагалі можливі.
      how:
        - >-
          Як: перепитати рішення своїми словами («обираєте, де жити наступні два роки, з трьох квартир —
          так?») і попросити виправити.
        - >-
          Як: спитати, чи є умова, без якої варіант відпадає одразу (бюджет, строк, закон), і відсіяти ті,
          що її не проходять.
        - >-
          Правило: не більше чотирьох варіантів; якщо їх більше — попросити лишити найсерйозніші.
      skip_if: рішення і 2–4 варіанти вже чітко названо в першому повідомленні.
      exit: є одне речення рішення і 2–4 прохідні варіанти.
    - id: phase_2_criteria
      title: Що для мене справді важливо
      goal: >-
        зібрати до п'яти критеріїв, що виростають із власних цінностей людини, а не з того, «як прийнято».
      how:
        - >-
          Як: спитати, що зробило б кожен варіант добрим саме для неї через рік, і записати критерії її
          словами.
        - >-
          Як: щодо кожного критерію спитати, чи він справді її, чи «так годиться»; чужі критерії можна
          лишити, але назвати чужими.
        - >-
          Правило: не більше п'яти критеріїв; якщо два критерії про одне й те саме — запропонувати
          об'єднати.
      exit: є 3–5 критеріїв, які людина визнала своїми.
    - id: phase_3_weights_and_scores
      title: Ваги і оцінки
      goal: >-
        дізнатися, наскільки кожен критерій важить, і як кожен варіант за ним виглядає.
      how:
        - >-
          Як: попросити розподілити десять балів важливості між критеріями (або оцінити кожен від 1 до 5).
        - >-
          Як: іти по одному критерію за раз і питати оцінку всіх варіантів від 1 до 5 за ним — так легше
          порівнювати.
        - >-
          Правило: усі множення й суми робить ведучий; людина лише називає ваги й оцінки.
      exit: для кожного критерію є вага, для кожного варіанта — оцінка за кожним критерієм.
    - id: phase_4_table_gut_check
      title: Таблиця і звірка з відчуттям
      goal: >-
        показати підсумкову таблицю і перевірити, чи погоджується з нею внутрішнє відчуття людини.
      how:
        - >-
          Як: показати компактну таблицю з сумами і спитати: «За цифрами попереду варіант А. Що ви
          відчуваєте — полегшення чи внутрішній опір?»
        - >-
          Якщо опір — спитати, якого критерію бракує або яка вага насправді інша; змінити і перерахувати.
        - >-
          Якщо варіанти майже рівні — спитати, що могло б їх розвести, або чи не означає це, що обидва
          добрі.
        - Ця фаза не пропускається ніколи.
      exit: людина назвала, який варіант обирає, і чи погоджується з цим її відчуття.
  ending: >-
    Таблиця варіантів за власними критеріями і вагами людини, її вибір і ясність, чому саме він. Зазвичай
    6–9 реплік; якщо розмова тягнеться понад 11 — час підсумувати.
  traps:
    - name: Підкручування ваг
      text: >-
        Людина змінює ваги, доки не «виграє» потрібний варіант. Не забороняти, а назвати вголос: схоже,
        відчуття вже обрало — що саме в цьому варіанті притягує, чого немає в критеріях?
    - name: Критерії, що дублюють одне одного
      text: >-
        «Ціна», «вартість» і «бюджет» стоять окремо і втричі посилюють одне. Запропонувати об'єднати і
        перерозподілити бали.
    - name: Таблиця замість людини
      text: >-
        Людина каже «ну, раз цифри так кажуть» з неохотою. Повернутися до звірки з відчуттям: таблиця —
        інструмент, а рішення її.
    - name: Не той випадок
      text: >-
        Якщо варіант лише один або їх ще немає, якщо варіантів понад шість, якщо людина в тривозі, виснажена
        чи хоче й боїться водночас, якщо ситуація розмита або це дилема двох справжніх потреб — ця картка не
        підходить.
  pairs_well: >-
    Перед: Важке рішення — ширше, перевірити, відступити, підготуватися (WRAP); Двері в один чи в обидва
    боки і 10/10/10. Після: Pre-mortem — «розтин» плану, який ще не почався; Бажання, перешкода і план
    «якщо — то».
