# Картка «Що це за ситуація»: зрозуміти природу кожної частини плутанини, перш ніж обирати, як діяти.
# Джерела в дослідженні 01: §7(г) рядок 18, §7(ґ) слот 3, §7(а) рядок 3, §7(д) правило 2, §7(е) J5, §3.6 (назва без торговельної марки), §3.3 Tier C.
id: complexity-sensemaking
title: "Що це за ситуація: зрозуміла, складна, заплутана чи пожежа"

router:
  needs: >-
    Опис ситуації, у якій людина не знає, за що братися, хоча б кількома реченнями про те, що
    відбувається.
  when_yes:
    - >-
      У розповіді намішано кілька різнорідних проблем, і людина не розуміє, що з них головне і як до
      кожної підходити.
    - >-
      Людина не певна, чи можна свою ситуацію просто розрахувати й розібрати, чи тут потрібні пробні
      кроки, бо реакцію людей чи ринку наперед не вгадати.
    - >-
      Треба швидко, за кілька реплік, зорієнтуватися в плутанині, а часу на велике дерево немає.
  when_no:
    - >-
      Ситуація вже однієї природи і її можна розібрати аналітично, просто вона широка — це «Дерево
      питань».
    - >-
      Сталася конкретна подія чи збій і людина шукає його причину — це «П'ять "чому" з розгалуженням»
      або «Є / не є».
    - >-
      У людини вже є план чи варіанти і вона хоче їх перевірити або вибрати.
  signals:
    - «Все змішалося», «навалилося все одразу», «не знаю, за що хапатися».
    - В одному повідомленні кілька різних проблем — люди, гроші, техніка, терміни.
    - «Не розумію, це можна просто порахувати чи треба пробувати?»
    - Згадка, що щось «горить» просто зараз, поруч із довшими проблемами.

facilitator:
  purpose: >-
    Людина розкладає свою плутанину на частини і для кожної визначає її природу: зрозуміла (є відомий
    правильний спосіб), складна (причини є, їх можна з'ясувати аналізом чи експертом), заплутана
    (наперед не вгадати, допоможуть лише малі безпечні проби) або пожежа (спершу зупинити шкоду, потім
    думати). Від природи частини залежить, як із нею діяти, і людина перестає застосовувати до всього
    один підхід. Розрізнення описали Синтія Курц і Дейв Сноуден (2003), а Сноуден і Мері Бун (2007)
    показали його керівникам; це усталена практика без строгих досліджень дієвості.
  stance: >-
    Спокійний провідник, який допомагає розсортувати, а не оцінює. Не вирішує за людину, до якого виду
    належить частина, — пояснює чотири види простими словами без термінів і питає, де на її думку місце
    кожної.
  needs: >-
    Опис ситуації, у якій людина не знає, за що братися, хоча б кількома реченнями про те, що
    відбувається.
  phases:
    - id: phase_1_separate_parts
      title: Розділити клубок
      goal: >-
        назвати 2–4 окремі частини ситуації, щоб далі говорити про кожну окремо.
      how:
        - >-
          Як: попросити перелічити, що саме зараз не так або непокоїть, і зібрати це в короткий
          пронумерований перелік.
        - >-
          Правило: не розбирати жодної частини глибоко, лише назвати.
        - Якщо частини вже чітко перелічено в першому повідомленні — показати перелік і йти далі.
      exit: є перелік із 2–4 частин, з яким людина згодна.
    - id: phase_2_fire_first
      title: Чи щось горить
      goal: >-
        з'ясувати, чи є серед частин така, де шкода триває просто зараз.
      how:
        - >-
          Як: спитати, чи є щось, що погіршується щогодини і чекати не може.
        - >-
          Якщо так — спитати, яка найменша дія зупинить шкоду сьогодні, і лише тоді повертатися до решти.
      skip_if: людина вже сказала, що нічого термінового немає.
      exit: людина або назвала дію, що зупиняє шкоду, або підтвердила, що пожежі немає.
    - id: phase_3_sort_by_nature
      title: Яка природа кожної частини
      goal: >-
        для кожної частини визначити, чи вона зрозуміла, складна чи заплутана.
      how:
        - >-
          Як: по одній частині питати, чи є хтось, хто знає правильну відповідь, чи її можна знайти
          розрахунком, чи тут наперед не вгадати і треба пробувати.
        - >-
          Правило: пояснювати види звичайними словами, без назв і схем; рішення — за людиною.
        - >-
          Якщо людина хоче розрахувати те, що залежить від реакції людей, — спитати, чи вдавалося
          колись таке передбачити точно.
      exit: кожна частина має свій вид, названий людиною.
    - id: phase_4_way_for_each
      title: Як діяти з кожною
      goal: >-
        для кожної частини обрати підхід, що пасує її природі, і перший крок.
      how:
        - >-
          Як: спитати для зрозумілої — хто чи що вже знає, як; для складної — що треба з'ясувати чи в кого
          спитати; для заплутаної — яку найменшу безпечну пробу можна зробити і що вона покаже.
        - Ця фаза не пропускається ніколи.
      exit: для кожної частини людина назвала підхід і перший крок.
  ending: >-
    Карта ситуації: частини, природа кожної і перший крок для кожної, з пожежею — якщо вона була — на
    першому місці. Зазвичай 3–6 реплік; якщо розмова тягнеться понад 8 — час підсумувати або перейти до
    розбору однієї частини іншим методом.
  traps:
    - name: Усе здається складним
      text: >-
        Людина відносить кожну частину до найважчого виду. Спитати, чи є серед них хоч одна, яку вже
        хтось колись розв'язав, — і почати з неї.
    - name: Розрахунок там, де треба пробувати
      text: >-
        Людина хоче спершу все проаналізувати, хоча частина залежить від реакції людей. Спитати, скільки
        коштує мала проба порівняно з місяцем аналізу.
    - name: Класифікація замість дії
      text: >-
        Розмова зависає на суперечці, до якого виду щось належить. Нагадати, що вид — лише підказка, і
        перейти до першого кроку.
    - name: Не той випадок
      text: >-
        Якщо ситуація вже однієї природи і просто широка, людина шукає причину конкретного збою, у неї
        вже є план чи варіанти — ця картка не підходить.
  pairs_well: >-
    Перед: нічого — це зазвичай перша картка в розмові. Після: Дерево питань, Від мети до перших кроків,
    Дерево можливостей, найризикованіше припущення і пріоритети, П'ять «чому» з розгалуженням.
