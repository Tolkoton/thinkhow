# Картка «Сім напрямків змінити те, що є» (SCAMPER з лінзою перевертання) — слот 13 бібліотеки.
# Джерела: research 01 §7(г) №38 (Осборн, 1953; Еберле, 1971), §7(ґ) п.13, §7(д), §7(е) J2.
id: scamper
title: Сім напрямків змінити те, що є (SCAMPER)
method: "SCAMPER"

router:
  needs: >-
    Щось уже наявне, що людина хоче покращити чи переосмислити, — продукт, послугу, процес, подію,
    звичку, — і що для неї означало б «краще».
  when_yes:
    - >-
      У людини є конкретна річ чи процес, які «працюють, але не так», і їй бракує ідей, що змінити.
    - Людина застрягла на одному-двох очевидних покращеннях і хоче вийти за них.
    - Треба освіжити продукт, послугу чи подію, не вигадуючи все з нуля.
  when_no:
    - >-
      Нічого ще немає, від чого відштовхнутися, або людина хоче переглянути саму задачу з нуля — тоді
      розбирати до основ, а не видозмінювати наявне.
    - >-
      Варіанти вже є і треба вибрати між ними — потрібне порівняння, а не нові ідеї.
    - >-
      Щось зламалося і людина шукає, чому, — генерація змін до того, як знайдено причину, лише
      заплутає.
    - >-
      Людина тривожна, перевантажена або не може змусити себе почати — нові ідеї додадуть тиску.
  signals:
    - Названо конкретний продукт, послугу, процес чи подію і сказано, що їх треба покращити чи оновити.
    - «Як це зробити інакше / цікавіше / дешевше?», «нема ідей», «усе вже пробували».
    - Людина описує, як річ працює зараз, і що в ній не влаштовує.

facilitator:
  purpose: >-
    Людина має щось наявне і хоче нових ідей. Замість вільного мозкового штурму ми ведемо її кількома
    чіткими напрямками змін: чим замінити, що поєднати, що запозичити з іншого місця, що збільшити чи
    зменшити, де ще це використати, що прибрати, що переставити або перевернути навпаки. Кожен
    напрямок — це конкретне питання, тож у чаті думка не розтікається, а рухається від того, що є.
    Метод описали Алекс Осборн (1953) і Боб Еберле (1971); це усталена практика, без строгих
    досліджень ефекту.
  stance: >-
    Енергійний співрозмовник, який дає дозвіл на дивні ідеї і не оцінює їх, поки вони з'являються.
    Ведучий не пропонує готових рішень замість людини; якщо підкидає приклад, то як питання, від якого
    людина відштовхується, а відбір ідей завжди за нею.
  needs: >-
    Наявна річ чи процес, що в ній не влаштовує, і що людина вважала б покращенням.
  phases:
    - id: phase_1_object_and_aim
      title: Що змінюємо і навіщо
      goal: >-
        зафіксувати одну конкретну річ, її складові і мету змін — що саме має стати кращим.
      how:
        - >-
          Як: попросити коротко описати, як річ працює зараз (хто нею користується, з яких частин вона
          складається) і що буде ознакою вдалої зміни.
        - "Правило: одна річ за раз; якщо їх кілька — спитати, з якої почати."
        - Якщо опис і мета вже є в першому повідомленні — одразу переходити до напрямків.
      exit: є одна річ, її головні складові і назване мірило «краще».
    - id: phase_2_directions
      title: Напрямки змін
      goal: >-
        пройти напрямки заміни, поєднання, запозичення, збільшення чи зменшення, іншого використання і
        вилучення — і зібрати кілька ідей.
      how:
        - >-
          Як: ставити по одному напрямку за репліку конкретним питанням про цю річ («що в ній можна
          замінити чимось зовсім іншим?», «що буде, якщо прибрати найдорожчу частину?»).
        - >-
          Правило: не тягнути всі сім напрямків механічно — вибрати 3–4, що найбільше пасують до мети, і
          йти далі, щойно напрямок виснажився.
        - >-
          Якщо людина мовчить на напрямку — підкинути один дивний приклад з іншої галузі як питання і
          спитати, що він їй підказує.
      exit: зібрано 5+ ідей із кількох різних напрямків, без оцінки.
    - id: phase_3_reverse
      title: Переставити і перевернути
      goal: >-
        розхитати звичний порядок: змінити послідовність, ролі чи напрямок і подивитися на задачу
        навиворіт.
      how:
        - >-
          Як: спитати, що буде, якщо поміняти кроки місцями чи ролі учасників, а тоді — «як зробити цю
          річ навмисно гіршою?» і що з цього, вивернутого назад, стає ідеєю.
        - "Правило: «погані» відповіді — сировина; розвертати кожну в протилежну корисну дію."
      skip_if: серед ідей уже є 2+ сміливі зміни порядку чи ролей.
      exit: є щонайменше одна ідея з перестановки або перевертання.
    - id: phase_4_select_and_shape
      title: Вибрати і втілити
      goal: >-
        повернутися до мірила «краще», вибрати 1–2 ідеї і зробити з них конкретний перший крок.
      how:
        - >-
          Як: показати пронумерований перелік ідей і попросити вибрати 1–2, що найкраще служать меті;
          потім спитати, як перевірити кожну найдешевше і найшвидше.
        - "Правило: вибір — людини; ведучий лише нагадує мірило, яке вона назвала на початку."
        - Ця фаза не пропускається ніколи.
      exit: людина вибрала 1–2 ідеї і назвала перший крок чи невелику перевірку для кожної.
  ending: >-
    Перелік ідей із різних напрямків і 1–2 вибрані з першим кроком чи дешевою перевіркою. Зазвичай 5–8
    реплік; якщо розмова тягнеться понад 10 — час підсумувати.
  traps:
    - name: Анкета з семи пунктів
      text: >-
        Ведучий проходить усі напрямки підряд, і розмова стає опитувальником. Обрати кілька
        найдоречніших напрямків і рухатися за енергією людини.
    - name: Критик на старті
      text: >-
        Людина відкидає кожну ідею одразу («це не спрацює»). Домовитися, що зараз лише збираємо, а
        оцінка буде в останній фазі, і записати ідею без коментаря.
    - name: Косметика замість змін
      text: >-
        Усі ідеї — дрібні поліпшення того самого. Перейти до перевертання: «як зробити це навмисно
        гіршим?» або «що, якби цієї частини не було взагалі?».
    - name: Не той випадок
      text: >-
        Якщо немає нічого наявного, від чого відштовхнутися, або треба переглянути саму задачу з нуля,
        якщо варіанти вже є і треба вибрати, якщо щось зламалося і причину ще не знайдено, або людина
        тривожна чи перевантажена — ця картка не підходить.
  pairs_well: >-
    Перед: Яку роботу «наймають» зробити: прогрес клієнта і сили переходу (JTBD); Перші принципи:
    розібрати до основ і зібрати наново. Після: Зважене порівняння варіантів за власними цінностями;
    Pre-mortem — «розтин» плану, який ще не почався; Дерево можливостей, найризикованіше припущення і
    пріоритети.
