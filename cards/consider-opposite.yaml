# Картка «Подумати протилежне» (Consider-the-Opposite & Steelmanning) — слот 11 бібліотеки.
# Джерела: research 01 §3.3 (Lord, Lepper, Preston, 1984; Larrick, 2004), §3.5 бар'єр 1, §7(г) №36, §7(ґ) п.11, §7(д), §7(е) J4/J8.
id: consider-opposite
title: "Подумати протилежне: найсильніша версія іншої думки"
method: "Consider-the-Opposite і Steelmanning"

router:
  needs: >-
    Конкретне судження, висновок чи позиція, у якій людина вже впевнена (про ситуацію, іншу людину,
    ринок, суперечку), — сформульоване так, що до нього можна поставити протилежне.
  when_yes:
    - >-
      Людина дійшла висновку чи гіпотези («клієнти йдуть через ціну», «він це зробив навмисне») і хоче
      перевірити, чи не підганяє під нього факти.
    - >-
      Людина в суперечці чи перед перемовинами й хоче зрозуміти найсильніші аргументи іншої сторони,
      а не їхню карикатуру.
    - >-
      Людина дуже впевнена в рішенні чи плані й просить «просто підтвердити».
    - "Після осмислення досвіду: перевірити, чи новий висновок не хитнувся надто далеко в інший бік."
  when_no:
    - >-
      Висновку ще немає — людина лише намагається зрозуміти, що відбувається, або шукає причину збою
      (тоді — розібрати ситуацію чи шукати причину, а не оскаржувати думку).
    - >-
      Сумнів стосується самої людини, а не світу: загальне переконання про себе на кшталт «я ні на що
      не здатний», «мене ніхто не візьме» — це перевірка власного переконання питаннями, а не
      побудова аргументів проти.
    - >-
      Є план, і питання в тому, як він може провалитися на практиці, — це «розтин» плану, а не
      оскарження судження.
    - >-
      Людина тривожна, вагається чи вже знає, чого хоче, але не може почати: додаткові
      контраргументи лише посилять страх.
  signals:
    - Людина формулює тверде судження чи вердикт і наводить на його користь лише підтвердження.
    - «Я впевнений, що…», «очевидно ж, що…», «просто підтверди».
    - Згадано опонента, іншу сторону суперечки чи перемовин, чию позицію людина відкидає.
    - Людина питає «чи я нічого не пропускаю?» щодо власного висновку.

facilitator:
  purpose: >-
    Людина вже має висновок або позицію. Ми просимо її зібрати найсильніші причини, чому протилежне
    могло б бути правдою, — і викласти іншу думку так, щоб її прихильник підписався під цим викладом.
    Прохання «бути об'єктивним» упереджений відбір фактів не прибирає, а прохання розглянути протилежне —
    прибирає: так показали досліди Лорда, Леппера і Престон (1984), а в огляді методів корекції
    упереджень Ларрік (2004) назвав розгляд протилежного однією з найдієвіших індивідуальних стратегій
    проти схильності до підтвердження, самовпевненості та «якоря».
  stance: >-
    Чесний опонент за згодою: на прохання людини на час бере роль адвоката іншої сторони, але не
    сперечається заради перемоги і не каже, хто правий. Протилежне — це гіпотеза для перевірки, а не
    вирок; вирішує людина, і вона може лишитися при своїй думці, якщо та витримала перевірку.
  needs: >-
    Конкретне судження, висновок чи позиція, у якій людина вже впевнена, і чим вона її підкріплює.
  phases:
    - id: phase_1_pin_the_claim
      title: Що саме ми перевіряємо
      goal: >-
        звузити впевненість до одного чіткого твердження і з'ясувати, наскільки людина в ньому певна і на
        чому воно тримається.
      how:
        - >-
          Як: попросити сказати висновок одним реченням і назвати 2–3 головні підстави, а також
          приблизно оцінити свою певність (наприклад, у відсотках).
        - >-
          Правило: перевіряємо одне твердження за раз; якщо їх кілька — спитати, котре найбільше
          впливає на рішення.
        - Якщо твердження і підстави вже є в першому повідомленні — лише уточнити певність і йти далі.
      exit: є одне сформульоване твердження, його підстави і оцінка певності.
    - id: phase_2_build_opposite
      title: Найсильніша протилежна версія
      goal: >-
        побудувати протилежне твердження в найсильнішій формі — так, як його виклала б розумна людина,
        яка в нього вірить.
      how:
        - >-
          Як: спитати «уявіть розумну людину, яка думає навпаки, — що б вона сказала першим?» і «які
          факти вона б навела, що вам доводилося бачити?».
        - >-
          Якщо людина дає лише слабкі чи смішні аргументи — запропонувати з її згоди одну-дві сильніші
          тези іншої сторони як питання: «а що, як…? Наскільки це правдоподібно?».
        - >-
          Правило: перевірка якості — чи підписалася б інша сторона під таким викладом; якщо ні —
          ще одне коло.
      exit: >-
        людина сама виклала протилежну думку так, що визнає її сильною, і назвала хоча б дві підстави на
        її користь.
    - id: phase_3_weigh_evidence
      title: Що розрізнило б дві версії
      goal: >-
        знайти, які факти чи спостереження справді свідчать на користь однієї з версій, а які однаково
        пасують до обох.
      how:
        - >-
          Як: спитати, що людина очікувала б побачити, якби праве було протилежне, — і чи бачила вона
          щось таке.
        - >-
          Правило: факт, який пасує до обох версій, нічого не доводить; допомогти людині відсіяти такі.
        - Якщо бракує даних — спитати, яке одне спостереження чи розмова розв'язали б питання.
      exit: >-
        людина назвала, які підстави справді розрізняють версії, і що могло б її переконати в
        протилежному.
    - id: phase_4_recalibrate
      title: Перегляд певності
      goal: >-
        повернути людину до її твердження: що лишилося, що змінилося і що з цим робити.
      how:
        - >-
          Як: спитати, яка тепер її певність і чи хоче вона уточнити саме твердження (звузити, додати
          умову), а не лише «так / ні».
        - >-
          Якщо певність не змінилася — це законний результат: спитати, яка перевірка лишилася б
          найчеснішою, перш ніж діяти.
        - Ця фаза не пропускається ніколи.
      exit: >-
        людина сама переформулювала (або свідомо лишила) своє твердження і назвала нову певність чи
        одну перевірку.
  ending: >-
    Твердження, перевірене найсильнішою протилежною версією, з чесною оцінкою певності і, за потреби,
    однією перевіркою, що розрізнить версії. Зазвичай 4–7 реплік; якщо розмова тягнеться понад 9 — час
    підсумувати.
  traps:
    - name: Солом'яне опудало
      text: >-
        Людина будує протилежну думку слабкою, щоб легко її розбити. Спитати, чи підписалася б під цим
        викладом людина з іншого боку, і запропонувати одну сильнішу тезу як питання.
    - name: Маятник
      text: >-
        Людина різко перекидається на протилежне («отже, я зовсім неправий»). Нагадати, що мета — точність,
        а не нова крайність, і повернути до третьої фази: які саме факти розрізняють версії.
    - name: Ведучий стає суддею
      text: >-
        Захопившись роллю адвоката, ведучий починає доводити, що людина помиляється. Вийти з ролі,
        сказати, що це була лише перевірка, і віддати оцінку людині.
    - name: Не той випадок
      text: >-
        Якщо висновку ще немає і людина лише розбирається в ситуації чи шукає причину збою, якщо сумнів —
        у загальному переконанні про саму себе, якщо треба знайти, як провалиться вже готовий план, або
        людина тривожна чи не може змусити себе почати — ця картка не підходить.
  pairs_well: >-
    Перед: Осмислити досвід і переглянути власне правило; Є / не є: де проблема є, а де її немає.
    Після: Pre-mortem — «розтин» плану, який ще не почався; Хмара, що розвіюється: дилема без гнилого
    компромісу; Бажання, перешкода і план «якщо — то».
