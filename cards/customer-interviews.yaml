# Картка «Розпитати клієнтів про їхнє минуле, а не про свою ідею»: підготувати або розібрати розмови з клієнтами так,
# щоб почути факти, а не ввічливість. Джерела в research 04: §3.1 (Fitzpatrick 2013; Schmidt і Bijmolt 2020; Morwitz 2014), §4, §6.
id: customer-interviews
title: Розпитати клієнтів про їхнє минуле, а не про свою ідею (The Mom Test)
method: "The Mom Test (Fitzpatrick)"

router:
  needs: >-
    Задум чи продукт для інших людей і клієнти, з якими людина збирається говорити або вже говорила.
  when_yes:
    - Людина готується до зустрічей з можливими клієнтами і хоче дізнатися правду, а не зібрати компліменти.
    - Розмови вже були, люди хвалили й обіцяли купити, а потім не купили — треба зрозуміти, що в тих розмовах було фактом.
    - Про клієнтів відомі лише здогадки, і людина ще ні з ким із них не говорила про їхні справжні клопоти.
  when_no:
    - >-
      Розмови з клієнтами вже зібрано, і треба скласти з них картину роботи клієнта — ситуацію, мотиви, сили
      переходу, — це робота клієнта, яку «наймають» (JTBD).
    - >-
      Людина хоче перевірити попит діями — передпродажем, сторінкою з кнопкою «купити», — а не розмовами: це
      перевірка попиту до того, як будувати.
    - >-
      Продаж уже йде, клієнти платять, і питання — як дістати більше таких клієнтів: це канали.
    - Особисте питання без клієнтів і продукту для інших.
  signals:
    - «Як із ними говорити, щоб вони не підігрували?», «що питати на зустрічі?».
    - «Усі сказали, що користувалися б, а не купив ніхто».
    - Згадано опитування, анкету чи «запитаю, чи купили б» як план перевірки ідеї.

facilitator:
  purpose: >-
    Людина хоче дізнатися від клієнтів, чи потрібне їм те, що вона задумала, — і ризикує почути лише
    ввічливість. Ми готуємо (або розбираємо) розмови за правилами Роба Фіцпатріка (The Mom Test, 2013): говорити
    про життя клієнта, а не про ідею; питати про конкретне минуле, а не про «купили б»; вважати успіхом лише
    зобов'язання — час, репутацію чи гроші. Сама книга — практика, а не дослідження; але те, що гіпотетичні
    відповіді завищені, підтверджено: мета-аналіз 77 досліджень (Schmidt і Bijmolt, 2020) показав, що на
    питання «скільки б ви заплатили?» люди в середньому називають на 21 % більше, ніж платять насправді.
  stance: >-
    Уважний напарник перед важливими зустрічами: не пише за людину сценарій, а питає, що вона хоче дізнатися і як
    звучатиме її питання для клієнта; чесно позначає, коли питання підштовхує до потрібної відповіді.
  needs: >-
    Задум чи продукт і хоча б приблизно — з ким людина говоритиме або вже говорила.
  phases:
    - id: phase_1_what_to_learn
      title: Що треба дізнатися
      goal: >-
        назвати одне-два припущення про клієнтів, від яких найбільше залежить задум, — те, що людина хоче
        перевірити розмовами.
      how:
        - >-
          Як: спитати, що мало б бути правдою про клієнтів, щоб задум мав сенс, — яка проблема в них є, як часто,
          що вони вже з нею роблять.
        - >-
          Якщо людина хоче «дізнатися, чи сподобається ідея» — повернути до клієнта: що в його житті має
          відбуватися, щоб ідея була йому потрібна?
      skip_if: людина вже назвала, яке припущення про клієнтів хоче перевірити.
      exit: названо одне-два припущення про клієнтів, які перевірятимуть розмови.
    - id: phase_2_questions_about_the_past
      title: Питання про минуле, а не про ідею
      goal: >-
        скласти разом три-п'ять питань про те, що клієнт робив насправді, без згадки про ідею людини.
      how:
        - >-
          Як: попросити людину сформулювати питання своїми словами, а тоді разом перевірити кожне: чи можна на
          нього відповісти ввічливою вигадкою? Якщо так — переписати на «коли востаннє…», «що ви тоді зробили…»,
          «скільки це вам коштувало…».
        - >-
          Правило: питання «купили б ви?», «чи сподобалось би?», «скільки б заплатили?» — гіпотетичні; люди на них
          відповідають щедріше, ніж діють. Їх замінюємо питаннями про минулі дії.
        - >-
          Якщо розмови вже були — пройти записи людини: що з почутого — факт про минуле, а що — комплімент,
          загальні слова чи обіцянка на майбутнє.
      exit: людина має три-п'ять питань про минулі дії клієнта (або розбір уже почутого на факти і «воду»).
    - id: phase_3_commitment
      title: Що вважати успіхом зустрічі
      goal: >-
        наперед вирішити, яке зобов'язання клієнта покаже справжній інтерес — і що людина попросить наприкінці.
      how:
        - >-
          Як: спитати, що клієнт міг би віддати наприкінці розмови, якщо проблема для нього справжня — ще одну
          зустріч, знайомство з колегою, передоплату, участь у пробі.
        - >-
          Якщо людина боїться просити — нагадати, що відмова теж відповідь: вона каже більше, ніж похвала.
      exit: людина назвала, яке зобов'язання попросить, і що для неї означатиме відмова.
    - id: phase_4_who_and_next
      title: З ким говорити і що далі
      goal: >-
        назвати перших людей для розмов і як людина зрозуміє після них, що робити із задумом.
      how:
        - >-
          Як: спитати, де ці клієнти є вже зараз і кого з них людина може попросити про розмову цього тижня.
        - >-
          Як: разом сформулювати, що після п'яти розмов означало б «продовжувати», а що — «переглянути задум».
        - Ця фаза не пропускається ніколи.
      exit: людина назвала перших співрозмовників і ознаки, за якими вирішить, що далі.
  ending: >-
    Людина йде з одним-двома припущеннями про клієнтів, питаннями про минуле замість «купили б?», зобов'язанням,
    яке попросить, і першими людьми для розмов. Зазвичай 5–8 реплік; якщо розмова тягнеться понад 10 — час
    підсумувати.
  traps:
    - name: Презентація замість розмови
      text: >-
        Людина планує спершу розповісти про ідею і спитати думку. Нагадати, що після презентації клієнт
        відповідає про ідею, а не про своє життя, і запропонувати почати з його минулого досвіду.
    - name: Похвала як доказ
      text: >-
        «Всім сподобалось» людина сприймає як підтвердження. Спитати, що з почутого клієнти вже робили чи віддали
        — і чесно назвати решту гіпотезою.
    - name: Не той випадок
      text: >-
        Якщо розмови вже зібрано і треба скласти з них картину роботи клієнта, якщо людина хоче перевіряти попит
        діями, а не розмовами, якщо продаж уже йде і питання в каналах, або це особисте питання без клієнтів —
        ця картка не підходить.
  pairs_well: >-
    Перед: Яку роботу «наймають» зробити (JTBD). Після: Яку роботу «наймають» зробити (JTBD); Перевірити попит до
    того, як будувати; Позиціонування: з чим вас порівнюють і для кого ви найкращі.
