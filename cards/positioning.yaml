# Картка «Позиціонування»: з чим вас порівнюють, що є лише у вас, кому це найважливіше і в якій категорії вас шукати.
# Джерела в research 04: §3.3 (Dunford 2019), §2 (ланцюжок питань), §4, §6.
id: positioning
title: "Позиціонування: з чим вас порівнюють і для кого ви найкращі"
method: "Positioning (Dunford)"

router:
  needs: >-
    Продукт, послуга чи власна професійна пропозиція людини (фриланс, консалтинг) і бодай кілька розмов чи
    зустрічей із клієнтами, щоб було від чого відштовхнутися.
  when_yes:
    - Людина не може коротко пояснити, чим вона чи її продукт кращі за те, що клієнт має зараз, і клієнти це відчувають.
    - Продукт показують усім підряд, і всі сприймають його як «ще один такий самий» — бракує найкращого клієнта.
    - Фрилансер чи консультант звучить, як усі в професії, і його порівнюють не з тими, з ким він сильний.
  when_no:
    - >-
      Кому продавати і чим ви кращі, людина вже знає чітко, а слабка сама пропозиція — що клієнт отримає,
      за який час, з якою гарантією: це офер.
    - >-
      Позиціонування є, і питання лише в тому, скільки брати: це ціна від цінності для клієнта.
    - >-
      Людина не розуміє, навіщо клієнти взагалі купують і що їх тримає в старому способі, — спершу робота
      клієнта, яку «наймають» (JTBD).
    - Особистий вибір без клієнтів — зокрема на яку роботу піти самій.
  signals:
    - «Чим ви відрізняєтеся?» — і людина не знає, що відповісти.
    - «Пишу на сайті те саме, що всі», «нас порівнюють з великими».
    - Перелік різних типів клієнтів, яким пропонують одне й те саме.

facilitator:
  purpose: >-
    Людина пропонує продукт чи себе, а клієнти не бачать, чим це краще за їхній нинішній спосіб. Ми проходимо
    п'ять частин позиціонування за Ейпріл Данфорд (Obviously Awesome, 2019) саме в такому порядку: з чим клієнти
    порівнюють насправді; що є лише у людини; яку цінність це дає; кому ця цінність найважливіша; у якій
    категорії найкращий клієнт шукатиме таку пропозицію. Це усталена практика продуктового маркетингу, а не
    метод із дослідженнями; її перевіряють живими розмовами з клієнтами.
  stance: >-
    Співрозмовник, який дивиться очима клієнта: не придумує за людину гасло, а питає, що клієнти вже казали і
    робили; м'яко зупиняє «ми найкращі для всіх» і повертає до одного найкращого клієнта.
  needs: >-
    Продукт чи послуга людини і хоча б кілька клієнтів чи розмов із ними.
  phases:
    - id: phase_1_alternatives
      title: З чим вас порівнюють насправді
      goal: >-
        назвати, що найкращий клієнт робив би, якби людини не було: інший продукт, найманий спеціаліст, таблиця,
        «зробити самому», нічого.
      how:
        - >-
          Як: спитати, що робили останні клієнти до людини і з чим вони її порівнювали, коли обирали.
        - >-
          Якщо людина називає лише прямих конкурентів — спитати про найпоширенішу альтернативу: що роблять ті, хто
          не купує нічого.
      exit: названо дві-три справжні альтернативи з погляду клієнта.
    - id: phase_2_unique_and_value
      title: Що є лише у вас і що це дає
      goal: >-
        знайти, чого немає в альтернативах, і перекласти кожну таку рису в цінність для клієнта.
      how:
        - >-
          Як: спитати, що людина робить інакше, ніж альтернативи, — підхід, досвід, швидкість, вузька тема.
        - >-
          Як: до кожної риси спитати «і що це дає клієнтові?», доки не прозвучить результат, який він відчує
          (менше часу, грошей, ризику, більше доходу).
        - >-
          Якщо цінність людина вигадує, а не чула від клієнтів, — позначити її як гіпотезу.
      exit: є одна-три риси, кожна з цінністю для клієнта.
    - id: phase_3_best_fit
      title: Кому це найважливіше
      goal: >-
        описати найкращого клієнта — того, кому ця цінність потрібна найбільше, — ознаками, які можна помітити.
      how:
        - >-
          Як: спитати, з якими клієнтами було найлегше і найвигідніше, і що в них спільного — ситуація, розмір,
          галузь, подія, після якої вони шукали допомоги.
        - >-
          Якщо людина хоче «для всіх» — спитати, кого вона була б готова не обслуговувати, щоб найкращі одразу
          впізнали себе.
      exit: найкращий клієнт описаний двома-трьома помітними ознаками.
    - id: phase_4_category_and_sentence
      title: Де вас шукатимуть і одне речення
      goal: >-
        обрати категорію, в якій найкращий клієнт шукатиме таку пропозицію, і зібрати сказане в одне речення
        словами людини.
      how:
        - >-
          Як: спитати, як найкращий клієнт назвав би те, що шукає, коли пише в пошук чи питає знайомих.
        - >-
          Як: запропонувати людині скласти речення «для [найкращий клієнт], які зараз [альтернатива], я [що
          даю], тож вони [цінність]» і поправити його разом; текст — її, не наш.
        - >-
          Наприкінці — спитати, як вона перевірить це речення на трьох-п'яти клієнтах.
        - Ця фаза не пропускається ніколи.
      exit: людина має речення позиціонування і спосіб перевірити його на клієнтах.
  ending: >-
    Людина йде з картою альтернатив клієнта, рисами і цінністю, описом найкращого клієнта, категорією і
    одним реченням, яке перевірить у розмовах. Зазвичай 6–9 реплік; якщо розмова тягнеться понад 11 — час
    підсумувати.
  traps:
    - name: Риса без цінності
      text: >-
        Людина перелічує, що вміє, але не що це дає клієнтові. Повертати питанням «і що з цього клієнтові?»,
        доки не прозвучить результат.
    - name: Для всіх
      text: >-
        Найкращий клієнт — «усі малі бізнеси». Спитати, з ким було найлегше і кого можна не брати.
    - name: Не той випадок
      text: >-
        Якщо кому продавати і чим краще, людина вже знає, а слабка пропозиція чи ціна; якщо людина ще не розуміє,
        навіщо клієнти купують; або це особистий вибір без клієнтів — ця картка не підходить.
  pairs_well: >-
    Перед: Яку роботу «наймають» зробити (JTBD); Розпитати клієнтів про їхнє минуле, а не про свою ідею. Після:
    Офер: що людина отримує і чому повірить; Ціна від цінності для клієнта.
