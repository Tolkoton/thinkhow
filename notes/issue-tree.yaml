- id: issue-tree-router
  audience: router
  cards:
  - issue-tree
  title: Широке питання однієї природи
  noticed: 'Типові ситуації: власник інтернет-магазину не розуміє, чому впав дохід; керівник хоче «вирости вдвічі»
    і не знає, з якого боку підійти; людина перелічує десяток можливих причин упереміш і просить «розкласти по поличках»;
    хтось просить план, але не знає, чому виникла проблема, а пояснень кілька різних.'
  do: 'Плутають з complexity-sensemaking: якщо в ситуації змішано речі різної природи або щось «горить» — complexity-sensemaking;
    якщо все можна розібрати аналізом, просто питання широке, — issue-tree. Плутають з five-whys: одна конкретна
    подія в знайомому процесі — five-whys; широке питання про метрику чи результат — issue-tree. Якщо людина перевантажена
    і виснажена, велике дерево лише додасть ваги. Якщо варіанти вже є — weighted-matrix.'
  basis: Minto B., "The Pyramid Principle", 1987 (книгу не відкривав); Wikipedia, "MECE principle" — https://en.wikipedia.org/wiki/MECE_principle
    ; огляд "The McKinsey Mind" (Rasiel, Friga) — https://manassaloi.com/booksummaries/2016/04/20/mcKinsey-mind-ethan-paul.html
    .
- id: issue-tree-facilitator
  audience: facilitator
  cards:
  - issue-tree
  title: Гілки, що не перетинаються, і важлива гілка
  noticed: 'Допомагає, коли людина спокійна і готова кілька реплік розбирати. Застрягають так: перший поділ дає
    гілки, що перетинаються («маркетинг», «реклама», «клієнти»); дерево розростається заради повноти, а до перевірки
    не доходить; людина обирає зручну гілку, де їй комфортно, а не ту, що важить; корінь сформульовано так широко,
    що його не розкласти. У матеріалах про issue trees радять поєднувати MECE з правилом 80/20: не доводити кожну
    гілку до досконалості.'
  do: 'Для першого поділу підказати форму, а не зміст: «дохід — це скільки людей купує і скільки кожен платить?
    чи інакше поділили б ви?» — і хай людина обере свій поділ. Перевірка гілок: «чи може щось потрапити в обидві?»,
    «чи є щось, що не потрапило нікуди?». Для вибору гілки: «що з цього, якщо підтвердиться, змінить найбільше?».
    Листки перетворювати на питання, які можна перевірити даними чи розмовою. Де копати, вирішує людина.'
  basis: 'Wikipedia, "MECE principle" (Minto, McKinsey) — https://en.wikipedia.org/wiki/MECE_principle ; McKinsey-атрибутований
    навчальний слайд про issue trees (MECE і 80/20; авторство не підтверджено) — https://www.slideshare.net/slideshow/425923230-mckinsey-problem-solviaaang-pptx/284804058
    . Знайдено лише пошуком, сторінок не відкривав: https://en.wikipedia.org/wiki/MECE_principle, https://www.slideshare.net/slideshow/425923230-mckinsey-problem-solviaaang-pptx/284804058.
    Принцип MECE — Minto B., «The Pyramid Principle», 1987 (книгу не відкривав).'
