- id: pre-mortem-router
  audience: router
  cards:
  - pre-mortem
  title: План є, старт ще попереду
  noticed: 'Типові ситуації: команда затвердила запуск продукту і має кілька тижнів до старту; людина вирішила переїхати
    чи змінити роботу і хоче перевірити план; підприємець підписує угоду з партнером; хтось готує подію чи ремонт
    зі строком. Спільне — план або обране рішення, яке ще не почалося, і строк.'
  do: 'Плутають з goal-to-plan: якщо плану ще немає — goal-to-plan; якщо є і його перевіряють — pre-mortem. Плутають
    з five-whys і reflective-cycle: якщо провал уже стався насправді — це не «розтин» майбутнього, а пошук причини
    (five-whys) або осмислення досвіду (reflective-cycle). Плутають з wrap-decision: якщо рішення ще не ухвалене
    і варіанти не розширено — wrap-decision. Якщо людина тривожна й вагається щодо самої мети — не ця картка.'
  basis: 'Klein G., "Performing a Project Premortem", Harvard Business Review, 2007 — https://hbr.org/2007/09/performing-a-project-premortem
    ; Mitchell D. J., Russo J. E., Pennington N., "Back to the future: Temporal perspective in the explanation of
    events", Journal of Behavioral Decision Making, 1989 — https://colab.ws/articles/10.1002%2Fbdm.3960020103 .'
- id: pre-mortem-facilitator
  audience: facilitator
  cards:
  - pre-mortem
  title: Провал як доконаний факт
  noticed: 'Найбільше допомагає людям, упевненим у плані. Klein описує мету: зробити безпечним озвучення сумнівів
    тоді, коли вони ще корисні. Застрягають так: людина повертається до «що може піти не так?» і дає загальні ризики;
    називає лише зовнішню екзотику («метеорит», криза); уникає незручних внутрішніх причин — власної самовпевненості,
    людського чинника; після розтину впадає в параліч і хоче все скасувати. У дослідженні Mitchell та ін. (1989)
    на пояснення найбільше впливала певність результату, тому важливо, щоб провал звучав як факт.'
  do: 'Ставити в точку після провалу в минулому часі: «минув рік. План провалився. Що сталося?». Якщо причини зовнішні
    — «а що в цьому провалі залежало від вас чи команди?», «яке припущення виявилося хибним?». Для відбору — «де
    і ймовірність, і шкода високі?», лишити 1–2. Якщо параліч — нагадати, що мета — щеплення плану, і спитати, яку
    одну зміну людина внесе і за яким раннім сигналом зрозуміє, що загроза збувається.'
  basis: 'Klein G., HBR, 2007 — https://hbr.org/2007/09/performing-a-project-premortem ; Mitchell, Russo, Pennington,
    1989 — https://colab.ws/articles/10.1002%2Fbdm.3960020103 (анотація: ефект дає певність результату, а не сам
    час; цифра «на 30 % більше причин» — за Klein і вторинними джерелами, в анотації її немає).'
