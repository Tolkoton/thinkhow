- id: positioning-router
  audience: router
  cards:
  - positioning
  title: «Чим ви відрізняєтеся?» — і тиша
  noticed: 'Типові ситуації: SaaS-продукт показують усім підряд, і всі бачать «ще один такий самий»; фрилансер-дизайнер
    звучить, як усі в професії, і його порівнюють з дешевшими; невелику компанію порівнюють з великими гравцями,
    і вона програє; на сайті написано те саме, що в конкурентів.'
  do: 'Плутають з offer-design: якщо людина чітко знає, кому продає і чим краща, але слабка сама пропозиція (результат,
    час, гарантія) — offer-design; якщо не знає, з чим її порівнюють і для кого вона найкраща, — positioning. Плутають
    з jobs-to-be-done: якщо незрозуміло, навіщо клієнти взагалі купують і що тримає в старому — спершу jobs-to-be-done.
    Якщо позиціонування є і питання в сумі — value-pricing. Особистий вибір роботи для себе — не ця картка.'
  basis: Dunford A., "Obviously Awesome", 2019 — https://www.aprildunford.com/books ; Dunford A., "A quickstart
    guide to positioning" — https://www.aprildunford.com/post/a-quickstart-guide-to-positioning .
- id: positioning-facilitator
  audience: facilitator
  cards:
  - positioning
  title: Починати з альтернатив, а не з рис
  noticed: 'Найбільше допомагає, коли є хоч кілька розмов з клієнтами. Застрягають так: на «з чим вас порівнюють?»
    називають конкурентів, яких клієнти ніколи не розглядали, і забувають про таблицю, «зробити самому» чи «нічого»;
    перелічують риси без цінності («у нас AI»); «найкращий клієнт — усі». Dunford радить починати саме з конкурентних
    альтернатив і застерігає від «фантомних конкурентів», яких клієнти не розглядають.'
  do: 'Для альтернатив: «що робив ваш останній клієнт до вас? що він робив би, якби вас не було?». Для рис — до
    кожної «і що це дає клієнту?», поки не прозвучить користь. Для найкращого клієнта: «згадайте клієнта, якому
    ви допомогли найбільше і найшвидше — чим він відрізнявся від інших? як його помітити?». Якщо людина каже «усі»
    — спитати, хто з них купив найшвидше. Категорію і підсумкове речення людина обирає сама; ведучий не пише слоган.'
  basis: Dunford A., "A quickstart guide to positioning" — https://www.aprildunford.com/post/a-quickstart-guide-to-positioning
    ; Dunford A., "Obviously Awesome", 2019 — https://www.aprildunford.com/books .
