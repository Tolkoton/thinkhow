- id: complexity-sensemaking-router
  audience: router
  cards:
  - complexity-sensemaking
  title: Коли клубок різної природи
  noticed: 'Типово приходять так: власник малого бізнесу водночас втрачає ключового працівника, має касовий розрив
    і незрозумілу реакцію клієнтів на нову ціну; керівник команди після реорганізації не знає, що з навалу робити
    першим; людина в особистій кризі, де поруч стоять термінова справа (щось «горить») і довгі питання без відповіді.
    Ознака — в одному повідомленні змішано речі, частину яких можна порахувати, а частину лише спробувати.'
  do: 'Найчастіше плутають з issue-tree: якщо всі частини однієї природи і їх можна розібрати аналізом, але питання
    широке, — це issue-tree; якщо частини різні (щось рахується, щось лише пробується, щось горить), — complexity-sensemaking.
    Від five-whys і is-is-not відрізняє те, що тут немає однієї події-збою, причину якої шукають. Якщо варіанти
    вже є і треба вибрати — це weighted-matrix або wrap-decision, а не ця картка.'
  basis: 'Snowden D. J., Boone M. E., "A Leader''s Framework for Decision Making", Harvard Business Review, 2007
    — https://hbr.org/2007/11/a-leaders-framework-for-decision-making ; Kurtz C. F., Snowden D. J., "The new dynamics
    of strategy: Sense-making in a complex and complicated world", IBM Systems Journal, 2003 — https://research.ibm.com/publications/the-new-dynamics-of-strategy-sense-making-in-a-complex-and-complicated-world
    . Типові ситуації — узагальнення з цих текстів і з самої картки.'
- id: complexity-sensemaking-facilitator
  audience: facilitator
  cards:
  - complexity-sensemaking
  title: Де застрягають у визначенні природи
  noticed: 'Найбільше допомагає на початку розмови, коли людина ще не обрала підхід. Застрягають так: людина каже
    «усе складно» про кожну частину і не розрізняє, де відповідь можна знайти аналізом чи в експерта, а де ніхто
    наперед не знає; або чекає, поки «все проаналізує», там, де реакцію людей можна дізнатися лише пробою; або класифікує
    частини й зупиняється, не дійшовши до першого кроку. Snowden і Boone застерігають саме від звички керівників
    застосовувати один стиль дій до всіх ситуацій.'
  do: 'Щоб розрізнити природу частини, питати не «яка вона?», а «чи є хтось, хто вже знає відповідь або міг би її
    порахувати?» і «якби ви спробували маленький крок, чи дізналися б більше, ніж з будь-якого аналізу?». Якщо людина
    вагається між двома типами — хай назве найменшу безпечну пробу і що вона покаже. Для «пожежі» — одне питання:
    що зупинить шкоду сьогодні. Наприкінці кожної частини — перший крок словами людини; ведучий не призначає частинам
    типи сам, а лише питає.'
  basis: 'Snowden D. J., Boone M. E., "A Leader''s Framework for Decision Making", HBR, 2007 — https://hbr.org/2007/11/a-leaders-framework-for-decision-making
    (сторінку відкрито, повний текст за paywall; зміст рекомендацій — за картою картки і вторинним описом https://en.wikipedia.org/wiki/Cynefin
    ). Формулювання питань — практика, не дослідження. Знайдено лише пошуком, сторінок не відкривав: https://en.wikipedia.org/wiki/Cynefin.'
