- id: evaporating-cloud-router
  audience: router
  cards:
  - evaporating-cloud
  title: Дилема двох справжніх потреб
  noticed: 'Типові ситуації: власник мусить скоротити витрати і водночас не може втратити людей; батьки хочуть дати
    дитині свободу і водночас захистити її; два відділи вимагають протилежного (швидше випускати — ретельніше перевіряти),
    і обидва мають рацію щодо своєї потреби; людина розривається між кар''єрним кроком і обіцянкою родині. Ознака
    — «що б я не обрав, щось втрачу» і відмова від поділу навпіл.'
  do: 'Плутають з weighted-matrix: якщо варіанти не виключають одне одного за суттю і їх можна зважити — weighted-matrix;
    якщо кожна дія захищає справжню потребу і вибір будь-якої щось руйнує — evaporating-cloud. Від wrap-decision
    відрізняє наявність двох протилежних потреб: у wrap-decision рамка «так чи ні» щодо однієї дії, яку треба розширити.
    Якщо людина хоче зрозуміти позицію опонента, а не розв''язати власну дилему, — consider-opposite.'
  basis: 'Goldratt E. M., "It''s Not Luck", 1994 (книгу не відкривав). Опис методу: Untools, "Conflict resolution
    diagram" (за Dettmer, "The Logical Thinking Process") — https://www.untools.co/conflict-resolution-diagram ;
    Wikipedia, "Evaporating cloud" — https://en.wikipedia.org/wiki/Evaporating_cloud .'
- id: evaporating-cloud-facilitator
  audience: facilitator
  cards:
  - evaporating-cloud
  title: Від позицій до потреб і припущень
  noticed: 'Допомагає, коли людина вже перепробувала компроміси і жоден не влаштовує. Застрягають так: називають
    позиції («звільнити двох») замість потреб («втримати бюджет»); одну сторону дилеми описують карикатурно, бо
    вона чужа; не можуть назвати спільну мету обох потреб; на питання про припущення кажуть «так просто треба».
    Untools називає спільну мету найважливішою частиною діаграми.'
  do: 'Якщо людина говорить позиціями — спитати про кожну: «що саме ця дія вам дає? навіщо вона?». Спільну мету
    шукати питанням «заради чого вам обидві ці потреби?». Для припущень — «чому, щоб мати [потребу], треба саме
    [дію]? що мало б бути правдою?» і «чи бувало, що [потребу] задовольняли інакше?». Коли людина знаходить припущення,
    яке не тримається, — хай сама шукає дію, що обходить його; ведучий не пропонує готового рішення і не підштовхує
    до середини.'
  basis: 'Untools, "Conflict resolution diagram" — https://www.untools.co/conflict-resolution-diagram ; Wikipedia,
    "Evaporating cloud" — https://en.wikipedia.org/wiki/Evaporating_cloud . Методу бракує строгих досліджень (як
    і зазначено в картці); оригінальну книгу Goldratt не перевірено. Знайдено лише пошуком, сторінок не відкривав:
    https://en.wikipedia.org/wiki/Evaporating_cloud. Метод — з теорії обмежень: Goldratt E. M., «It''s Not Luck»,
    1994 (книгу не відкривав).'
