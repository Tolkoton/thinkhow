- id: customer-interviews-router
  audience: router
  cards:
  - customer-interviews
  title: Як говорити з клієнтами, щоб почути правду
  noticed: 'Типові ситуації: людина з ідеєю (курс, застосунок, послуга) збирається «спитати знайомих, чи купили
    б»; засновник провів десяток розмов, усі хвалили, а не купив ніхто; хтось планує анкету чи опитування як перевірку
    ідеї; фахівець переходить у власну справу і ще жодного разу не говорив з майбутніми клієнтами про їхні клопоти.
    Фіцпатрік пише книгу саме з того, що розмови з клієнтами в його першій компанії давали мало користі.'
  do: 'Найчастіше плутають з jobs-to-be-done: якщо розмов ще не було або вони дали лише ввічливість — customer-interviews;
    якщо розмови є і з них треба скласти ситуацію, мотиви й сили переходу — jobs-to-be-done. Від demand-test відрізняє
    інструмент: тут розмова, а demand-test — дія з ціною (передпродаж, кнопка оплати). Якщо клієнти вже платять
    і питання, де взяти більше, — це traction-channels.'
  basis: 'Fitzpatrick R., "The Mom Test", 2013 — https://www.momtestbook.com/ ; огляд правил книги: Brikman Y.,
    "''The Mom Test'' by Rob Fitzpatrick", 2023 — https://www.ybrikman.com/blog/2023/03/29/the-mom-test/ .'
- id: customer-interviews-facilitator
  audience: facilitator
  cards:
  - customer-interviews
  title: Питання про минуле замість «купили б?»
  noticed: 'Найкорисніше перед першими зустрічами або після розмов, що закінчилися похвалою без покупки. Застрягають
    так: людина пише питання на кшталт «чи користувалися б ви…», «скільки б заплатили»; вважає успіхом компліменти;
    не може назвати, яке зобов''язання клієнта (час, репутація, гроші) покаже справжній інтерес; починає зустріч
    з презентації ідеї. Фіцпатрік називає три типи поганих даних: компліменти, «пух» (узагальнення, обіцянки, гіпотетичне)
    та ідеї й побажання фіч.'
  do: 'Якщо людина пропонує питання про майбутнє — попросити переписати його так, щоб воно було про останній конкретний
    випадок: «коли це сталося востаннє? що ви тоді зробили? що вже пробували?». Якщо «не знаю, що вважати успіхом»
    — спитати, що клієнт міг би віддати наприкінці зустрічі: ще одну зустріч, знайомство, передоплату. При розборі
    вже проведених розмов — пройти по нотатках і разом позначити, де факт про минуле, а де похвала. Висновок про
    задум робить людина.'
  basis: 'Fitzpatrick R., "The Mom Test", 2013 — https://www.momtestbook.com/ ; Brikman Y., огляд книги, 2023 —
    https://www.ybrikman.com/blog/2023/03/29/the-mom-test/ ; Schmidt J., Bijmolt T. H. A., meta-analysis of hypothetical
    bias, Journal of the Academy of Marketing Science, 2020 — https://cris-portal.uni-muenster.de/portal/en/publication/60727941
    . Знайдено лише пошуком, сторінок не відкривав: https://cris-portal.uni-muenster.de/portal/en/publication/60727941.'
