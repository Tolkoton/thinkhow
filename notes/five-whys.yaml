- id: five-whys-router
  audience: router
  cards:
  - five-whys
  title: Конкретний збій у знайомому процесі
  noticed: 'Типові ситуації: команда втретє зриває реліз; бухгалтер щомісяця запізнюється зі звітом; клієнт пішов
    після пілоту, і менеджер знає, як ішов процес; людина регулярно запізнюється на роботу через ранковий розпорядок.
    Спільне — одна названа подія з наслідком, і людина знає процес зсередини.'
  do: 'Найчастіше плутають з is-is-not: якщо людина пояснює, що до чого призвело, — five-whys; якщо механізм невідомий,
    але видно, де проблема є, а де ні («лише на Android ввечері»), — is-is-not. Якщо питання широке («чому конкуренти
    ростуть») — issue-tree. Якщо в історії гнів на когось чи гостра провина — reflective-cycle, бо «чому» звучатиме
    як допит. Якщо людина відкладає і не може почати — mental-contrasting.'
  basis: Ohno T., "Toyota Production System", 1988 (книгу не відкривав; опис — Wikipedia, "Five whys" — https://en.wikipedia.org/wiki/Five_whys
    ); Card A. J., "The problem with '5 whys'", BMJ Quality & Safety, 2017 — https://psnet.ahrq.gov/issue/problem-5-whys
    .
- id: five-whys-facilitator
  audience: facilitator
  cards:
  - five-whys
  title: Розгалуження і зупинка не на людині
  noticed: 'Допомагає при повторюваних збоях у процесі, який людина знає. Застрягають так: ланцюжок закінчується
    на людині («бо Іван не перевірив»), а зміна — на заклику «бути уважнішим»; людина йде однією лінією, хоча причин
    кілька; відповіді — здогадки з крісла, не перевірені фактом. Card (2017) і Peerally зі співавторами (2017) критикують
    саме фокус на одній причині і слабку якість аналізу; голе «чому?» людина сприймає як допит.'
  do: 'Замість «чому?» — питання про обставини з її ж словами: «що в процесі дозволило, щоб [подія]?», «що мало
    б бути інакше, щоб це не сталося?». Коли відповідь — людина, спитати: «що зробило помилку можливою для будь-кого
    на цьому місці?». Коли причин дві — записати обидві гілки. Біля кожної ланки спитати: «це ви бачили чи припускаєте?».
    Наприкінці — перевірка знизу вгору: «якщо змінити це, чи зник би збій?». Зміну формулює людина.'
  basis: 'Card A. J., BMJ Quality & Safety, 2017 — https://psnet.ahrq.gov/issue/problem-5-whys ; Peerally M. F.,
    Carr S., Waring J., Dixon-Woods M., "The problem with root cause analysis", BMJ Quality & Safety, 2017 — https://psnet.ahrq.gov/issue/problem-root-cause-analysis
    . Знайдено лише пошуком, сторінок не відкривав: https://psnet.ahrq.gov/issue/problem-root-cause-analysis.'
