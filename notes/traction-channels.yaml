- id: traction-channels-router
  audience: router
  cards:
  - traction-channels
  title: Перші клієнти були — звідки наступні
  noticed: 'Типові ситуації: майстер чи репетитор отримав перших клієнтів від знайомих, і вони скінчилися; невеликий
    онлайн-магазин виріс на одному форумі чи ярмарку, який вичерпався; засновник розривається між Instagram, рекламою,
    партнерами і холодними дзвінками; людина хоче вкласти гроші в рекламу, але спершу зрозуміти, що працює.'
  do: 'Плутають з demand-test: якщо ще ніхто нічого не купив — спершу demand-test, а не канали. Плутають з offer-design:
    клієнти приходять, але не купують, бо незрозуміло, що отримають, — offer-design. Плутають з positioning: людина
    не знає, хто її найкращий клієнт, — каналу нема для кого обирати, спершу positioning. Якщо канали є, і питання,
    чи окупається кожен клієнт, — unit-economics.'
  basis: 'Weinberg G., Mares J., "Traction", 2014 — опис Bullseye: Goodreads author blog, "How To Use The Bullseye
    Framework For Marketing Channel Prioritization" — https://www.goodreads.com/author_blog_posts/18671171-how-to-use-the-bullseye-framework-for-marketing-channel-prioritization
    . Книгу не відкривав; джерело одне і вторинне.'
- id: traction-channels-facilitator
  audience: facilitator
  cards:
  - traction-channels
  title: Ширше коло, дешевий тест, число успіху
  noticed: 'Найбільше допомагає, коли попит уже підтверджено, а джерело клієнтів вичерпується. Застрягають так:
    людина розглядає лише звичні канали (соцмережі, реклама); хоче робити все одночасно; запускає тест без числа
    успіху і потім не знає, чи спрацювало; не може пояснити, чому спрацював перший канал. Bullseye радить починати
    з недорогих тестів і зосереджуватися на тому, що дає клієнтів, а потім повторювати цикл.'
  do: 'Для нинішнього джерела: «звідки прийшли ваші останні п''ять клієнтів? чому вони повірили саме там?». Для
    ширшого кола: пройтися по типах каналів, про які людина не думала (партнери, події, контент, прямі продажі,
    сарафан), і на кожен спитати «чи бувають там ваші клієнти?». Для тесту: «скільки клієнтів чи заявок за два тижні
    означатиме, що канал вартий продовження?». Два-три канали обирає людина.'
  basis: Weinberg G., Mares J., "Traction", 2014 — https://www.goodreads.com/author_blog_posts/18671171-how-to-use-the-bullseye-framework-for-marketing-channel-prioritization
    ; Graham Mann, book notes "Traction" — https://grahammann.net/book-notes/traction-gabriel-weinberg (сторінку
    не відкривав, лише видача). Практика стартапів, без досліджень.
