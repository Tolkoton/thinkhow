- id: offer-design-router
  audience: router
  cards:
  - offer-design
  title: Пропозиція звучить як перелік робіт
  noticed: 'Типові ситуації: репетитор продає «10 занять», а батьки не бачать, що дитина отримає; SMM-фахівець пропонує
    «ведення соцмереж» і чує «подумаю»; консультант складає пакет і не знає, що туди класти і яку гарантію дати;
    клієнти цікавляться, але не купують, і людина підозрює, що слабка пропозиція, а не ціна.'
  do: 'Плутають з value-pricing: якщо зміст і результат пропозиції ясні, а питання лише в сумі — value-pricing;
    якщо незрозуміло, що клієнт отримає і чому повірить, — offer-design. Плутають з positioning: якщо людина не
    знає, для кого вона найкраща і з чим її порівнюють — спершу positioning. Якщо пропозиція готова і треба дізнатися,
    чи за неї платитимуть, — demand-test.'
  basis: 'Hormozi A., "$100M Offers", 2021 — сторінка книги: https://www.acquisition.com/books (зміст рівняння цінності
    на ній не наведено; перевірено лише вторинні описи, напр. https://www.supersummary.com/100m-offers/section-3-summary/
    — не відкрилася, 429). Джерело тонке: практика продажів без досліджень.'
- id: offer-design-facilitator
  audience: facilitator
  cards:
  - offer-design
  title: Результат клієнта, віра і зусилля
  noticed: 'Найбільше допомагає, коли людина продає послугу чи пакет і чує «цікаво, але…». Застрягають так: на «який
    результат хоче клієнт?» людина знову описує, що робить сама; додає в пакет усе підряд, щоб здавався ціннішим;
    обіцяє результат, який не може гарантувати; не знає, чим підтвердити, що в клієнта вийде. Оскільки рівняння
    Хормозі — практика без досліджень, офер наприкінці лишається гіпотезою.'
  do: 'Для результату: «що зміниться в житті клієнта через місяць після роботи з вами — його словами?» і «як він
    сам би це сказав подрузі?». Для віри: «що вже може показати, що в нього вийде, — випадки, відгуки, пробний крок?».
    Для часу і зусиль: «що клієнт відчує вже в перший тиждень? що з його роботи ви могли б узяти на себе?». Кожну
    обіцянку перевірити: «чи зможете ви виконати її для кожного?». Наприкінці — як перевірити офер на справжніх
    клієнтах (demand-test). Пропозицію складає людина.'
  basis: Hormozi A., "$100M Offers", 2021 — https://www.acquisition.com/books ; вторинний опис рівняння цінності
    (dream outcome × perceived likelihood / time delay × effort and sacrifice) — Medium/Illumination, https://medium.com/illumination/alex-hormozis-value-equation-is-a-true-revelation-b887363cc6b6
    (сторінку не відкривав, лише видача пошуку). Джерела тонкі.
