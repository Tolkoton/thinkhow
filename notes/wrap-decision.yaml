- id: wrap-decision-router
  audience: router
  cards:
  - wrap-decision
  title: «Чи варто мені…?» з високими ставками
  noticed: 'Типові ситуації: людина вирішує, чи звільнятися з роботи, і бачить лише «так чи ні»; підприємець думає,
    чи продавати бізнес чи брати інвестора; родина вирішує, чи переїжджати в інше місто; хтось вагається, чи підписувати
    довгий контракт. Хіти пишуть, що важкі рішення псуються вузькою рамкою, пошуком підтверджень, короткочасною
    емоцією і самовпевненістю.'
  do: 'Плутають з weighted-matrix: варіанти вже чітко названі і треба лише зважити — weighted-matrix; рамка «так
    чи ні» щодо однієї дії — wrap-decision. Плутають з reversible-doors: людина в тривозі, часу обмаль або рішення
    легко скасувати — reversible-doors. Плутають з pre-mortem: план уже обрано і його перевіряють на ризики — pre-mortem.
    Дві непримиренні потреби — evaporating-cloud.'
  basis: 'Heath C., Heath D., "Decisive", 2013 — https://heathbrothers.com/books/decisive/ ; опис кроків WRAP: University
    of Florida HR, "WRAP Your Decisions" (транскрипт) — https://training.hr.ufl.edu/resources/LeadershipToolkit/transcripts/WRAPYourDecisionsPodcast.pdf
    (PDF не відкривав, лише видача).'
- id: wrap-decision-facilitator
  audience: facilitator
  cards:
  - wrap-decision
  title: Ширше за «так чи ні» без підставних варіантів
  noticed: 'Найбільше допомагає, коли людина спокійна і має 8–10 реплік. Застрягають так: на «які ще є варіанти?»
    кажуть «інших немає» або вигадують підставні, щоб обрати свій; перевірка реальністю стає нескінченним збиранням
    даних; на етапі відстані людина відповідає чужими пріоритетами («батьки кажуть»); на «підготуватися помилитися»
    — «я не помилюся». Larrick (2004) показав, що заклики «бути об''єктивним» не працюють, працюють зовнішні процедури
    — WRAP і є такою.'
  do: 'Для ширшого вибору: «якби цей варіант зник, що б ви зробили?», «а можна і те, і те?», «хто вже розв''язував
    схоже — як?». Перевірку реальністю обмежити: «яку одну маленьку пробу можна зробити до рішення?». Для відстані:
    «що порадили б ви найкращому другові в цій ситуації?». Для помилки: «за яким раннім сигналом ви зрозумієте,
    що час переглянути рішення?». Варіант обирає людина.'
  basis: Heath C., Heath D., "Decisive", 2013 — https://heathbrothers.com/books/decisive/ ; Larrick R. P., "Debiasing",
    2004 — https://scholars.duke.edu/publication/1056892 ; Shortform, "WRAP Decision-Making" (вторинний опис, не
    відкривав) — https://www.shortform.com/blog/wrap-decision-making/ .
