- id: scamper-router
  audience: router
  cards:
  - scamper
  title: Працює, але не так — бракує ідей
  noticed: 'Типові ситуації: власниця кав''ярні хоче оновити меню чи формат, не вигадуючи все з нуля; організатор
    щорічної події бачить, що вона приїлася; викладач хоче змінити курс, який «працює, але нудно»; команда застрягла
    на одному-двох очевидних покращеннях продукту.'
  do: 'Плутають з first-principles: якщо під сумнівом сама основа («а чи потрібне це взагалі?») або нічого ще немає
    — first-principles; якщо є конкретна річ і треба ідей, як її змінити, — scamper. Якщо варіанти вже є і треба
    вибрати — weighted-matrix. Якщо щось зламалося і людина шукає причину — five-whys чи is-is-not: генерація змін
    до знайденої причини лише заплутає. Якщо людина перевантажена чи не може почати — не ця картка.'
  basis: 'Eberle B., "SCAMPER: Games for Imagination Development", 1971; Osborn A. F., "Applied Imagination", 1953
    — обидва за Wikipedia, "SCAMPER" — https://en.wikipedia.org/wiki/SCAMPER (книг не відкривав).'
- id: scamper-facilitator
  audience: facilitator
  cards:
  - scamper
  title: Не анкета, а розмова від речі
  noticed: 'Найбільше допомагає, коли річ конкретна і мірило «краще» назване. Застрягають так: напрямки проходять
    як анкету з семи пунктів, і відповіді виходять формальні; людина одразу критикує кожну ідею («це вже пробували»);
    ідеї косметичні (колір, назва) замість змін; на «перевернути навпаки» кажуть «не розумію». Метод виходить із
    того, що оригінальне часто народжується з видозміни наявного.'
  do: 'Не йти по всіх літерах: обрати 2–3 напрямки, найближчі до мети людини, і питати через її річ: «що, якби клієнт
    робив цей крок сам? що, якби прибрати найдорожчу частину? звідки — з іншої галузі — можна позичити?». Критику
    відкласти: «запишемо, оцінимо в кінці». Для перевертання: «що, якби порядок був зворотний? якби платив не той,
    хто платить зараз?». Наприкінці — повернутися до мірила «краще» і дати людині вибрати 1–2 ідеї й перший крок.'
  basis: 'Wikipedia, "SCAMPER" — https://en.wikipedia.org/wiki/SCAMPER ; iSixSigma, "SCAMPER" — https://www.isixsigma.com/dictionary/scamper/
    (сторінку не відкривав, лише видача). Строгих досліджень ефекту немає (як у картці). Метод — Eberle B., «SCAMPER:
    Games for Imagination Development», 1971 (книгу не відкривав).'
