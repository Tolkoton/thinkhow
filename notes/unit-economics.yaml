- id: unit-economics-router
  audience: router
  cards:
  - unit-economics
  title: Чи сходяться числа на одного клієнта
  noticed: 'Типові ситуації: власниця салону хоче заробляти певну суму на місяць і не розуміє, чи модель узагалі
    це дасть; онлайн-школа платить за рекламу і підозрює, що кожен учень коштує більше, ніж приносить; перед орендою,
    наймом чи кредитом треба знати, з якого обсягу бізнес виходить у нуль; людина називає ціну, оренду, відсоток
    майстрам і просить «скласти це».'
  do: 'Плутають з value-pricing: якщо людина ще не знає, скільки брати, — спершу value-pricing, потім арифметика.
    Плутають з weighted-matrix: якщо гроші — лише один із критеріїв серед інших цінностей (наприклад, вибір роботи)
    — weighted-matrix. Якщо питання — чи взагалі хтось купить — demand-test. Особисті фінанси без бізнесу — не ця
    картка.'
  basis: Skok D., "SaaS Metrics 2.0", For Entrepreneurs — https://www.forentrepreneurs.com/saas-metrics-2/ . Метод
    — арифметика (як у картці); ситуації — узагальнення. Стаття Skok — 2013 (дата за назвою серії «SaaS Metrics
    2.0», сторінку відкрито 2026-10-27).
- id: unit-economics-facilitator
  audience: facilitator
  cards:
  - unit-economics
  title: Оптимістичні числа і забуті години
  noticed: 'Найбільше допомагає, коли є бодай приблизні ціна, витрати і ціль. Застрягають так: на «скільки місяців
    клієнт лишається?» чи «скільки коштує залучити одного?» людина каже «не знаю»; бере найкращі числа («кожен залишиться
    на рік»); забуває власні години як витрату; не враховує тих, хто йде. Skok називає орієнтирами LTV:CAC понад
    3 і окупність залучення до 12 місяців, але сам наголошує, що це орієнтири, а не правила, і радить спершу лагодити
    відтік, бо інакше це «діряве відро».'
  do: 'Якщо «не знаю» — розкласти на множники, які людина знає: «скільки людей бачили рекламу минулого місяця? скільки
    з них прийшли? скільки ви витратили?» — і позначити кожне число як знане чи здогадку. Для оптимізму — порахувати
    також песимістичний варіант. Для годин: «скільки годин ви самі витрачаєте на одного клієнта і скільки варта
    ваша година?». Рахує ведучий, числа — лише людини; висновок, чи сходиться, — її.'
  basis: Skok D., "SaaS Metrics 2.0" — https://www.forentrepreneurs.com/saas-metrics-2/ (LTV:CAC > 3, CAC payback
    < 12 міс., відтік; орієнтири для SaaS — для малих послуг їх не переносити механічно). Стаття Skok — 2013 (дата
    за назвою серії «SaaS Metrics 2.0», сторінку відкрито 2026-10-27).
