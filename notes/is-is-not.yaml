- id: is-is-not-router
  audience: router
  cards:
  - is-is-not
  title: Збій з невідомим механізмом
  noticed: 'Типові ситуації: застосунок падає лише в частини користувачів чи лише ввечері; в одному філіалі продажі
    впали, а в інших ні; верстат дає брак лише на одній зміні; з вівторка щось «зламалося», але ніхто не розуміє
    що. Ознака — на перше ж «чому?» людина каже «не знаю», зате може сказати, де все працює нормально.'
  do: 'Головна плутанина — з five-whys: якщо людина знає процес і пояснює, що до чого призвело, — five-whys; якщо
    механізм невідомий, але є спостереження «є/не є», — is-is-not. Якщо спостережень немає взагалі, лише здогадки
    — порівнювати нічого, це ще не is-is-not. Якщо проблема широка і розмита («у компанії все погано») — issue-tree.
    Якщо людина хоче осмислити власну болісну невдачу — reflective-cycle.'
  basis: 'Kepner C. H., Tregoe B. B., "The Rational Manager", 1965 (книгу не відкривав); опис методу: AHRQ, "Kepner-Tregoe
    Matrix" (Is-Is Not Matrix) — https://digital.ahrq.gov/health-it-tools-and-resources/evaluation-resources/workflow-assessment-health-it-toolkit/all-workflow-tools/kepner-tregoe-matrix
    .'
- id: is-is-not-facilitator
  audience: facilitator
  cards:
  - is-is-not
  title: Стовпець «не є» — найважчий
  noticed: 'Найбільше допомагає, коли людина не знає механізму, але має спостереження. Застрягають так: таблиця
    заповнюється самими «є», а на «де могло б бути, але немає?» людина каже «ніде більше не дивились»; людина з
    порогу має улюблену версію і підганяє під неї таблицю; у клітинках — здогадки, а не те, що бачили. AHRQ описує
    правило методу: найімовірніша причина має пояснювати всі факти таблиці, а перевіряти її варто експериментом;
    і застерігає, що метод забирає час.'
  do: 'Для «не є» питати про найближче порівняне: «а на iOS? а вдень? а в сусідньому філіалі? з якого дня почалося
    і що було до того?». Якщо «не знаю» — це вже питання для перевірки, записати його окремо, а не вигадувати. Улюблену
    версію не відкидати, а відкласти: «перевіримо її проти таблиці в кінці». Для кожної версії: «чи пояснює вона,
    чому тут є, а там немає?». Найменшу перевірку в реальному світі обирає людина.'
  basis: AHRQ, "Kepner-Tregoe Matrix" — https://digital.ahrq.gov/health-it-tools-and-resources/evaluation-resources/workflow-assessment-health-it-toolkit/all-workflow-tools/kepner-tregoe-matrix
    . Усталена практика без строгих досліджень дієвості (як у картці). Метод — Kepner C. H., Tregoe B. B., «The
    Rational Manager», 1965 (книгу не відкривав).
