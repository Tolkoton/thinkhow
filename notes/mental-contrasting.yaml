- id: mental-contrasting-router
  audience: router
  cards:
  - mental-contrasting
  title: Знаю, що робити, але не роблю
  noticed: 'Типові ситуації: людина вкотре відкладає спорт, навчання чи важливу розмову; хоче податися на нову роботу
    і боїться («головою розумію, а рука не піднімається»); рішення вже прийняте, але щоразу кидає на півдорозі;
    після осмислення досвіду хоче закріпити нове правило в поведінці.'
  do: 'Головна плутанина — з goal-to-plan: якщо шляхів і кроків ще немає — goal-to-plan; якщо кроки відомі, а заважає
    власна звичка, страх, втома — mental-contrasting. Якщо головна перешкода зовнішня (рішення начальника, гроші,
    правила) — не ця картка. Якщо людина ще вибирає між варіантами — weighted-matrix або reversible-doors. Від socratic-questioning
    відрізняє стан: якщо переконання вже перевірене і людина просто не починає — mental-contrasting; якщо гальмує
    саме необґрунтоване переконання — socratic-questioning.'
  basis: 'Oettingen G., WOOP — https://woopmylife.org/ ; Wang G., Wang Y., Gai X., "A Meta-Analysis of the Effects
    of Mental Contrasting With Implementation Intentions on Goal Attainment", Frontiers in Psychology, 2021 — https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8149892/
    . Знайдено лише пошуком, сторінок не відкривав: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8149892/.'
- id: mental-contrasting-facilitator
  audience: facilitator
  cards:
  - mental-contrasting
  title: Внутрішня перешкода і точний план
  noticed: 'Найбільше допомагає саме з ведучим: за Wang і співавторами (2021) ефект у взаємодії з експериментатором
    вищий (g = 0,465), ніж при самостійному заповненні (g = 0,277); автори відзначають і можливу публікаційну упередженість.
    Застрягають так: перешкоду називають зовнішню («немає часу», «начальник»); план розмитий («постараюся»); бажання
    надто велике або нереальне; людина пропускає уявлення найкращого результату як «дурницю».'
  do: 'Для перешкоди: «що саме всередині вас стає між вами і цим — у ту мить, коли ви вже могли б почати? яка думка,
    почуття, звичка?». Якщо «немає часу» — «що ви робите в ту хвилину замість цього?». План перевіряти на конкретність:
    «якщо [коли саме, де, яка думка], тоді я [одна дія, яку можна побачити]». Якщо бажання нереальне — дати людині
    самій звузити його до досяжного в обраному горизонті. Бажання і план формулює людина.'
  basis: 'Wang, Wang, Gai, Frontiers in Psychology, 2021 — https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8149892/
    ; Oettingen G., WOOP — https://woopmylife.org/ (внутрішність перешкоди — за карткою і вторинним описом WOOP,
    на головній сторінці не вказано). Знайдено лише пошуком, сторінок не відкривав: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8149892/.'
