- id: first-principles-router
  audience: router
  cards:
  - first-principles
  title: «Так заведено» — а чи обов'язково?
  noticed: 'Типові ситуації: людина в галузі, де «завжди так роблять» (цінники, тривалість навчання, формат послуги),
    підозрює, що це не закон; звичне рішення занадто дороге чи повільне, і дрібні покращення вже не рятують; після
    знайденої причини збою треба переглянути засади процесу; хтось хоче почати справу «з чистого аркуша», а не копіювати
    конкурентів. Farnam Street називає головною пасткою міркування за аналогією — копіювання чужого дає лише поступові
    зміни.'
  do: 'Плутають зі scamper: scamper видозмінює наявну річ, не ставлячи під сумнів її основу; first-principles —
    коли під сумнівом сама основа. Плутають із socratic-questioning: якщо перевіряють переконання про себе чи людей
    («я не здатен») — socratic-questioning; якщо засади задачі чи рішення — first-principles. Якщо ситуація ще розмита
    — спершу issue-tree або complexity-sensemaking.'
  basis: 'Farnam Street, "First Principles: The Building Blocks of True Knowledge" — https://fs.blog/first-principles/
    . Походження від Арістотеля — за цим самим текстом і карткою; строгих досліджень дієвості методу не знайдено.
    Сторінку відкрито 2026-10-27 (дати публікації на ній немає).'
- id: first-principles-facilitator
  audience: facilitator
  cards:
  - first-principles
  title: Відсіяти звичку, не тонучи в розборі
  noticed: 'Допомагає, коли людина сама сумнівається в «так заведено». Застрягають так: «не знаю, це закон чи звичка»
    — бо не розрізняє правило природи, правову вимогу і галузеву норму; розбір іде без кінця, до «атомів»; людина
    зупиняється на поверхні й лише підправляє наявне. Farnam Street радить іти на рівень-два глибше, ніж більшість,
    а не обов''язково до самого дна, і нагадує, що першооснови залежать від контексту.'
  do: 'Для кожного складника питати: «звідки ви знаєте, що інакше не можна? це число, закон, фізика чи хтось так
    колись вирішив?» і «хто робить без цього?». Якщо «не знаю» — позначити пункт як «перевірити» і йти далі, не
    застрягати. Розбір обмежити тим, що впливає на мету людини. На збиранні наново — просити людину скласти один-два
    способи з лишень основ; ведучий не підказує «правильне» нове рішення.'
  basis: 'Farnam Street, "First Principles" — https://fs.blog/first-principles/ (пастки: аналогія, загальні переконання
    як закони, надто поверхово, першооснови як незмінні). Практика, не дослідження. Сторінку відкрито 2026-10-27
    (дати публікації на ній немає).'
