- id: jobs-to-be-done-router
  audience: router
  cards:
  - jobs-to-be-done
  title: Навіщо клієнт «наймає» продукт
  noticed: 'Типові ситуації: команда думає переліком фіч («що додати, щоб платили?»); демо хвалять, але лишаються
    у своїх таблицях; клієнта описано віком і посадою, а ситуації, в якій він шукає рішення, немає; треба сформулювати
    пропозицію для сайту і зрозуміти, з чим продукт насправді конкурує. Christensen із співавторами пишуть, що компанії
    знають про клієнтів дедалі більше, а інновації лишаються лотереєю.'
  do: 'Плутають з customer-interviews: якщо з клієнтами ще не говорили або почули лише ввічливість — спершу customer-interviews;
    якщо історії клієнтів уже є і треба зібрати ситуацію, мотиви та сили переходу — jobs-to-be-done. Плутають з
    opportunity-tree: потреби вже зрозумілі і треба обрати рішення чи впорядкувати фічі — opportunity-tree. Якщо
    питання «чим ми кращі і для кого» — positioning, хоча jobs-to-be-done часто стоїть перед ним. Особистий вибір
    роботи — не ця картка.'
  basis: Christensen C. M., Hall T., Dillon K., Duncan D. S., "Know Your Customers' 'Jobs to Be Done'", Harvard
    Business Review, 2016 — https://hbr.org/2016/09/know-your-customers-jobs-to-be-done ; Moesta B., Spiek C., "The
    Four Forces" — https://jobstobedone.org/the-four-forces/ .
- id: jobs-to-be-done-facilitator
  audience: facilitator
  cards:
  - jobs-to-be-done
  title: Від фічі до моменту «так більше не можна»
  noticed: 'Найбільше допомагає, коли є хоч кілька реальних історій покупки чи відмови. Застрягають так: потребу
    називають фічею («їм потрібен дашборд»); роботу клієнта вгадують з крісла, без жодної розмови; на «що клієнт
    робить зараз замість вас?» кажуть «нічого» або називають лише прямих конкурентів; про сили, що тримають у старому
    (тривога, звичка), забувають. Moesta і Spiek радять спершу знайти поштовх — момент, коли по-старому вже не можна.'
  do: 'Якщо звучить фіча — спитати «що клієнт зможе зробити, коли вона в нього буде? що він робить замість цього
    сьогодні?». Для поштовху: «згадайте конкретного клієнта: що сталося того дня, коли він почав шукати нове?».
    Для сил переходу: «що могло його налякати в переході? що тримає в нинішньому способі?». Якщо історій немає —
    чесно позначити речення «Коли …, я хочу …, щоб …» як гіпотезу і запропонувати customer-interviews. Формулу складає
    людина.'
  basis: Moesta B., Spiek C., "The Four Forces" — https://jobstobedone.org/the-four-forces/ ; Christensen et al.,
    HBR, 2016 — https://hbr.org/2016/09/know-your-customers-jobs-to-be-done (повний текст за paywall, перевірено
    опис статті).
