[project]
name = "thinkhow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.159.1",
    "google-cloud-speech>=2.41.0",
    "google-cloud-storage>=3.17.1",
    "google-genai>=2.32.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "playwright==1.64.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# gate-allow: adds the live_codes marker the voice-dictation contract names (85 paid calls kept out of every run)
markers = [
    "live: calls real Google services (Vertex AI); run with -m live",
    "live_codes: the 85 language codes against the real speech model; run with -m live_codes",
]
addopts = "-m 'not live and not live_codes'"

[tool.ruff]
line-length = 110
target-version = "py312"
# gate-allow: .engine holds spike and probe scripts, not working code (like sketches)
extend-exclude = ["sketches", ".claude", ".engine"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
# gate-allow: the project's first type-checker settings, written by slice skel-platform (contract Seam: strict for src); google.cloud ships no type stubs
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["thinkhow"]
exclude = ["^sketches/", "^\\.claude/"]

[[tool.mypy.overrides]]
module = ["google.cloud.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# gate-allow: PyYAML ships no py.typed, a stubs package is a new dependency (slice skel-knowledge Seam)
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.importlinter]
root_package = "thinkhow"

[[tool.importlinter.contracts]]
name = "M3 layers: no cycles, dependencies point down"
type = "layers"
layers = [
    "thinkhow.web",
    "thinkhow.learning",
    "thinkhow.workspace",
    "thinkhow.facilitation",
    "thinkhow.knowledge",
    "thinkhow.access",
    "thinkhow.platform",
]

[[tool.importlinter.contracts]]
name = "workspace gets knowledge and the model only as facilitate"
type = "forbidden"
source_modules = ["thinkhow.workspace"]
forbidden_modules = ["thinkhow.knowledge", "thinkhow.platform.llm"]

[[tool.importlinter.contracts]]
name = "facilitation stores nothing and knows no person"
type = "forbidden"
source_modules = ["thinkhow.facilitation"]
forbidden_modules = ["thinkhow.access", "thinkhow.platform.storage"]
# ADR-0003: only the M3 chain facilitation -> knowledge -> storage is exempt; any other path to storage fails
ignore_imports = [
    "thinkhow.knowledge.store -> thinkhow.platform.storage",
    "thinkhow.knowledge.versions -> thinkhow.platform.storage",
]

[[tool.importlinter.contracts]]
name = "knowledge knows no person"
type = "forbidden"
source_modules = ["thinkhow.knowledge"]
forbidden_modules = ["thinkhow.access"]

[[tool.importlinter.contracts]]
name = "learning needs no identity"
type = "forbidden"
source_modules = ["thinkhow.learning"]
forbidden_modules = ["thinkhow.platform.identity"]
# ADR-0003 (amendment 1): access.user names the Identity type only; the Job never verifies an identity
ignore_imports = ["thinkhow.access.user -> thinkhow.platform.identity"]

[[tool.importlinter.contracts]]
name = "facilitation types are plain values"
type = "forbidden"
source_modules = ["thinkhow.facilitation.types"]
forbidden_modules = ["thinkhow.knowledge", "thinkhow.platform"]

[[tool.importlinter.contracts]]
name = "access writes nothing"
type = "forbidden"
source_modules = ["thinkhow.access"]
forbidden_modules = ["thinkhow.platform.storage"]
