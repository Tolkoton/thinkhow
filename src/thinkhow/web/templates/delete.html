{% from "icons.html" import icon %}<details class="delete">
  <summary class="icon" aria-label="{{ ui.delete }}">{{ icon("trash") }}</summary>
  <form method="post" action="/topics/{{ t.ref.uid }}/{{ t.ref.topic_id }}/delete">
    <p>{{ ui.delete_confirm.format(title=t.title) }}</p>
    <button class="danger icon" type="submit" aria-label="{{ ui.delete_yes }}">{{ icon("trash") }}</button>
  </form>
</details>
