{% from "icons.html" import icon %}<details class="delete">
  <summary class="icon" aria-label="Видалити">{{ icon("trash") }}</summary>
  <form method="post" action="/topics/{{ t.ref.uid }}/{{ t.ref.topic_id }}/delete">
    <p>Видалити тему «{{ t.title }}» разом з усією розмовою? Відновити її не вийде.</p>
    <button class="danger icon" type="submit" aria-label="Так, видалити">{{ icon("trash") }}</button>
  </form>
</details>
