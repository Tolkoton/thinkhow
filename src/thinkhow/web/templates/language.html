{% extends "base.html" %}
{% from "icons.html" import icon %}
{% block title %}{{ ui.language }}{% endblock %}
{% block body %}
<h1>{{ ui.language }}</h1>
<p>{{ ui.language_prompt }}</p>
<form class="inline" method="post" action="/language">
  <select name="code" required>
{% if not current %}    <option value="">{{ ui.choose_language }}</option>
{% endif %}{% for lang in languages %}    <option value="{{ lang.code }}"{% if lang.code == current %} selected{% endif %}>{{ lang.name }}</option>
{% endfor %}  </select>
  <button class="primary icon" type="submit" aria-label="{{ ui.save }}">{{ icon("check") }}</button>
</form>
{% endblock %}
