# Starting notes to methods (experience memory): draft from desk research, 2026-10-27.
# Two notes per card (router, facilitator). Notes sit next to a card and never change it.
# Sources per card and what each supports: sources.md in this directory.

- id: complexity-sensemaking-router
  audience: router
  cards: [complexity-sensemaking]
  title: "Коли клубок різної природи"
  noticed: >-
    Типово приходять так: власник малого бізнесу водночас втрачає ключового працівника, має касовий
    розрив і незрозумілу реакцію клієнтів на нову ціну; керівник команди після реорганізації не знає,
    що з навалу робити першим; людина в особистій кризі, де поруч стоять термінова справа (щось
    «горить») і довгі питання без відповіді. Ознака — в одному повідомленні змішано речі, частину яких
    можна порахувати, а частину лише спробувати.
  do: >-
    Найчастіше плутають з issue-tree: якщо всі частини однієї природи і їх можна розібрати аналізом,
    але питання широке, — це issue-tree; якщо частини різні (щось рахується, щось лише пробується,
    щось горить), — complexity-sensemaking. Від five-whys і is-is-not відрізняє те, що тут немає однієї
    події-збою, причину якої шукають. Якщо варіанти вже є і треба вибрати — це weighted-matrix або
    wrap-decision, а не ця картка.
  basis: >-
    Snowden D. J., Boone M. E., "A Leader's Framework for Decision Making", Harvard Business Review,
    2007 — https://hbr.org/2007/11/a-leaders-framework-for-decision-making ; Kurtz C. F., Snowden D. J.,
    "The new dynamics of strategy: Sense-making in a complex and complicated world", IBM Systems
    Journal, 2003 — https://research.ibm.com/publications/the-new-dynamics-of-strategy-sense-making-in-a-complex-and-complicated-world .
    Типові ситуації — узагальнення з цих текстів і з самої картки.

- id: complexity-sensemaking-facilitator
  audience: facilitator
  cards: [complexity-sensemaking]
  title: "Де застрягають у визначенні природи"
  noticed: >-
    Найбільше допомагає на початку розмови, коли людина ще не обрала підхід. Застрягають так: людина
    каже «усе складно» про кожну частину і не розрізняє, де відповідь можна знайти аналізом чи в
    експерта, а де ніхто наперед не знає; або чекає, поки «все проаналізує», там, де реакцію людей
    можна дізнатися лише пробою; або класифікує частини й зупиняється, не дійшовши до першого кроку.
    Snowden і Boone застерігають саме від звички керівників застосовувати один стиль дій до всіх
    ситуацій.
  do: >-
    Щоб розрізнити природу частини, питати не «яка вона?», а «чи є хтось, хто вже знає відповідь або
    міг би її порахувати?» і «якби ви спробували маленький крок, чи дізналися б більше, ніж з будь-якого
    аналізу?». Якщо людина вагається між двома типами — хай назве найменшу безпечну пробу і що вона
    покаже. Для «пожежі» — одне питання: що зупинить шкоду сьогодні. Наприкінці кожної частини —
    перший крок словами людини; ведучий не призначає частинам типи сам, а лише питає.
  basis: >-
    Snowden D. J., Boone M. E., "A Leader's Framework for Decision Making", HBR, 2007 —
    https://hbr.org/2007/11/a-leaders-framework-for-decision-making (сторінку відкрито, повний текст за
    paywall; зміст рекомендацій — за картою картки і вторинним описом https://en.wikipedia.org/wiki/Cynefin ).
    Формулювання питань — практика, не дослідження.

- id: consider-opposite-router
  audience: router
  cards: [consider-opposite]
  title: "Тверде судження про світ чи іншу людину"
  noticed: >-
    Типові ситуації: менеджер упевнений, що «клієнти йдуть через ціну», і шукає підтвердження;
    людина перед перемовинами чи в конфлікті вважає позицію іншої сторони безглуздою; засновник
    просить «просто підтвердити», що план правильний; після розбору досвіду людина різко перейшла до
    протилежного висновку. Спільне — вже є висновок, і людина наводить лише факти на його користь.
  do: >-
    Найчастіше плутають з socratic-questioning: якщо переконання про саму людину («я ні на що не
    здатний», «мене не візьмуть») — це socratic-questioning; якщо висновок про зовнішню ситуацію,
    ринок чи позицію опонента — consider-opposite. Від pre-mortem відрізняє предмет: pre-mortem
    розтинає план, який ще не почався, а consider-opposite перевіряє судження. Від evaporating-cloud —
    те, що людина хоче зрозуміти чужу позицію, а не розв'язати власну дилему двох потреб.
  basis: >-
    Lord C. G., Lepper M. R., Preston E., "Considering the opposite: A corrective strategy for social
    judgment", Journal of Personality and Social Psychology, 1984 — https://causeweb.org/cause/node/7638 ;
    Larrick R. P., "Debiasing", Blackwell Handbook of Judgment and Decision Making, 2004 —
    https://scholars.duke.edu/publication/1056892 .

- id: consider-opposite-facilitator
  audience: facilitator
  cards: [consider-opposite]
  title: "Протилежне без опудала і без маятника"
  noticed: >-
    Допомагає найбільше, коли людина дуже впевнена і просить підтвердження. Застрягають так: будують
    слабку «протилежну» версію, яку легко відкинути; на питання про найсильніший аргумент іншої сторони
    кажуть «не знаю, вони просто не розуміють»; або, навпаки, після вправи кидаються в протилежний
    висновок. Schwarz із колегами, посилаючись на Larrick (2004), описують і зворотний ефект: коли
    людині важко придумати багато контраргументів, вона може ще більше переконатися у своєму.
  do: >-
    Просити не «багато» контраргументів, а один-два найсильніші: «як би це пояснила розумна людина,
    яка з вами не згодна, — так, щоб вона підписалася під вашим викладом?». Якщо «не знаю» — запитати,
    що бачить та сторона, чого не бачить людина, або що мало б статися, щоб людина сама змінила думку.
    У суперечці — спершу перекази позиції опонента, потім факти, що розрізняють версії. Ведучий не
    оголошує, яка версія правильна: людина сама переглядає свою певність.
  basis: >-
    Lord, Lepper, Preston, 1984 — https://causeweb.org/cause/node/7638 ; Larrick R. P., "Debiasing",
    2004 — https://stafforini.com/works/larrick-2004-debiasing/ ; Schwarz N. та ін., огляд про
    виправлення хибних уявлень (у ньому посилання на Larrick 2004, с. 323, про зворотний ефект) —
    https://dornsife.usc.edu/norbert-schwarz/wp-content/uploads/sites/231/2023/11/07_aep_schwarz_et_al_setting-people-straight.pdf
    (точну назву статті не перевірено; файл названо «setting people straight»).

- id: customer-interviews-router
  audience: router
  cards: [customer-interviews]
  title: "Як говорити з клієнтами, щоб почути правду"
  noticed: >-
    Типові ситуації: людина з ідеєю (курс, застосунок, послуга) збирається «спитати знайомих, чи купили
    б»; засновник провів десяток розмов, усі хвалили, а не купив ніхто; хтось планує анкету чи опитування
    як перевірку ідеї; фахівець переходить у власну справу і ще жодного разу не говорив з майбутніми
    клієнтами про їхні клопоти. Фіцпатрік пише книгу саме з того, що розмови з клієнтами в його першій
    компанії давали мало користі.
  do: >-
    Найчастіше плутають з jobs-to-be-done: якщо розмов ще не було або вони дали лише ввічливість —
    customer-interviews; якщо розмови є і з них треба скласти ситуацію, мотиви й сили переходу —
    jobs-to-be-done. Від demand-test відрізняє інструмент: тут розмова, а demand-test — дія з ціною
    (передпродаж, кнопка оплати). Якщо клієнти вже платять і питання, де взяти більше, — це
    traction-channels.
  basis: >-
    Fitzpatrick R., "The Mom Test", 2013 — https://www.momtestbook.com/ ; огляд правил книги:
    Brikman Y., "'The Mom Test' by Rob Fitzpatrick", 2023 — https://www.ybrikman.com/blog/2023/03/29/the-mom-test/ .

- id: customer-interviews-facilitator
  audience: facilitator
  cards: [customer-interviews]
  title: "Питання про минуле замість «купили б?»"
  noticed: >-
    Найкорисніше перед першими зустрічами або після розмов, що закінчилися похвалою без покупки.
    Застрягають так: людина пише питання на кшталт «чи користувалися б ви…», «скільки б заплатили»;
    вважає успіхом компліменти; не може назвати, яке зобов'язання клієнта (час, репутація, гроші)
    покаже справжній інтерес; починає зустріч з презентації ідеї. Фіцпатрік називає три типи поганих
    даних: компліменти, «пух» (узагальнення, обіцянки, гіпотетичне) та ідеї й побажання фіч.
  do: >-
    Якщо людина пропонує питання про майбутнє — попросити переписати його так, щоб воно було про
    останній конкретний випадок: «коли це сталося востаннє? що ви тоді зробили? що вже пробували?».
    Якщо «не знаю, що вважати успіхом» — спитати, що клієнт міг би віддати наприкінці зустрічі: ще одну
    зустріч, знайомство, передоплату. При розборі вже проведених розмов — пройти по нотатках і разом
    позначити, де факт про минуле, а де похвала. Висновок про задум робить людина.
  basis: >-
    Fitzpatrick R., "The Mom Test", 2013 — https://www.momtestbook.com/ ; Brikman Y., огляд книги,
    2023 — https://www.ybrikman.com/blog/2023/03/29/the-mom-test/ ; Schmidt J., Bijmolt T. H. A.,
    meta-analysis of hypothetical bias, Journal of the Academy of Marketing Science, 2020 —
    https://cris-portal.uni-muenster.de/portal/en/publication/60727941 .

- id: demand-test-router
  audience: router
  cards: [demand-test]
  title: "Чи заплатять, поки не збудовано"
  noticed: >-
    Типові ситуації: людина збирається кілька місяців писати онлайн-курс чи застосунок і хоче знати, чи
    його куплять; майстер думає орендувати приміщення під нову послугу; друзі й опитування кажуть «супер»,
    але жодної оплати ще не було; команда хоче наперед вирішити, скільки відгуків означає «продовжуємо».
  do: >-
    Плутають з customer-interviews: якщо людина ще нічого не знає про клопоти клієнтів — спершу розмови
    (customer-interviews); якщо задум сформульовано і треба перевірити, чи віддадуть щось за нього, —
    demand-test. Від opportunity-tree відрізняє стан продукту: у opportunity-tree продукт уже працює, є
    метрика і кілька рішень, а тут продукту ще немає. Якщо люди вже купують і питання — де взяти ще, це
    traction-channels. Якщо незрозуміло саме, що в пропозиції, — спершу offer-design.
  basis: >-
    Savoia A., "The Right It", 2019; виступ "Build the Right It", Stanford eCorner, 2019 —
    https://stvp.stanford.edu/av/build-right-it-entire-talk ; Camuffo A., Cordova A., Gambardella A.,
    Spina C., RCT наукового підходу в підприємництві, Management Science, 2020 — опис:
    https://www.innovationgrowthlab.org/blog/confused-or-unimaginative-how-adoption-scientific-approach-improves-entrepreneurial .

- id: demand-test-facilitator
  audience: facilitator
  cards: [demand-test]
  title: "Числа в гіпотезі і поріг до запуску"
  noticed: >-
    Найбільше допомагає перед великими вкладеннями часу чи грошей. Застрягають так: на «щонайменше X % з
    Y зроблять Z» людина не може назвати X («не знаю, скільки — це нормально»); пропонує опитування чи
    лайки як тест; «тест» розростається до справжнього продукту на місяці; поріг рішення не названо
    наперед, і після тесту будь-який результат здається «обнадійливим». Savoia наголошує: шукати дані,
    а не думки; рахувати те, що люди віддають, а не кажуть.
  do: >-
    Якщо X не названо — спитати, за якої частки людина сама б зупинилася, і за якої точно продовжила б;
    середина між ними і є робочим порогом. Якщо пропонує опитування — спитати, що людина в тесті віддасть:
    гроші, передоплату, контакт, час. Якщо тест довший за кілька днів — спитати, яку частину можна
    зробити вручну замість продукту. Поріг записати до запуску словами людини; рішення після тесту теж
    її.
  basis: >-
    Savoia A., "The Right It", 2019; Stanford eCorner, 2019 — https://stvp.stanford.edu/av/build-right-it-entire-talk ;
    The Product Compass, стаття про Savoia (skin in the game; формула XYZ — у вторинному описі) —
    https://www.productcompass.pm/p/how-to-build-the-right-product-with ; Camuffo et al., реплікація
    на 759 фірмах, Strategic Management Journal, 2024 —
    https://repositorio.ie.edu/entities/publication/6aae4961-2c1d-45ed-97eb-e8bee19a2471 .

- id: evaporating-cloud-router
  audience: router
  cards: [evaporating-cloud]
  title: "Дилема двох справжніх потреб"
  noticed: >-
    Типові ситуації: власник мусить скоротити витрати і водночас не може втратити людей; батьки хочуть
    дати дитині свободу і водночас захистити її; два відділи вимагають протилежного (швидше випускати —
    ретельніше перевіряти), і обидва мають рацію щодо своєї потреби; людина розривається між кар'єрним
    кроком і обіцянкою родині. Ознака — «що б я не обрав, щось втрачу» і відмова від поділу навпіл.
  do: >-
    Плутають з weighted-matrix: якщо варіанти не виключають одне одного за суттю і їх можна зважити —
    weighted-matrix; якщо кожна дія захищає справжню потребу і вибір будь-якої щось руйнує — evaporating-cloud.
    Від wrap-decision відрізняє наявність двох протилежних потреб: у wrap-decision рамка «так чи ні» щодо
    однієї дії, яку треба розширити. Якщо людина хоче зрозуміти позицію опонента, а не розв'язати власну
    дилему, — consider-opposite.
  basis: >-
    Goldratt E. M., "It's Not Luck", 1994 (книгу не відкривав). Опис методу: Untools, "Conflict
    resolution diagram" (за Dettmer, "The Logical Thinking Process") — https://www.untools.co/conflict-resolution-diagram ;
    Wikipedia, "Evaporating cloud" — https://en.wikipedia.org/wiki/Evaporating_cloud .

- id: evaporating-cloud-facilitator
  audience: facilitator
  cards: [evaporating-cloud]
  title: "Від позицій до потреб і припущень"
  noticed: >-
    Допомагає, коли людина вже перепробувала компроміси і жоден не влаштовує. Застрягають так: називають
    позиції («звільнити двох») замість потреб («втримати бюджет»); одну сторону дилеми описують
    карикатурно, бо вона чужа; не можуть назвати спільну мету обох потреб; на питання про припущення
    кажуть «так просто треба». Untools називає спільну мету найважливішою частиною діаграми.
  do: >-
    Якщо людина говорить позиціями — спитати про кожну: «що саме ця дія вам дає? навіщо вона?». Спільну
    мету шукати питанням «заради чого вам обидві ці потреби?». Для припущень — «чому, щоб мати [потребу],
    треба саме [дію]? що мало б бути правдою?» і «чи бувало, що [потребу] задовольняли інакше?». Коли
    людина знаходить припущення, яке не тримається, — хай сама шукає дію, що обходить його; ведучий не
    пропонує готового рішення і не підштовхує до середини.
  basis: >-
    Untools, "Conflict resolution diagram" — https://www.untools.co/conflict-resolution-diagram ;
    Wikipedia, "Evaporating cloud" — https://en.wikipedia.org/wiki/Evaporating_cloud . Методу бракує
    строгих досліджень (як і зазначено в картці); оригінальну книгу Goldratt не перевірено.

- id: first-principles-router
  audience: router
  cards: [first-principles]
  title: "«Так заведено» — а чи обов'язково?"
  noticed: >-
    Типові ситуації: людина в галузі, де «завжди так роблять» (цінники, тривалість навчання, формат
    послуги), підозрює, що це не закон; звичне рішення занадто дороге чи повільне, і дрібні покращення
    вже не рятують; після знайденої причини збою треба переглянути засади процесу; хтось хоче почати
    справу «з чистого аркуша», а не копіювати конкурентів. Farnam Street називає головною пасткою
    міркування за аналогією — копіювання чужого дає лише поступові зміни.
  do: >-
    Плутають зі scamper: scamper видозмінює наявну річ, не ставлячи під сумнів її основу; first-principles —
    коли під сумнівом сама основа. Плутають із socratic-questioning: якщо перевіряють переконання про себе
    чи людей («я не здатен») — socratic-questioning; якщо засади задачі чи рішення — first-principles.
    Якщо ситуація ще розмита — спершу issue-tree або complexity-sensemaking.
  basis: >-
    Farnam Street, "First Principles: The Building Blocks of True Knowledge" —
    https://fs.blog/first-principles/ . Походження від Арістотеля — за цим самим текстом і карткою;
    строгих досліджень дієвості методу не знайдено.

- id: first-principles-facilitator
  audience: facilitator
  cards: [first-principles]
  title: "Відсіяти звичку, не тонучи в розборі"
  noticed: >-
    Допомагає, коли людина сама сумнівається в «так заведено». Застрягають так: «не знаю, це закон чи
    звичка» — бо не розрізняє правило природи, правову вимогу і галузеву норму; розбір іде без кінця, до
    «атомів»; людина зупиняється на поверхні й лише підправляє наявне. Farnam Street радить іти на рівень-два
    глибше, ніж більшість, а не обов'язково до самого дна, і нагадує, що першооснови залежать від
    контексту.
  do: >-
    Для кожного складника питати: «звідки ви знаєте, що інакше не можна? це число, закон, фізика чи хтось
    так колись вирішив?» і «хто робить без цього?». Якщо «не знаю» — позначити пункт як «перевірити» і
    йти далі, не застрягати. Розбір обмежити тим, що впливає на мету людини. На збиранні наново —
    просити людину скласти один-два способи з лишень основ; ведучий не підказує «правильне» нове
    рішення.
  basis: >-
    Farnam Street, "First Principles" — https://fs.blog/first-principles/ (пастки: аналогія, загальні
    переконання як закони, надто поверхово, першооснови як незмінні). Практика, не дослідження.

- id: five-whys-router
  audience: router
  cards: [five-whys]
  title: "Конкретний збій у знайомому процесі"
  noticed: >-
    Типові ситуації: команда втретє зриває реліз; бухгалтер щомісяця запізнюється зі звітом; клієнт пішов
    після пілоту, і менеджер знає, як ішов процес; людина регулярно запізнюється на роботу через ранковий
    розпорядок. Спільне — одна названа подія з наслідком, і людина знає процес зсередини.
  do: >-
    Найчастіше плутають з is-is-not: якщо людина пояснює, що до чого призвело, — five-whys; якщо механізм
    невідомий, але видно, де проблема є, а де ні («лише на Android ввечері»), — is-is-not. Якщо питання
    широке («чому конкуренти ростуть») — issue-tree. Якщо в історії гнів на когось чи гостра провина —
    reflective-cycle, бо «чому» звучатиме як допит. Якщо людина відкладає і не може почати —
    mental-contrasting.
  basis: >-
    Ohno T., "Toyota Production System", 1988 (книгу не відкривав; опис — Wikipedia, "Five whys" —
    https://en.wikipedia.org/wiki/Five_whys ); Card A. J., "The problem with '5 whys'", BMJ Quality &
    Safety, 2017 — https://psnet.ahrq.gov/issue/problem-5-whys .

- id: five-whys-facilitator
  audience: facilitator
  cards: [five-whys]
  title: "Розгалуження і зупинка не на людині"
  noticed: >-
    Допомагає при повторюваних збоях у процесі, який людина знає. Застрягають так: ланцюжок закінчується
    на людині («бо Іван не перевірив»), а зміна — на заклику «бути уважнішим»; людина йде однією лінією,
    хоча причин кілька; відповіді — здогадки з крісла, не перевірені фактом. Card (2017) і Peerally зі
    співавторами (2017) критикують саме фокус на одній причині і слабку якість аналізу; голе «чому?»
    людина сприймає як допит.
  do: >-
    Замість «чому?» — питання про обставини з її ж словами: «що в процесі дозволило, щоб [подія]?», «що
    мало б бути інакше, щоб це не сталося?». Коли відповідь — людина, спитати: «що зробило помилку можливою
    для будь-кого на цьому місці?». Коли причин дві — записати обидві гілки. Біля кожної ланки спитати:
    «це ви бачили чи припускаєте?». Наприкінці — перевірка знизу вгору: «якщо змінити це, чи зник би
    збій?». Зміну формулює людина.
  basis: >-
    Card A. J., BMJ Quality & Safety, 2017 — https://psnet.ahrq.gov/issue/problem-5-whys ; Peerally M. F.,
    Carr S., Waring J., Dixon-Woods M., "The problem with root cause analysis", BMJ Quality & Safety,
    2017 — https://psnet.ahrq.gov/issue/problem-root-cause-analysis .

- id: goal-to-plan-router
  audience: router
  cards: [goal-to-plan]
  title: "Мета є, шляху немає"
  noticed: >-
    Типові ситуації: людина хоче змінити професію за рік і не знає, з чого почати; фрилансер хоче вийти на
    певний дохід, але кроків не бачить; студент має велику мету (вступ, переїзд) на кілька років і не може
    пов'язати її з цим тижнем; після розбору ситуації обрано напрям, і його треба перетворити на перші
    кроки.
  do: >-
    Плутають з mental-contrasting: якщо людина не знає, як дійти, — goal-to-plan; якщо знає і навіть має
    план, але відкладає чи кидає — mental-contrasting. Плутають з pre-mortem: план уже є і його перевіряють
    на провал — pre-mortem; плану ще немає — goal-to-plan. Якщо мета — продуктова метрика, яку рухають через
    потреби клієнтів, — opportunity-tree. Якщо мету ще не обрано і людина вагається між варіантами —
    weighted-matrix або wrap-decision.
  basis: >-
    Whitmore J., "Coaching for Performance" (GROW) — опис: Performance Consultants, "GROW Model" —
    https://www.performanceconsultants.com/grow-model ; Robinson J. B., "Energy backcasting: a proposed
    method of policy analysis", Energy Policy, 1982 — https://ideas.repec.org/r/eee/enepol/v10y1982i4p337-344.html .

- id: goal-to-plan-facilitator
  audience: facilitator
  cards: [goal-to-plan]
  title: "Мета-туман і список замість кроку"
  noticed: >-
    Найбільше допомагає, коли мета названа, а кроків немає. Застрягають так: мета розмита («бути
    щасливішим», «розвиватися»), і на питання «як ви зрозумієте, що досягли?» людина каже «не знаю»; у
    «де я зараз» перелічує лише перешкоди, забуваючи ресурси; на шляхах бере перший-ліпший або чужий
    («так зробив знайомий»); замість одного кроку з датою виходить список із десяти. Performance Consultants
    наводять застереження Вітмора: «будь-який диктатор може використати GROW» — модель без коучингових
    навичок перетворюється на вказівки.
  do: >-
    Для мети: «що буде інакше в той день, коли мету досягнуто? що ви побачите чи зробите?». Якщо мета
    далека — запропонувати напрям назад: описати стан досягнутої мети і спитати, що мало бути за рік, за
    пів року до нього. Для реальності: «що вже є і що вже пробували?». Для шляхів — не менше трьох різних,
    перш ніж вибирати. Наприкінці: «що одне ви зробите і коли? наскільки від 1 до 10 ви готові це
    зробити?». Шлях обирає людина.
  basis: >-
    Performance Consultants, "GROW Model" — https://www.performanceconsultants.com/grow-model ;
    Theeboom T., Beersma B., van Vianen A. E. M., "Does coaching work? A meta-analysis…", Journal of
    Positive Psychology, 2014 — https://research.vu.nl/en/publications/does-coaching-work-a-meta-analysis-on-the-effects-of-coaching-on- ;
    Wikipedia, "Backcasting" — https://en.wikipedia.org/wiki/Backcasting .

- id: is-is-not-router
  audience: router
  cards: [is-is-not]
  title: "Збій з невідомим механізмом"
  noticed: >-
    Типові ситуації: застосунок падає лише в частини користувачів чи лише ввечері; в одному філіалі
    продажі впали, а в інших ні; верстат дає брак лише на одній зміні; з вівторка щось «зламалося», але
    ніхто не розуміє що. Ознака — на перше ж «чому?» людина каже «не знаю», зате може сказати, де все
    працює нормально.
  do: >-
    Головна плутанина — з five-whys: якщо людина знає процес і пояснює, що до чого призвело, — five-whys;
    якщо механізм невідомий, але є спостереження «є/не є», — is-is-not. Якщо спостережень немає взагалі,
    лише здогадки — порівнювати нічого, це ще не is-is-not. Якщо проблема широка і розмита («у компанії
    все погано») — issue-tree. Якщо людина хоче осмислити власну болісну невдачу — reflective-cycle.
  basis: >-
    Kepner C. H., Tregoe B. B., "The Rational Manager", 1965 (книгу не відкривав); опис методу: AHRQ,
    "Kepner-Tregoe Matrix" (Is-Is Not Matrix) — https://digital.ahrq.gov/health-it-tools-and-resources/evaluation-resources/workflow-assessment-health-it-toolkit/all-workflow-tools/kepner-tregoe-matrix .

- id: is-is-not-facilitator
  audience: facilitator
  cards: [is-is-not]
  title: "Стовпець «не є» — найважчий"
  noticed: >-
    Найбільше допомагає, коли людина не знає механізму, але має спостереження. Застрягають так: таблиця
    заповнюється самими «є», а на «де могло б бути, але немає?» людина каже «ніде більше не дивились»;
    людина з порогу має улюблену версію і підганяє під неї таблицю; у клітинках — здогадки, а не те, що
    бачили. AHRQ описує правило методу: найімовірніша причина має пояснювати всі факти таблиці, а
    перевіряти її варто експериментом; і застерігає, що метод забирає час.
  do: >-
    Для «не є» питати про найближче порівняне: «а на iOS? а вдень? а в сусідньому філіалі? з якого дня
    почалося і що було до того?». Якщо «не знаю» — це вже питання для перевірки, записати його окремо, а не
    вигадувати. Улюблену версію не відкидати, а відкласти: «перевіримо її проти таблиці в кінці». Для
    кожної версії: «чи пояснює вона, чому тут є, а там немає?». Найменшу перевірку в реальному світі обирає
    людина.
  basis: >-
    AHRQ, "Kepner-Tregoe Matrix" — https://digital.ahrq.gov/health-it-tools-and-resources/evaluation-resources/workflow-assessment-health-it-toolkit/all-workflow-tools/kepner-tregoe-matrix .
    Усталена практика без строгих досліджень дієвості (як у картці).

- id: issue-tree-router
  audience: router
  cards: [issue-tree]
  title: "Широке питання однієї природи"
  noticed: >-
    Типові ситуації: власник інтернет-магазину не розуміє, чому впав дохід; керівник хоче «вирости
    вдвічі» і не знає, з якого боку підійти; людина перелічує десяток можливих причин упереміш і просить
    «розкласти по поличках»; хтось просить план, але не знає, чому виникла проблема, а пояснень кілька
    різних.
  do: >-
    Плутають з complexity-sensemaking: якщо в ситуації змішано речі різної природи або щось «горить» —
    complexity-sensemaking; якщо все можна розібрати аналізом, просто питання широке, — issue-tree. Плутають
    з five-whys: одна конкретна подія в знайомому процесі — five-whys; широке питання про метрику чи
    результат — issue-tree. Якщо людина перевантажена і виснажена, велике дерево лише додасть ваги. Якщо
    варіанти вже є — weighted-matrix.
  basis: >-
    Minto B., "The Pyramid Principle", 1987 (книгу не відкривав); Wikipedia, "MECE principle" —
    https://en.wikipedia.org/wiki/MECE_principle ; огляд "The McKinsey Mind" (Rasiel, Friga) —
    https://manassaloi.com/booksummaries/2016/04/20/mcKinsey-mind-ethan-paul.html .

- id: issue-tree-facilitator
  audience: facilitator
  cards: [issue-tree]
  title: "Гілки, що не перетинаються, і важлива гілка"
  noticed: >-
    Допомагає, коли людина спокійна і готова кілька реплік розбирати. Застрягають так: перший поділ
    дає гілки, що перетинаються («маркетинг», «реклама», «клієнти»); дерево розростається заради повноти,
    а до перевірки не доходить; людина обирає зручну гілку, де їй комфортно, а не ту, що важить; корінь
    сформульовано так широко, що його не розкласти. У матеріалах про issue trees радять поєднувати MECE з
    правилом 80/20: не доводити кожну гілку до досконалості.
  do: >-
    Для першого поділу підказати форму, а не зміст: «дохід — це скільки людей купує і скільки кожен платить?
    чи інакше поділили б ви?» — і хай людина обере свій поділ. Перевірка гілок: «чи може щось потрапити в
    обидві?», «чи є щось, що не потрапило нікуди?». Для вибору гілки: «що з цього, якщо підтвердиться, змінить
    найбільше?». Листки перетворювати на питання, які можна перевірити даними чи розмовою. Де копати, вирішує
    людина.
  basis: >-
    Wikipedia, "MECE principle" (Minto, McKinsey) — https://en.wikipedia.org/wiki/MECE_principle ;
    McKinsey-атрибутований навчальний слайд про issue trees (MECE і 80/20; авторство не підтверджено) —
    https://www.slideshare.net/slideshow/425923230-mckinsey-problem-solviaaang-pptx/284804058 .

- id: jobs-to-be-done-router
  audience: router
  cards: [jobs-to-be-done]
  title: "Навіщо клієнт «наймає» продукт"
  noticed: >-
    Типові ситуації: команда думає переліком фіч («що додати, щоб платили?»); демо хвалять, але лишаються
    у своїх таблицях; клієнта описано віком і посадою, а ситуації, в якій він шукає рішення, немає; треба
    сформулювати пропозицію для сайту і зрозуміти, з чим продукт насправді конкурує. Christensen із
    співавторами пишуть, що компанії знають про клієнтів дедалі більше, а інновації лишаються лотереєю.
  do: >-
    Плутають з customer-interviews: якщо з клієнтами ще не говорили або почули лише ввічливість — спершу
    customer-interviews; якщо історії клієнтів уже є і треба зібрати ситуацію, мотиви та сили переходу —
    jobs-to-be-done. Плутають з opportunity-tree: потреби вже зрозумілі і треба обрати рішення чи
    впорядкувати фічі — opportunity-tree. Якщо питання «чим ми кращі і для кого» — positioning, хоча
    jobs-to-be-done часто стоїть перед ним. Особистий вибір роботи — не ця картка.
  basis: >-
    Christensen C. M., Hall T., Dillon K., Duncan D. S., "Know Your Customers' 'Jobs to Be Done'",
    Harvard Business Review, 2016 — https://hbr.org/2016/09/know-your-customers-jobs-to-be-done ;
    Moesta B., Spiek C., "The Four Forces" — https://jobstobedone.org/the-four-forces/ .

- id: jobs-to-be-done-facilitator
  audience: facilitator
  cards: [jobs-to-be-done]
  title: "Від фічі до моменту «так більше не можна»"
  noticed: >-
    Найбільше допомагає, коли є хоч кілька реальних історій покупки чи відмови. Застрягають так: потребу
    називають фічею («їм потрібен дашборд»); роботу клієнта вгадують з крісла, без жодної розмови; на «що
    клієнт робить зараз замість вас?» кажуть «нічого» або називають лише прямих конкурентів; про сили, що
    тримають у старому (тривога, звичка), забувають. Moesta і Spiek радять спершу знайти поштовх — момент,
    коли по-старому вже не можна.
  do: >-
    Якщо звучить фіча — спитати «що клієнт зможе зробити, коли вона в нього буде? що він робить замість
    цього сьогодні?». Для поштовху: «згадайте конкретного клієнта: що сталося того дня, коли він почав шукати
    нове?». Для сил переходу: «що могло його налякати в переході? що тримає в нинішньому способі?». Якщо
    історій немає — чесно позначити речення «Коли …, я хочу …, щоб …» як гіпотезу і запропонувати
    customer-interviews. Формулу складає людина.
  basis: >-
    Moesta B., Spiek C., "The Four Forces" — https://jobstobedone.org/the-four-forces/ ; Christensen et al.,
    HBR, 2016 — https://hbr.org/2016/09/know-your-customers-jobs-to-be-done (повний текст за paywall,
    перевірено опис статті).

- id: mental-contrasting-router
  audience: router
  cards: [mental-contrasting]
  title: "Знаю, що робити, але не роблю"
  noticed: >-
    Типові ситуації: людина вкотре відкладає спорт, навчання чи важливу розмову; хоче податися на нову
    роботу і боїться («головою розумію, а рука не піднімається»); рішення вже прийняте, але щоразу кидає на
    півдорозі; після осмислення досвіду хоче закріпити нове правило в поведінці.
  do: >-
    Головна плутанина — з goal-to-plan: якщо шляхів і кроків ще немає — goal-to-plan; якщо кроки відомі, а
    заважає власна звичка, страх, втома — mental-contrasting. Якщо головна перешкода зовнішня (рішення
    начальника, гроші, правила) — не ця картка. Якщо людина ще вибирає між варіантами — weighted-matrix
    або reversible-doors. Від socratic-questioning відрізняє стан: якщо переконання вже перевірене і людина
    просто не починає — mental-contrasting; якщо гальмує саме необґрунтоване переконання — socratic-questioning.
  basis: >-
    Oettingen G., WOOP — https://woopmylife.org/ ; Wang G., Wang Y., Gai X., "A Meta-Analysis of the
    Effects of Mental Contrasting With Implementation Intentions on Goal Attainment", Frontiers in
    Psychology, 2021 — https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8149892/ .

- id: mental-contrasting-facilitator
  audience: facilitator
  cards: [mental-contrasting]
  title: "Внутрішня перешкода і точний план"
  noticed: >-
    Найбільше допомагає саме з ведучим: за Wang і співавторами (2021) ефект у взаємодії з експериментатором
    вищий (g = 0,465), ніж при самостійному заповненні (g = 0,277); автори відзначають і можливу
    публікаційну упередженість. Застрягають так: перешкоду називають зовнішню («немає часу», «начальник»);
    план розмитий («постараюся»); бажання надто велике або нереальне; людина пропускає уявлення
    найкращого результату як «дурницю».
  do: >-
    Для перешкоди: «що саме всередині вас стає між вами і цим — у ту мить, коли ви вже могли б почати?
    яка думка, почуття, звичка?». Якщо «немає часу» — «що ви робите в ту хвилину замість цього?». План
    перевіряти на конкретність: «якщо [коли саме, де, яка думка], тоді я [одна дія, яку можна побачити]».
    Якщо бажання нереальне — дати людині самій звузити його до досяжного в обраному горизонті. Бажання і
    план формулює людина.
  basis: >-
    Wang, Wang, Gai, Frontiers in Psychology, 2021 — https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8149892/ ;
    Oettingen G., WOOP — https://woopmylife.org/ (внутрішність перешкоди — за карткою і вторинним описом
    WOOP, на головній сторінці не вказано).

- id: offer-design-router
  audience: router
  cards: [offer-design]
  title: "Пропозиція звучить як перелік робіт"
  noticed: >-
    Типові ситуації: репетитор продає «10 занять», а батьки не бачать, що дитина отримає; SMM-фахівець
    пропонує «ведення соцмереж» і чує «подумаю»; консультант складає пакет і не знає, що туди класти і
    яку гарантію дати; клієнти цікавляться, але не купують, і людина підозрює, що слабка пропозиція, а не
    ціна.
  do: >-
    Плутають з value-pricing: якщо зміст і результат пропозиції ясні, а питання лише в сумі — value-pricing;
    якщо незрозуміло, що клієнт отримає і чому повірить, — offer-design. Плутають з positioning: якщо людина
    не знає, для кого вона найкраща і з чим її порівнюють — спершу positioning. Якщо пропозиція готова і
    треба дізнатися, чи за неї платитимуть, — demand-test.
  basis: >-
    Hormozi A., "$100M Offers", 2021 — сторінка книги: https://www.acquisition.com/books (зміст рівняння
    цінності на ній не наведено; перевірено лише вторинні описи, напр. https://www.supersummary.com/100m-offers/section-3-summary/
    — не відкрилася, 429). Джерело тонке: практика продажів без досліджень.

- id: offer-design-facilitator
  audience: facilitator
  cards: [offer-design]
  title: "Результат клієнта, віра і зусилля"
  noticed: >-
    Найбільше допомагає, коли людина продає послугу чи пакет і чує «цікаво, але…». Застрягають так: на
    «який результат хоче клієнт?» людина знову описує, що робить сама; додає в пакет усе підряд, щоб
    здавався ціннішим; обіцяє результат, який не може гарантувати; не знає, чим підтвердити, що в клієнта
    вийде. Оскільки рівняння Хормозі — практика без досліджень, офер наприкінці лишається гіпотезою.
  do: >-
    Для результату: «що зміниться в житті клієнта через місяць після роботи з вами — його словами?» і «як
    він сам би це сказав подрузі?». Для віри: «що вже може показати, що в нього вийде, — випадки, відгуки,
    пробний крок?». Для часу і зусиль: «що клієнт відчує вже в перший тиждень? що з його роботи ви могли б
    узяти на себе?». Кожну обіцянку перевірити: «чи зможете ви виконати її для кожного?». Наприкінці —
    як перевірити офер на справжніх клієнтах (demand-test). Пропозицію складає людина.
  basis: >-
    Hormozi A., "$100M Offers", 2021 — https://www.acquisition.com/books ; вторинний опис рівняння цінності
    (dream outcome × perceived likelihood / time delay × effort and sacrifice) — Medium/Illumination,
    https://medium.com/illumination/alex-hormozis-value-equation-is-a-true-revelation-b887363cc6b6
    (сторінку не відкривав, лише видача пошуку). Джерела тонкі.

- id: opportunity-tree-router
  audience: router
  cards: [opportunity-tree]
  title: "Продуктова метрика або гора ідей"
  noticed: >-
    Типові ситуації: продакт-менеджер має завдання підняти утримання чи активацію і не знає, через що;
    команда хоче будувати фічу на квартал і спершу перевірити, чи вона спрацює; у беклозі двадцять ідей, і
    треба вирішити, з чого почати; згадано спринт, реліз, експерименти.
  do: >-
    Плутають з jobs-to-be-done: якщо ще незрозуміло, навіщо клієнти купують і з чим продукт конкурує, —
    спершу jobs-to-be-done; якщо потреби видно і треба обрати рішення та його ризикове припущення —
    opportunity-tree. Плутають з demand-test: продукту і метрики ще немає, питання одне — чи заплатять —
    demand-test. Якщо варіантів три-п'ять і їх порівнюють за власними цінностями людини, а не за впливом на
    клієнтів, — weighted-matrix. Одне велике незворотне рішення («брати інвестора?») — wrap-decision.
  basis: >-
    Torres T., "Opportunity Solution Tree", Product Talk — https://www.producttalk.org/glossary-discovery-opportunity-solution-tree/ ;
    Bland D. J., "How assumptions mapping can focus your teams…", Strategyzer, 2020 —
    https://www.strategyzer.com/library/how-assumptions-mapping-can-focus-your-teams-on-running-experiments-that-matter ;
    McBride S., "RICE", Intercom — https://www.intercom.com/blog/rice-simple-prioritization-for-product-managers/ .

- id: opportunity-tree-facilitator
  audience: facilitator
  cards: [opportunity-tree]
  title: "Можливість — це потреба, не рішення"
  noticed: >-
    Найбільше допомагає команді з метрикою і доступом до клієнтів. Застрягають так: на «який результат
    рухаємо?» називають фічу; «можливості» формулюють як рішення («потрібен онбординг»); болі клієнтів
    називають без жодної розмови з ними; закохуються в одне рішення; тест не може провалитися, бо поріг
    успіху не названо. Bland пише, що команди часто запускають лендинги чи інтерв'ю, ігноруючи найризиковіші
    припущення; McBride радить ставити впевненість 50 % і нижче, коли даних мало.
  do: >-
    Для результату: «яке число зміниться, якщо ми впораємося?». Якщо можливість звучить як рішення —
    «яку проблему клієнта це розв'яже? звідки ви знаєте, що вона є — з розмови чи з припущення?». Для
    рішень — не менше трьох на одну можливість. Для припущення: «що має бути правдою, щоб це спрацювало? на
    що з цього найменше доказів, і що станеться, якщо воно хибне?». Поріг тесту назвати наперед. При
    понад шести ідеях — коротка оцінка RICE, але числа ставить людина.
  basis: >-
    Torres T., Product Talk — https://www.producttalk.org/glossary-discovery-opportunity-solution-tree/ ;
    Bland D. J., Strategyzer, 2020 — https://www.strategyzer.com/library/how-assumptions-mapping-can-focus-your-teams-on-running-experiments-that-matter ;
    McBride S., Intercom — https://www.intercom.com/blog/rice-simple-prioritization-for-product-managers/ .

- id: positioning-router
  audience: router
  cards: [positioning]
  title: "«Чим ви відрізняєтеся?» — і тиша"
  noticed: >-
    Типові ситуації: SaaS-продукт показують усім підряд, і всі бачать «ще один такий самий»; фрилансер-дизайнер
    звучить, як усі в професії, і його порівнюють з дешевшими; невелику компанію порівнюють з великими
    гравцями, і вона програє; на сайті написано те саме, що в конкурентів.
  do: >-
    Плутають з offer-design: якщо людина чітко знає, кому продає і чим краща, але слабка сама пропозиція
    (результат, час, гарантія) — offer-design; якщо не знає, з чим її порівнюють і для кого вона найкраща, —
    positioning. Плутають з jobs-to-be-done: якщо незрозуміло, навіщо клієнти взагалі купують і що тримає в
    старому — спершу jobs-to-be-done. Якщо позиціонування є і питання в сумі — value-pricing. Особистий вибір
    роботи для себе — не ця картка.
  basis: >-
    Dunford A., "Obviously Awesome", 2019 — https://www.aprildunford.com/books ; Dunford A., "A quickstart
    guide to positioning" — https://www.aprildunford.com/post/a-quickstart-guide-to-positioning .

- id: positioning-facilitator
  audience: facilitator
  cards: [positioning]
  title: "Починати з альтернатив, а не з рис"
  noticed: >-
    Найбільше допомагає, коли є хоч кілька розмов з клієнтами. Застрягають так: на «з чим вас порівнюють?»
    називають конкурентів, яких клієнти ніколи не розглядали, і забувають про таблицю, «зробити самому» чи
    «нічого»; перелічують риси без цінності («у нас AI»); «найкращий клієнт — усі». Dunford радить
    починати саме з конкурентних альтернатив і застерігає від «фантомних конкурентів», яких клієнти не
    розглядають.
  do: >-
    Для альтернатив: «що робив ваш останній клієнт до вас? що він робив би, якби вас не було?». Для рис —
    до кожної «і що це дає клієнту?», поки не прозвучить користь. Для найкращого клієнта: «згадайте
    клієнта, якому ви допомогли найбільше і найшвидше — чим він відрізнявся від інших? як його помітити?».
    Якщо людина каже «усі» — спитати, хто з них купив найшвидше. Категорію і підсумкове речення людина
    обирає сама; ведучий не пише слоган.
  basis: >-
    Dunford A., "A quickstart guide to positioning" — https://www.aprildunford.com/post/a-quickstart-guide-to-positioning ;
    Dunford A., "Obviously Awesome", 2019 — https://www.aprildunford.com/books .

- id: pre-mortem-router
  audience: router
  cards: [pre-mortem]
  title: "План є, старт ще попереду"
  noticed: >-
    Типові ситуації: команда затвердила запуск продукту і має кілька тижнів до старту; людина вирішила
    переїхати чи змінити роботу і хоче перевірити план; підприємець підписує угоду з партнером; хтось
    готує подію чи ремонт зі строком. Спільне — план або обране рішення, яке ще не почалося, і строк.
  do: >-
    Плутають з goal-to-plan: якщо плану ще немає — goal-to-plan; якщо є і його перевіряють — pre-mortem.
    Плутають з five-whys і reflective-cycle: якщо провал уже стався насправді — це не «розтин» майбутнього,
    а пошук причини (five-whys) або осмислення досвіду (reflective-cycle). Плутають з wrap-decision: якщо
    рішення ще не ухвалене і варіанти не розширено — wrap-decision. Якщо людина тривожна й вагається щодо
    самої мети — не ця картка.
  basis: >-
    Klein G., "Performing a Project Premortem", Harvard Business Review, 2007 —
    https://hbr.org/2007/09/performing-a-project-premortem ; Mitchell D. J., Russo J. E., Pennington N.,
    "Back to the future: Temporal perspective in the explanation of events", Journal of Behavioral
    Decision Making, 1989 — https://colab.ws/articles/10.1002%2Fbdm.3960020103 .

- id: pre-mortem-facilitator
  audience: facilitator
  cards: [pre-mortem]
  title: "Провал як доконаний факт"
  noticed: >-
    Найбільше допомагає людям, упевненим у плані. Klein описує мету: зробити безпечним озвучення сумнівів
    тоді, коли вони ще корисні. Застрягають так: людина повертається до «що може піти не так?» і дає
    загальні ризики; називає лише зовнішню екзотику («метеорит», криза); уникає незручних внутрішніх причин
    — власної самовпевненості, людського чинника; після розтину впадає в параліч і хоче все скасувати. У
    дослідженні Mitchell та ін. (1989) на пояснення найбільше впливала певність результату, тому важливо,
    щоб провал звучав як факт.
  do: >-
    Ставити в точку після провалу в минулому часі: «минув рік. План провалився. Що сталося?». Якщо причини
    зовнішні — «а що в цьому провалі залежало від вас чи команди?», «яке припущення виявилося хибним?».
    Для відбору — «де і ймовірність, і шкода високі?», лишити 1–2. Якщо параліч — нагадати, що мета —
    щеплення плану, і спитати, яку одну зміну людина внесе і за яким раннім сигналом зрозуміє, що загроза
    збувається.
  basis: >-
    Klein G., HBR, 2007 — https://hbr.org/2007/09/performing-a-project-premortem ; Mitchell, Russo,
    Pennington, 1989 — https://colab.ws/articles/10.1002%2Fbdm.3960020103 (анотація: ефект дає певність
    результату, а не сам час; цифра «на 30 % більше причин» — за Klein і вторинними джерелами, в анотації
    її немає).

- id: reflective-cycle-router
  audience: router
  cards: [reflective-cycle]
  title: "Епізод, який досі зачіпає"
  noticed: >-
    Типові ситуації: людина посварилася з колегою і досі злиться; провалила співбесіду чи виступ і соромиться;
    помічає, що в схожих ситуаціях знову робить те саме («знову та сама історія»); керівник після
    невдалої розмови з підлеглим хоче зрозуміти свою роль. Спільне — конкретний минулий епізод з участю людини
    і почуття щодо нього.
  do: >-
    Плутають з five-whys: якщо зламався процес, продукт чи техніка і треба знайти механізм збою — five-whys;
    якщо людина хоче зрозуміти себе в цій історії — reflective-cycle. Плутають із socratic-questioning: якщо
    перевіряють одне переконання саме по собі, без конкретного епізоду, — socratic-questioning. Якщо подія
    ще не сталася і людина дивиться вперед — goal-to-plan чи pre-mortem. Якщо треба швидко обрати —
    reversible-doors або weighted-matrix.
  basis: >-
    Gibbs G., "Learning by Doing", 1988 — опис: University of Edinburgh, Reflection Toolkit, "Gibbs'
    reflective cycle" — https://reflection.ed.ac.uk/reflectors-toolkit/reflecting-on-experience/gibbs-reflective-cycle ;
    Argyris C., "Double Loop Learning in Organizations", Harvard Business Review, 1977 —
    бібліографію підтверджено через https://en.wikipedia.org/wiki/Double-loop_learning ; сторінку HBR не
    відкривав.

- id: reflective-cycle-facilitator
  audience: facilitator
  cards: [reflective-cycle]
  title: "Почуття окремо, правило — наприкінці"
  noticed: >-
    Найбільше допомагає, коли почуття заважають тверезо подивитися на пережите. Застрягають так: опис
    епізоду перетворюється на нескінченну сповідь з оцінками; почуття змішуються з фактами; людина
    картає себе замість шукати урок; висновок хитається в протилежний бік; план розмитий. University of
    Edinburgh радить тримати опис фактичним, оцінки лишати на потім, не відповідати на всі допоміжні питання
    і робити план конкретним.
  do: >-
    Для опису: «що було сказано і зроблено — так, ніби це зняла камера?»; оцінки м'яко відкладати до етапу
    «що вийшло». Для почуттів: «що ви відчували тоді? а що зараз?». Якщо самобичування — «що в цьому
    епізоді вийшло, хай навіть мало?». Для другої петлі: «яке правило ви тоді виконували — «я мушу…», «не
    можна…»? звідки воно і чи служить вам досі?». Наприкінці одна дія для схожої ситуації — словами людини.
  basis: >-
    University of Edinburgh, Reflection Toolkit, "Gibbs' reflective cycle" —
    https://reflection.ed.ac.uk/reflectors-toolkit/reflecting-on-experience/gibbs-reflective-cycle ;
    Wikipedia, "Double-loop learning" (Argyris 1977) — https://en.wikipedia.org/wiki/Double-loop_learning .

- id: reversible-doors-router
  audience: router
  cards: [reversible-doors]
  title: "Застряг перед вибором, часу мало"
  noticed: >-
    Типові ситуації: людина тиждень не може вирішити, чи брати пропозицію, і не спить; треба відповісти
    роботодавцю чи орендодавцю до завтра; дрібне за суттю рішення (курс, підписка, пробний місяць) подається
    як катастрофа «назавжди»; людина боїться помилитися і через страх нічого не обирає. Bezos пише, що
    багато рішень оборотні — «двері в обидва боки» — і для них годиться легкий процес.
  do: >-
    Плутають з wrap-decision: якщо людина спокійна, має час, а рішення справді незворотне і важливе —
    wrap-decision; якщо тривога, часу обмаль або рішення можна скасувати — reversible-doors. Плутають з
    weighted-matrix: варіанти чіткі, людина спокійна і хоче ґрунтовно зважити — weighted-matrix. Якщо це
    дилема двох справжніх потреб — evaporating-cloud; якщо людина знає, що правильно, і боїться лише дії —
    mental-contrasting.
  basis: >-
    Bezos J., "2016 Letter to Shareholders", Amazon — https://www.aboutamazon.com/news/company-news/2016-letter-to-shareholders ;
    Farnam Street, "Reversible and Irreversible Decisions" (цитата Bezos про Type 1/Type 2) —
    https://fs.blog/reversible-irreversible-decisions/ ; Welch S., "10-10-10", 2009 — опис:
    https://www.nbforum.com/newsroom/blog/suzy-welch-the-10-10-10-technique/ .

- id: reversible-doors-facilitator
  audience: facilitator
  cards: [reversible-doors]
  title: "Що можна скасувати і чого це коштує"
  noticed: >-
    Найбільше допомагає при паралічі від страху. Застрягають так: людина вважає незворотним усе рішення,
    хоча незворотна лише його частина; або, навпаки, «оборотне» стає приводом не думати про ціну повернення;
    погляд через 10 років лякає ще більше. Welch каже, що 10-10-10 змушує зрозуміти, що для людини справді
    важить; у листі Bezos радить вирішувати, маючи приблизно 70 % потрібної інформації.
  do: >-
    Для оборотності: «що станеться, якщо через місяць ви захочете повернутися? що з цього можна скасувати,
    а що ні? чого це коштуватиме — грошима, стосунками, часом?». Якщо «все незворотне» — розібрати на
    частини і спитати про кожну. Для 10/10/10: «як ви почуватиметеся щодо цього варіанта через десять
    хвилин? через десять місяців? через десять років?»; якщо далеке майбутнє лякає — лишити 10 місяців.
    Наступний крок відповідно до типу дверей обирає людина.
  basis: >-
    Bezos J., 2016 Letter — https://www.aboutamazon.com/news/company-news/2016-letter-to-shareholders
    (перевірено: «Many decisions are reversible, two-way doors» і «around 70%»; терміни Type 1/Type 2 — за
    https://fs.blog/reversible-irreversible-decisions/ , рік листа там не вказано); Welch S. —
    https://www.nbforum.com/newsroom/blog/suzy-welch-the-10-10-10-technique/ .

- id: scamper-router
  audience: router
  cards: [scamper]
  title: "Працює, але не так — бракує ідей"
  noticed: >-
    Типові ситуації: власниця кав'ярні хоче оновити меню чи формат, не вигадуючи все з нуля; організатор
    щорічної події бачить, що вона приїлася; викладач хоче змінити курс, який «працює, але нудно»; команда
    застрягла на одному-двох очевидних покращеннях продукту.
  do: >-
    Плутають з first-principles: якщо під сумнівом сама основа («а чи потрібне це взагалі?») або нічого ще
    немає — first-principles; якщо є конкретна річ і треба ідей, як її змінити, — scamper. Якщо варіанти
    вже є і треба вибрати — weighted-matrix. Якщо щось зламалося і людина шукає причину — five-whys чи
    is-is-not: генерація змін до знайденої причини лише заплутає. Якщо людина перевантажена чи не може
    почати — не ця картка.
  basis: >-
    Eberle B., "SCAMPER: Games for Imagination Development", 1971; Osborn A. F., "Applied Imagination",
    1953 — обидва за Wikipedia, "SCAMPER" — https://en.wikipedia.org/wiki/SCAMPER (книг не відкривав).

- id: scamper-facilitator
  audience: facilitator
  cards: [scamper]
  title: "Не анкета, а розмова від речі"
  noticed: >-
    Найбільше допомагає, коли річ конкретна і мірило «краще» назване. Застрягають так: напрямки проходять
    як анкету з семи пунктів, і відповіді виходять формальні; людина одразу критикує кожну ідею («це вже
    пробували»); ідеї косметичні (колір, назва) замість змін; на «перевернути навпаки» кажуть «не розумію».
    Метод виходить із того, що оригінальне часто народжується з видозміни наявного.
  do: >-
    Не йти по всіх літерах: обрати 2–3 напрямки, найближчі до мети людини, і питати через її річ: «що, якби
    клієнт робив цей крок сам? що, якби прибрати найдорожчу частину? звідки — з іншої галузі — можна
    позичити?». Критику відкласти: «запишемо, оцінимо в кінці». Для перевертання: «що, якби порядок був
    зворотний? якби платив не той, хто платить зараз?». Наприкінці — повернутися до мірила «краще» і дати
    людині вибрати 1–2 ідеї й перший крок.
  basis: >-
    Wikipedia, "SCAMPER" — https://en.wikipedia.org/wiki/SCAMPER ; iSixSigma, "SCAMPER" —
    https://www.isixsigma.com/dictionary/scamper/ (сторінку не відкривав, лише видача). Строгих досліджень
    ефекту немає (як у картці).

- id: socratic-questioning-router
  audience: router
  cards: [socratic-questioning]
  title: "Переконання, що звучить як аксіома"
  noticed: >-
    Типові ситуації: людина каже «я завжди все завалюю» перед новим проєктом; вважає, що «просити допомоги —
    слабкість», і тягне все сама; план тримається на неперевіреному «бо так роблять усі» чи «без цього нічого
    не вийде»; катастрофізує: «мене ніколи не візьмуть». Ознака — «завжди», «ніколи», «усі», оцінка подана
    як факт.
  do: >-
    Плутають з consider-opposite: якщо висновок про зовнішню ситуацію чи позицію опонента — consider-opposite;
    якщо переконання людини про себе, інших чи світ, яке звужує її вибір, — socratic-questioning. Плутають
    з mental-contrasting: якщо переконання вже перевірене і людина просто не починає — mental-contrasting.
    Якщо засади задачі («так заведено в галузі») — first-principles. Якщо людина дуже засмучена і хоче, щоб
    її вислухали, — не розбирати думки.
  basis: >-
    Braun J. D., Strunk D. R., Sasso K. E., Cooper A. A., "Therapist use of Socratic questioning predicts
    session-to-session symptom change in cognitive therapy for depression", Behaviour Research and
    Therapy, 2015 — https://pmc.ncbi.nlm.nih.gov/articles/PMC4449800 ; Padesky C. A., "Socratic
    Questioning: Changing Minds or Guiding Discovery?", 1993 — https://padesky.com/wp-content/uploads/2012/11/socquest.pdf .

- id: socratic-questioning-facilitator
  audience: facilitator
  cards: [socratic-questioning]
  title: "Відкривати, а не переконувати"
  noticed: >-
    Найбільше допомагає, коли переконання звужує вибір, а людина готова думати. Padesky (1993) обстоює, що
    мета сократівських питань — допомогти відкрити, а не змінити думку; Beck зі співавторами радили питати
    замість сперечатися. Застрягають так: питання шикуються в допит, і людина захищається; ведучий
    непомітно підставляє свою «правильну» думку; розмова зсувається в почуття замість думки; на «звідки ви це
    знаєте?» людина каже «просто знаю».
  do: >-
    Почати з точного формулювання: «як би ви сказали це одним реченням?». Далі по одному питанню: «на чому
    це тримається — факти, досвід, чиїсь слова?», «чи був випадок, коли це не справдилося?», «як ще можна
    пояснити те саме?», «що б ви сказали другові з такою думкою?». Якщо «просто знаю» — «коли ви вперше так
    подумали?». Точнішу версію переконання формулює людина; ведучий не оголошує думку хибною. Це інструмент
    мислення, не терапія.
  basis: >-
    Padesky C. A., 1993 — https://padesky.com/wp-content/uploads/2012/11/socquest.pdf (PDF зашифрований,
    зміст — за описом https://www.psychologytools.com/professional/techniques/socratic-questioning-socratic-dialogue );
    Braun et al., 2015 — https://pmc.ncbi.nlm.nih.gov/articles/PMC4449800 (спостережне дослідження,
    55 пацієнтів, причинності не доводить).

- id: traction-channels-router
  audience: router
  cards: [traction-channels]
  title: "Перші клієнти були — звідки наступні"
  noticed: >-
    Типові ситуації: майстер чи репетитор отримав перших клієнтів від знайомих, і вони скінчилися;
    невеликий онлайн-магазин виріс на одному форумі чи ярмарку, який вичерпався; засновник розривається між
    Instagram, рекламою, партнерами і холодними дзвінками; людина хоче вкласти гроші в рекламу, але спершу
    зрозуміти, що працює.
  do: >-
    Плутають з demand-test: якщо ще ніхто нічого не купив — спершу demand-test, а не канали. Плутають з
    offer-design: клієнти приходять, але не купують, бо незрозуміло, що отримають, — offer-design. Плутають
    з positioning: людина не знає, хто її найкращий клієнт, — каналу нема для кого обирати, спершу
    positioning. Якщо канали є, і питання, чи окупається кожен клієнт, — unit-economics.
  basis: >-
    Weinberg G., Mares J., "Traction", 2014 — опис Bullseye: Goodreads author blog, "How To Use The
    Bullseye Framework For Marketing Channel Prioritization" —
    https://www.goodreads.com/author_blog_posts/18671171-how-to-use-the-bullseye-framework-for-marketing-channel-prioritization .
    Книгу не відкривав; джерело одне і вторинне.

- id: traction-channels-facilitator
  audience: facilitator
  cards: [traction-channels]
  title: "Ширше коло, дешевий тест, число успіху"
  noticed: >-
    Найбільше допомагає, коли попит уже підтверджено, а джерело клієнтів вичерпується. Застрягають так:
    людина розглядає лише звичні канали (соцмережі, реклама); хоче робити все одночасно; запускає тест без
    числа успіху і потім не знає, чи спрацювало; не може пояснити, чому спрацював перший канал. Bullseye
    радить починати з недорогих тестів і зосереджуватися на тому, що дає клієнтів, а потім повторювати
    цикл.
  do: >-
    Для нинішнього джерела: «звідки прийшли ваші останні п'ять клієнтів? чому вони повірили саме там?». Для
    ширшого кола: пройтися по типах каналів, про які людина не думала (партнери, події, контент, прямі
    продажі, сарафан), і на кожен спитати «чи бувають там ваші клієнти?». Для тесту: «скільки клієнтів чи
    заявок за два тижні означатиме, що канал вартий продовження?». Два-три канали обирає людина.
  basis: >-
    Weinberg G., Mares J., "Traction", 2014 — https://www.goodreads.com/author_blog_posts/18671171-how-to-use-the-bullseye-framework-for-marketing-channel-prioritization ;
    Graham Mann, book notes "Traction" — https://grahammann.net/book-notes/traction-gabriel-weinberg
    (сторінку не відкривав, лише видача). Практика стартапів, без досліджень.

- id: unit-economics-router
  audience: router
  cards: [unit-economics]
  title: "Чи сходяться числа на одного клієнта"
  noticed: >-
    Типові ситуації: власниця салону хоче заробляти певну суму на місяць і не розуміє, чи модель узагалі це
    дасть; онлайн-школа платить за рекламу і підозрює, що кожен учень коштує більше, ніж приносить; перед
    орендою, наймом чи кредитом треба знати, з якого обсягу бізнес виходить у нуль; людина називає ціну,
    оренду, відсоток майстрам і просить «скласти це».
  do: >-
    Плутають з value-pricing: якщо людина ще не знає, скільки брати, — спершу value-pricing, потім арифметика.
    Плутають з weighted-matrix: якщо гроші — лише один із критеріїв серед інших цінностей (наприклад, вибір
    роботи) — weighted-matrix. Якщо питання — чи взагалі хтось купить — demand-test. Особисті фінанси без
    бізнесу — не ця картка.
  basis: >-
    Skok D., "SaaS Metrics 2.0", For Entrepreneurs — https://www.forentrepreneurs.com/saas-metrics-2/ .
    Метод — арифметика (як у картці); ситуації — узагальнення.

- id: unit-economics-facilitator
  audience: facilitator
  cards: [unit-economics]
  title: "Оптимістичні числа і забуті години"
  noticed: >-
    Найбільше допомагає, коли є бодай приблизні ціна, витрати і ціль. Застрягають так: на «скільки місяців
    клієнт лишається?» чи «скільки коштує залучити одного?» людина каже «не знаю»; бере найкращі числа
    («кожен залишиться на рік»); забуває власні години як витрату; не враховує тих, хто йде. Skok називає
    орієнтирами LTV:CAC понад 3 і окупність залучення до 12 місяців, але сам наголошує, що це орієнтири, а
    не правила, і радить спершу лагодити відтік, бо інакше це «діряве відро».
  do: >-
    Якщо «не знаю» — розкласти на множники, які людина знає: «скільки людей бачили рекламу минулого місяця?
    скільки з них прийшли? скільки ви витратили?» — і позначити кожне число як знане чи здогадку. Для
    оптимізму — порахувати також песимістичний варіант. Для годин: «скільки годин ви самі витрачаєте на
    одного клієнта і скільки варта ваша година?». Рахує ведучий, числа — лише людини; висновок, чи
    сходиться, — її.
  basis: >-
    Skok D., "SaaS Metrics 2.0" — https://www.forentrepreneurs.com/saas-metrics-2/ (LTV:CAC > 3, CAC
    payback < 12 міс., відтік; орієнтири для SaaS — для малих послуг їх не переносити механічно).

- id: value-pricing-router
  audience: router
  cards: [value-pricing]
  title: "Скільки брати — від цінності, не від витрат"
  noticed: >-
    Типові ситуації: фрилансер не знає, брати 300 чи 1500, і рахує від своїх годин; консультант відчуває, що
    для частини клієнтів його робота варта набагато більше; майстер бере «як усі на ринку»; людина хоче
    підняти ціну і «спитала клієнтів, чи нормально».
  do: >-
    Плутають з offer-design: якщо клієнт не бачить, що отримає, і ціна лише здається проблемою — спершу
    offer-design. Плутають з positioning: без знання, з чим порівнюють і для кого людина найкраща, ціні нема
    на що спертися — positioning. Плутають з unit-economics: ціну названо, а питання — чи сходиться бізнес
    загалом — unit-economics. Особиста покупка — не ця картка.
  basis: >-
    Forbis J. L., Mehta N. T., "Value-based strategies for industrial products", Business Horizons, 1981
    (McKinsey staff paper 1979) — опис EVC: McKinsey Quarterly, "Delivering value to customers" —
    https://www.mckinsey.com/capabilities/growth-marketing-and-sales/our-insights/delivering-value-to-customers ;
    Nagle T. T., Müller G., "The Strategy and Tactics of Pricing" — https://www.goodreads.com/book/show/4522828 .

- id: value-pricing-facilitator
  audience: facilitator
  cards: [value-pricing]
  title: "Найближча альтернатива — точка відліку"
  noticed: >-
    Найбільше допомагає, коли зміст пропозиції ясний. Застрягають так: людина не може назвати, що клієнт
    обрав би без неї («нічого», «конкурент»), і забуває «зробити самому» чи найняти когось; не знає, скільки
    варта кожна відмінність; рахує від собівартості; підтверджує ціну опитуванням. Відповіді на «скільки б
    заплатили?» завищені в середньому приблизно на 21 % (Schmidt і Bijmolt, 2020), особливо для дорожчих
    товарів.
  do: >-
    Для альтернативи: «що зробив би клієнт, якби вас не було? скільки це коштувало б йому грошима і часом?».
    Для відмінностей: «чим ви кращі — і що це заощаджує чи приносить клієнту? чим гірші?». Якщо «не знаю,
    скільки варта» — спитати про конкретного клієнта: що в нього змінилося після роботи. Стеля — альтернатива
    плюс відмінності; де під нею поставити ціну, вирішує людина. Перевірка — справжня пропозиція, не
    опитування.
  basis: >-
    McKinsey Quarterly, "Delivering value to customers" (EVC, Forbis і Mehta) —
    https://www.mckinsey.com/capabilities/growth-marketing-and-sales/our-insights/delivering-value-to-customers ;
    Schmidt J., Bijmolt T. H. A., Journal of the Academy of Marketing Science, 2020 —
    https://cris-portal.uni-muenster.de/portal/en/publication/60727941 .

- id: weighted-matrix-router
  audience: router
  cards: [weighted-matrix]
  title: "Два–чотири чіткі варіанти, спокійний тон"
  noticed: >-
    Типові ситуації: людина обирає між двома-трьома пропозиціями роботи; сім'я порівнює квартири; власник
    бізнесу обирає постачальника чи сервіс із трьох; студент вибирає між університетами. Ознаки — названо
    варіанти і їхні характеристики (ціна, відстань, зарплата), тон рівний, без паніки.
  do: >-
    Плутають з wrap-decision: якщо варіант один («чи робити X?») або варіантів ще немає — wrap-decision, щоб
    розширити вибір; якщо варіанти чіткі — weighted-matrix. Плутають з evaporating-cloud: якщо кожен варіант
    захищає справжню потребу і будь-який вибір щось руйнує — evaporating-cloud. Плутають з reversible-doors:
    тривога, параліч чи брак часу — reversible-doors, бо таблиця лише посилить страх. Якщо варіантів понад
    шість у продуктовому беклозі — opportunity-tree.
  basis: >-
    Stacey D. et al., "Decision aids for people facing health treatment or screening decisions", Cochrane
    Database of Systematic Reviews, 2024 — https://www.textbookofdigitalhealth.com/references/stacey2024decisionaids.html
    (сторінку Cochrane не відкрито, 403); Ottawa Personal Decision Guide — https://decisionaid.ohri.ca/decguide.html .

- id: weighted-matrix-facilitator
  audience: facilitator
  cards: [weighted-matrix]
  title: "Критерії з власних цінностей і звірка з відчуттям"
  noticed: >-
    Найбільше допомагає людям, які хочуть розібратися ґрунтовно. Застрягають так: критерії «як прийнято»
    («престиж», «стабільність»), а не свої; критерії дублюють одне одного (зарплата і дохід); людина
    підкручує ваги, поки не виграє «потрібний» варіант; таблиця підміняє людину. Ottawa Personal Decision
    Guide просить оцінити, наскільки кожна перевага і ризик важить саме для людини; огляд Stacey та ін. (2024)
    пов'язує такі посібники з ясністю власних цінностей.
  do: >-
    Для критеріїв: «що з цього ви відчуєте в звичайний вівторок через рік?», «чому вам це важливо?» — поки не
    прозвучить своя цінність. Для дублів: «якщо один варіант виграє за першим, чи виграє він автоматично і за
    другим?». Ваги — до оцінок варіантів. Якщо людина підкручує — назвати це спокійно: «схоже, якийсь варіант
    вам уже ближчий — що в ньому?». Наприкінці: «таблиця каже А — як вам від цього?»; рішення за людиною.
  basis: >-
    Ottawa Personal Decision Guide — https://decisionaid.ohri.ca/decguide.html ; Stacey et al., 2024 —
    https://www.textbookofdigitalhealth.com/references/stacey2024decisionaids.html ; Cochrane evidence
    bulletin 2024 — https://decisionaid.ohri.ca/docs/develop/Evidence%20Bulletin-%20Decision%20aids%20August%202024.pdf
    (PDF не відкривав, лише видача).

- id: wrap-decision-router
  audience: router
  cards: [wrap-decision]
  title: "«Чи варто мені…?» з високими ставками"
  noticed: >-
    Типові ситуації: людина вирішує, чи звільнятися з роботи, і бачить лише «так чи ні»; підприємець думає,
    чи продавати бізнес чи брати інвестора; родина вирішує, чи переїжджати в інше місто; хтось вагається, чи
    підписувати довгий контракт. Хіти пишуть, що важкі рішення псуються вузькою рамкою, пошуком
    підтверджень, короткочасною емоцією і самовпевненістю.
  do: >-
    Плутають з weighted-matrix: варіанти вже чітко названі і треба лише зважити — weighted-matrix; рамка
    «так чи ні» щодо однієї дії — wrap-decision. Плутають з reversible-doors: людина в тривозі, часу обмаль
    або рішення легко скасувати — reversible-doors. Плутають з pre-mortem: план уже обрано і його перевіряють
    на ризики — pre-mortem. Дві непримиренні потреби — evaporating-cloud.
  basis: >-
    Heath C., Heath D., "Decisive", 2013 — https://heathbrothers.com/books/decisive/ ; опис кроків WRAP:
    University of Florida HR, "WRAP Your Decisions" (транскрипт) —
    https://training.hr.ufl.edu/resources/LeadershipToolkit/transcripts/WRAPYourDecisionsPodcast.pdf
    (PDF не відкривав, лише видача).

- id: wrap-decision-facilitator
  audience: facilitator
  cards: [wrap-decision]
  title: "Ширше за «так чи ні» без підставних варіантів"
  noticed: >-
    Найбільше допомагає, коли людина спокійна і має 8–10 реплік. Застрягають так: на «які ще є варіанти?»
    кажуть «інших немає» або вигадують підставні, щоб обрати свій; перевірка реальністю стає нескінченним
    збиранням даних; на етапі відстані людина відповідає чужими пріоритетами («батьки кажуть»); на
    «підготуватися помилитися» — «я не помилюся». Larrick (2004) показав, що заклики «бути об'єктивним» не
    працюють, працюють зовнішні процедури — WRAP і є такою.
  do: >-
    Для ширшого вибору: «якби цей варіант зник, що б ви зробили?», «а можна і те, і те?», «хто вже розв'язував
    схоже — як?». Перевірку реальністю обмежити: «яку одну маленьку пробу можна зробити до рішення?». Для
    відстані: «що порадили б ви найкращому другові в цій ситуації?». Для помилки: «за яким раннім сигналом ви
    зрозумієте, що час переглянути рішення?». Варіант обирає людина.
  basis: >-
    Heath C., Heath D., "Decisive", 2013 — https://heathbrothers.com/books/decisive/ ; Larrick R. P.,
    "Debiasing", 2004 — https://scholars.duke.edu/publication/1056892 ; Shortform, "WRAP Decision-Making"
    (вторинний опис, не відкривав) — https://www.shortform.com/blog/wrap-decision-making/ .
