# Картка «Хмара, що розвіюється» — розв'язання дилеми через приховане хибне припущення (за Е. Голдраттом).
# Джерела в research 01: §7(ґ) слот 9, §7(г) рядок 20, §2 прогалина 2 (дилема як окремий намір), §7(д) рядок 10, §7(е) J7.
id: evaporating-cloud
title: Хмара, що розвіюється — дилема без гнилого компромісу

router:
  needs: >-
    Дві протилежні дії, кожна з яких здається людині необхідною заради чогось важливого.
  when_yes:
    - >-
      Людина відчуває, що мусить зробити X заради одного і водночас мусить не робити X заради іншого
      («треба скоротити витрати, але не можна втратити людей»).
    - >-
      Будь-який із двох шляхів щось руйнує, і людина не хоче ані жертвувати, ані ділити навпіл.
    - >-
      Конфлікт вимог між двома людьми чи відділами, де обидві сторони мають рацію щодо своєї потреби.
  when_no:
    - >-
      Варіантів кілька і вони не виключають одне одного за суттю — їх можна просто зважити за критеріями
      і обрати кращий.
    - >-
      Людина вже знає, що правильно, і одна «сторона» дилеми — це лише страх чи небажання діяти.
    - >-
      Людина зводить усе до однієї дії «робити чи ні» без двох протилежних потреб — їй треба розширити
      вибір, а не знімати протиріччя.
    - >-
      Людина хоче зрозуміти чужу позицію в суперечці, а не розв'язати власну дилему; або вона в гострій
      тривозі.
  signals:
    - «З одного боку я мушу…, але з іншого не можу…».
    - «Що б я не обрав — щось втрачу».
    - «Обидва мають рацію», «компроміс нікого не влаштує».
    - Названо дві потреби, які тягнуть у протилежні боки.

facilitator:
  purpose: >-
    Дилема виглядає як «або одне, або інше», але за кожною дією стоїть потреба, а між потребою і дією —
    припущення «мушу саме так». Еліягу Голдратт (1994) запропонував розкласти конфлікт на спільну мету,
    дві потреби і дві протилежні дії, а тоді шукати припущення, яке не витримує перевірки; щойно воно
    падає, з'являється рішення, що задовольняє обидві потреби без гнилого компромісу. Це усталена
    практика без суворих досліджень.
  stance: >-
    Неупереджений картограф конфлікту: однаково серйозно ставиться до обох сторін. Ведучий не підказує,
    яке припущення хибне, і не пропонує рішення; він питає «чому саме так?», а прорив знаходить людина.
  needs: >-
    Дві протилежні дії або вимоги, між якими людина розривається, — хоча б коротко.
  phases:
    - id: phase_1_two_actions
      title: Дві протилежні дії
      goal: >-
        назвати обидві дії, що виключають одна одну, словами людини.
      how:
        - >-
          Як: перепитати: «Отже, з одного боку ви відчуваєте, що мусите…, а з іншого — що мусите не…
          Так?» — і дати виправити.
        - >-
          Правило: дії мають бути конкретні й справді протилежні, не розмиті «краще» і «гірше».
      skip_if: обидві протилежні дії вже чітко названо в першому повідомленні.
      exit: є дві конкретні дії, які людина визнала несумісними.
    - id: phase_2_needs_and_goal
      title: Потреби і спільна мета
      goal: >-
        знайти потребу за кожною дією і спільну мету, якій служать обидві потреби.
      how:
        - >-
          Як: щодо кожної дії спитати, яку важливу потребу вона захищає — що буде втрачено, якщо її не
          зробити.
        - >-
          Як: спитати, заради чого людині потрібні обидві потреби разом — яка в них спільна мета.
        - >-
          Правило: потреба — це те, що треба зберегти, а не дія; якщо людина знову називає дію, спитати
          «а навіщо це?».
      exit: є дві потреби і спільна мета, і людина погоджується, що обидві потреби справжні.
    - id: phase_3_hidden_assumptions
      title: Чому «мушу саме так»
      goal: >-
        дістати припущення, що зв'язують кожну потребу з її дією, і знайти те, яке може бути хибним.
      how:
        - >-
          Як: проговорити зв'язок: «Щоб зберегти [потребу], ви мусите [дію], тому що…» — і попросити
          продовжити речення кількома способами.
        - >-
          Як: щодо кожного припущення спитати, чи завжди воно правдиве і чи бувало, що потреба
          задовольнялася інакше.
        - >-
          Правило: перевірити обидві сторони, а не лише ту, яку людина любить менше.
      exit: людина назвала хоча б одне припущення, у якому сумнівається.
    - id: phase_4_breakthrough
      title: Рішення, що розвіює хмару
      goal: >-
        знайти дію, яка задовольняє обидві потреби, бо обходить хибне припущення.
      how:
        - >-
          Як: спитати: «Якщо це припущення не тримається, що б ви могли зробити, щоб зберегти обидві
          потреби одразу?»
        - >-
          Як: перевірити знайдену ідею на кожній потребі окремо: чи справді вона її зберігає, і що в ній може
          не спрацювати.
        - Ця фаза не пропускається ніколи.
      exit: людина назвала дію, яка, на її думку, зберігає обидві потреби, і перший крок до неї.
  ending: >-
    Мапа конфлікту — спільна мета, дві потреби, дві дії — з названим хибним припущенням і рішенням, що
    зберігає обидві потреби. Зазвичай 6–9 реплік; якщо розмова тягнеться понад 11 — час підсумувати.
  traps:
    - name: Позиції замість потреб
      text: >-
        Людина називає як потребу ще одну дію («мені треба скоротити штат»). Питати «навіщо?», доки не
        прозвучить те, що треба зберегти («щоб компанія пережила рік»).
    - name: Солом'яна сторона
      text: >-
        Одну зі сторін людина описує слабко, наче вона вже програла. Попросити сформулювати її потребу так
        сильно, як сказала б людина, яка за неї стоїть.
    - name: Гнилий компроміс
      text: >-
        Людина пропонує «трохи того, трохи того», що наполовину руйнує обидві потреби. Перевірити ідею на
        кожній потребі окремо і повернутися до припущень.
    - name: Не той випадок
      text: >-
        Якщо варіантів кілька і їх можна просто зважити, якщо одна сторона — лише страх перед дією, якщо
        людина зважує одну дію «робити чи ні» без двох протилежних потреб, якщо вона хоче зрозуміти чужу
        позицію або перебуває в гострій тривозі — ця картка не підходить.
  pairs_well: >-
    Перед: Подумати протилежне: найсильніша версія іншої думки. Після: Бажання, перешкода і план «якщо —
    то»; Pre-mortem — «розтин» плану, який ще не почався.
